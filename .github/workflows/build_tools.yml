name: Build Tools (Linux)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
          - Oneplus 15
          - Oneplus 15R
          - Oneplus Ace 5
          - Oneplus Ace 5 Pro
          - Oneplus Ace 6
          - Oneplus Ace 6T
          - Oneplus Pad 3
          - Realme GT 7 Pro
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - Super Flasher
          - Regional Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - DS_FTP
          - Artifact Only
        default: DS_FTP
      notify_telegram:
        description: "Notify Telegram"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: [self-hosted, Linux, X64, netcup]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          # CRLF -> LF
          git ls-files '*.sh' | while read -r f; do sed -i 's/\r$//' "$f"; done

          # Make executable
          find build_scripts   -type f -name "*.sh" -exec chmod +x {} +
          find flasher_scripts -type f -name "*.sh" -exec chmod +x {} +

          # Binaries (if present)
          [ -f lpmake/lpmake ] && chmod +x lpmake/lpmake || true
          [ -f otaripper/otaripper ] && chmod +x otaripper/otaripper || true
          
      # ===============================================================================
      # ===============================================================================

      - name: Prep dirs and placeholder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p download "${OUT_DIR}"

          # URL säubern: trim, Quotes weg, \u0026 -> &
          raw="${{ inputs.ota_url }}"
          url="$(printf '%s' "$raw" \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                  -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" \
                  -e 's/\\u0026/\&/g')"

          echo "SANITIZED_URL=$url" >> "$GITHUB_ENV"

          if [ -z "$url" ]; then
            echo "Placeholder OTA for dry-run" > download/PLACEHOLDER.txt
            rm -f download/OTA.zip
            (cd download && zip -q OTA.zip PLACEHOLDER.txt)
          fi
          
      # ===============================================================================
      # ===============================================================================

      - name: Download OTA zip
        if: ${{ inputs.ota_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p download
          url="${{ inputs.ota_url }}"
          ftype="${{ inputs.flasher_type }}"

          # Download: Datei MUSS OTA.zip heißen (immer)
          if command -v aria2c >/dev/null 2>&1; then
            aria2c -x 8 -s 8 -c --file-allocation=none --retry-wait=5 --max-tries=10 --timeout=30 \
              --summary-interval=10 --console-log-level=notice  \
              --header="User-Agent: Dalvik/2.1.0 (Linux; U; Android 16; CPH2653 Build/AP3A.240617.008)" \
              --header="userId: oplus-ota|15002017" \
              --header="language: en-US" \
              --header="brand: oneplus-exp" \
              -o "download/OTA.zip" "$url"
          else
            curl -L --fail --retry 5 --retry-delay 5 \
              -H "User-Agent: Dalvik/2.1.0 (Linux; U; Android 16; CPH2653 Build/AP3A.240617.008)" \
              -H "userId: oplus-ota|15002017" \
              -H "language: en-US" \
              -H "brand: oneplus-exp" \
              -o "download/OTA.zip" "$url"
          fi
          
      # ===============================================================================
      # ===============================================================================

      - name: Export OTA env
        shell: bash
        run: |
          set -euo pipefail
          test -f "download/OTA.zip" || { echo "OTA.zip not found in download/"; exit 1; }
          ota="$(realpath download/OTA.zip)"
          ota_dir="$(dirname "$ota")"
          {
            echo "OTA_PATH=$ota"
            echo "OTA_DIR=$ota_dir"
          } >> "$GITHUB_ENV"
          
      # ===============================================================================
      # ===============================================================================

      - name: Extract OTA version (from META-INF/com/android/metadata)
        shell: bash
        run: |
          set -euo pipefail
          content="$(unzip -p "$OTA_PATH" META-INF/com/android/metadata 2>/dev/null || true)"
          [ -n "$content" ] || { echo "metadata not found in OTA.zip"; exit 1; }
          version_line="$(printf "%s" "$content" | grep -E '^version_name=')" || { echo "version_name not found in metadata"; exit 1; }
          val="${version_line#version_name=}"
          numeric="$(printf "%s" "$val" | grep -oE '[0-9]+(\.[0-9]+){1,4}' | awk '{ print length, $0 }' | sort -nr | head -n1 | cut -d" " -f2-)"
          [ -n "$numeric" ] || { echo "Could not parse numeric version from '$val'"; exit 1; }
          echo "version_name=$val"
          echo "$(printf "%s" "$content" | grep -E '^ota_version=')"
          echo "Parsed OTA version: $numeric"
          echo "OTA_VERSION=$numeric" >> "$GITHUB_ENV"
          
      # ===============================================================================
      # ===============================================================================

      - name: Map device → pick builder (LIST ONLY)
        shell: bash
        run: |
          set -euo pipefail

          dev_disp="${{ inputs.device }}"
          ftype="${{ inputs.flasher_type }}"
          region="${{ inputs.region }}"

          # ----------------------------
          # Device display → internal ID
          # ----------------------------
          declare -A DEV_MAP=(
            ["Oneplus 13"]="13"
            ["Oneplus 13R"]="13R"
            ["Oneplus 13S"]="13S"
            ["Oneplus 13T"]="13T"
            ["Oneplus 15"]="15"
            ["Oneplus 15R"]="15R"
            ["Oneplus Ace 5"]="Ace5"
            ["Oneplus Ace 5 Pro"]="Ace5Pro"
            ["Oneplus Ace 6"]="Ace6"
            ["Oneplus Ace 6T"]="Ace6T"
            ["Oneplus Pad 3"]="Pad3"
            ["Realme GT 7 Pro"]="GT7Pro"
          )
          
          dev="${DEV_MAP[$dev_disp]}"
          [[ -z "$dev" ]] && { echo "Unknown device: $dev_disp"; exit 1; }
          
          # ----------------------------
          # Super Size:  CN  ||  NON-CN
          # ----------------------------
          if [[ "$ftype" == "Super Flasher" || "$ftype" == "SuperHybrid Flasher" ]]; then
            declare -A SUPER_SIZE_TABLE=(
              ["13"]="15354134528 15354134528"
              ["13R"]="14266433536 14266433536"
              ["13S"]="14411628544 14411628544"
              ["13T"]="14956888064 14956888064"
              ["Ace5"]="14578294784 14578294784"
              ["Ace5Pro"]="14077349888 14077349888"
              ["Ace6"]="17272143872 17272143872"
              ["Ace6T"]="16886267904 16886267904"
              ["15"]="18907922432 18907922432"
              ["15R"]="16231956480 16231956480"
              ["Pad3"]="11711471616 11711471616"
              ["GT7Pro"]="15569256448 15569256448"
            )

            entry="${SUPER_SIZE_TABLE[$dev]}"
            [[ -z "$entry" ]] && {
              echo "ERROR: SUPER_SIZE not defined for device=$dev"
              exit 1
            }

            read -r CN_SIZE NON_CN_SIZE <<< "$entry"

            if [[ "$region" == "CN" ]]; then
              SUPER_SIZE="$CN_SIZE"
            else
              SUPER_SIZE="$NON_CN_SIZE"
            fi

            echo "SUPER_SIZE=$SUPER_SIZE" >> "$GITHUB_ENV"
            
            echo "Using SUPER_SIZE: $SUPER_SIZE"
          fi

          # ------------------------------------------------
          # LIST-ONLY BUILDER TABLE (NO WILDCARDS)
          # Key format: Flasher|Device|Region
          # ------------------------------------------------
          declare -A BUILDER_MAP

          # ===== SuperHybrid Flasher =====
          BUILDER_MAP["SuperHybrid Flasher|13|GLO"]="BUILD_SUPER"
          BUILDER_MAP["SuperHybrid Flasher|13|EU"]="BUILD_SUPER"
          BUILDER_MAP["SuperHybrid Flasher|13|IN"]="BUILD_SUPER"
          BUILDER_MAP["SuperHybrid Flasher|13|NA"]="BUILD_SUPER"
          BUILDER_MAP["SuperHybrid Flasher|13|CN"]="BUILD_SUPER"

          BUILDER_MAP["SuperHybrid Flasher|15|CN"]="BUILD_SUPER"
          BUILDER_MAP["SuperHybrid Flasher|15|EU"]="BUILD_SUPER"
          BUILDER_MAP["SuperHybrid Flasher|15|GLO"]="BUILD_SUPER"
          BUILDER_MAP["SuperHybrid Flasher|15|IN"]="BUILD_SUPER"

          BUILDER_MAP["SuperHybrid Flasher|Ace6|CN"]="BUILD_SUPER"

          # ===== Super Flasher =====
          BUILDER_MAP["Super Flasher|13R|CN"]="BUILD_SUPER"
          BUILDER_MAP["Super Flasher|13R|GLO"]="BUILD_SUPER"
          BUILDER_MAP["Super Flasher|13R|EU"]="BUILD_SUPER"
          BUILDER_MAP["Super Flasher|13R|IN"]="BUILD_SUPER"

          BUILDER_MAP["Super Flasher|13S|IN"]="BUILD_SUPER"

          BUILDER_MAP["Super Flasher|13T|IN"]="BUILD_SUPER"
          BUILDER_MAP["Super Flasher|13T|CN"]="BUILD_SUPER"
          
          BUILDER_MAP["Super Flasher|15R|EU"]="BUILD_SUPER"
          BUILDER_MAP["Super Flasher|15R|GLO"]="BUILD_SUPER"
          BUILDER_MAP["Super Flasher|15R|IN"]="BUILD_SUPER"
          
          BUILDER_MAP["Super Flasher|Ace5|CN"]="BUILD_SUPER"
          BUILDER_MAP["Super Flasher|Ace5|GLO"]="BUILD_SUPER"
          BUILDER_MAP["Super Flasher|Ace5|EU"]="BUILD_SUPER"
          BUILDER_MAP["Super Flasher|Ace5|IN"]="BUILD_SUPER"

          BUILDER_MAP["Super Flasher|Ace5Pro|CN"]="BUILD_SUPER"

          BUILDER_MAP["Super Flasher|Ace6|CN"]="BUILD_SUPER"
          
          BUILDER_MAP["Super Flasher|Ace6T|CN"]="BUILD_SUPER"
          BUILDER_MAP["Super Flasher|Ace6T|IN"]="BUILD_SUPER"
          
          BUILDER_MAP["Super Flasher|Pad3|GLO"]="BUILD_SUPER"
          BUILDER_MAP["Super Flasher|Pad3|EU"]="BUILD_SUPER"

          BUILDER_MAP["Super Flasher|GT7Pro|CN"]="BUILD_SUPER"
          BUILDER_MAP["Super Flasher|GT7Pro|EU"]="BUILD_SUPER"

          # ===== Regional Hybrid Flasher =====
          BUILDER_MAP["RegionalHybrid Flasher|13|GLO"]="BUILD_REGIONAL"
          BUILDER_MAP["RegionalHybrid Flasher|13|EU"]="BUILD_REGIONAL"
          BUILDER_MAP["RegionalHybrid Flasher|13|IN"]="BUILD_REGIONAL"
          BUILDER_MAP["RegionalHybrid Flasher|13|NA"]="BUILD_REGIONAL"
          BUILDER_MAP["RegionalHybrid Flasher|13|CN"]="BUILD_REGIONAL"
          
          BUILDER_MAP["RegionalHybrid Flasher|15|EU"]="BUILD_REGIONAL"
          BUILDER_MAP["RegionalHybrid Flasher|15|GLO"]="BUILD_REGIONAL"
          BUILDER_MAP["RegionalHybrid Flasher|15|IN"]="BUILD_REGIONAL"

          # ===== Regional Flasher =====
          BUILDER_MAP["Regional Flasher|Ace5|CN"]="BUILD_REGIONAL"
          
          BUILDER_MAP["Regional Flasher|Ace5Pro|CN"]="BUILD_REGIONAL"
          
          BUILDER_MAP["Regional Flasher|13R|GLO"]="BUILD_REGIONAL"
          BUILDER_MAP["Regional Flasher|13R|EU"]="BUILD_REGIONAL"
          BUILDER_MAP["Regional Flasher|13R|IN"]="BUILD_REGIONAL"
          BUILDER_MAP["Regional Flasher|13R|CN"]="BUILD_REGIONAL"
          
          BUILDER_MAP["Regional Flasher|13S|IN"]="BUILD_REGIONAL"
          
          BUILDER_MAP["Regional Flasher|15R|IN"]="BUILD_REGIONAL"

          # ------------------------------------------------
          key="$ftype|$dev|$region"
          base_name="${BUILDER_MAP[$key]}"

          if [[ -z "$base_name" ]]; then
            echo "❌ Unsupported combination:"
            echo "   Device:  $dev_disp"
            echo "   Flasher: $ftype"
            echo "   Region:  $region"
            exit 1
          fi

          echo "DEV=$dev" >> "$GITHUB_ENV"
          echo "FTYPE=$ftype" >> "$GITHUB_ENV"
          echo "REGION=$region" >> "$GITHUB_ENV"
          echo "BUILDER_SH=${base_name}.sh" >> "$GITHUB_ENV"

      # ===============================================================================
      # ===============================================================================

      - name: Stage files
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage_files.sh
          
      # ===============================================================================
      # ===============================================================================

      - name: Pre-stage flasher into OTA folder
        if: ${{ inputs.flasher_type == 'RegionalHybrid Flasher' || inputs.flasher_type == 'SuperHybrid Flasher' }}
        shell: bash
        run: |
          set -euo pipefail
          src="$WORK_DIR"
          [ -d "$src" ] || { echo "WORK_DIR not found: $src"; exit 1; }
          dst="$OTA_DIR/$(basename "$src")"
          mkdir -p "$dst"
          rsync -a --info=progress2 "$src/" "$dst/"
          [ -f "$OUT_DIR/otaripper" ] && cp -f "$OUT_DIR/otaripper" "$OTA_DIR/"
          
      # ===============================================================================
      # ===============================================================================

      - name: Run builder
        shell: bash
        working-directory: ${{ env.OTA_DIR }}
        run: |
          set -euo pipefail
          echo "CWD is $(pwd)"
          echo "Calling builder: \"$GITHUB_WORKSPACE/$OUT_DIR/$BUILDER_SH\" \"$OTA_PATH\""
          bash "$GITHUB_WORKSPACE/$OUT_DIR/$BUILDER_SH" "$OTA_PATH"
          
      # ===============================================================================
      # ===============================================================================

      - name: Package final output
        shell: bash
        run: |
          set -euo pipefail
          ota_dir="$OTA_DIR"
          dev_disp="${{ inputs.device }}"

          expected_name="$FTYPE"
          [[ "$REGION" == "CN" ]] && expected_name="$FTYPE CN"

          echo "Expected output folder: $expected_name"

          result_dir="$ota_dir/$expected_name"

          if [ ! -d "$result_dir" ]; then
            echo "ERROR: Expected output folder not found:"
            echo "  $result_dir"
            echo
            echo "Folders in OTA_DIR:"
            ls -la "$ota_dir" || true
            exit 1
          fi

          zip_root="$GITHUB_WORKSPACE/$OUT_DIR"
          mkdir -p "$zip_root"

          ftype_name="$FTYPE"
          region_code="$REGION"
          ver="${OTA_VERSION:-UNKNOWN}"

            case "$region_code" in
              CN)  region_disp="COS" ;;
              GLO) region_disp="GLO" ;;
              EU)  region_disp="EU" ;;
              IN)  region_disp="IN" ;;
              NA)  region_disp="NA" ;;
              *)   region_disp="$region_code" ;;
            esac
            
            case "$dev_disp" in
              "Oneplus 13")  device_model="13" ;;
              "Oneplus 13R") device_model="13R" ;;
              "Oneplus 13S")  device_model="13S" ;;
              "Oneplus 13T")  device_model="13T" ;;
              "Oneplus 15")  device_model="15" ;;
              "Oneplus 15R")  device_model="15R" ;;
              "Oneplus Ace 5")  device_model="A5" ;;
              "Oneplus Ace 5 Pro")  device_model="A5P" ;;
              "Oneplus Ace 6")  device_model="A6" ;;
              "Oneplus Ace 6T")  device_model="A6T" ;;
              "Oneplus Pad 3")  device_model="Pad3" ;;
              "Realme GT 7 Pro")  device_model="GT7Pro" ;;
              *)   device_model="$dev_disp" ;;
            esac

            # 🔥 Oneplus 15 + SuperHybrid Flasher + EU/GLO/IN
            # 🔥 Oneplus 15 + SuperHybrid Flasher + EU/GLO/IN
            if [[ "$DEV" == "15" && "$FTYPE" == "SuperHybrid Flasher" ]]; then
              case "$region_code" in
                EU)  artifact_base="${ftype_name} 15 CN2EU ${ver}" ;;
                GLO) artifact_base="${ftype_name} 15 CN2GLO ${ver}" ;;
                IN)  artifact_base="${ftype_name} 15 CN2IN ${ver}" ;;
                *)   artifact_base="${ftype_name} ${region_disp} ${ver}" ;;
              esac
            elif [[ "$DEV" == "GT7Pro" && "$FTYPE" == "Super Flasher" ]]; then
              case "$region_code" in
                EU)  artifact_base="${ftype_name} GT7Pro CN2EU ${ver}" ;;
                GLO) artifact_base="${ftype_name} GT7Pro CN2GLO ${ver}" ;;
                IN)  artifact_base="${ftype_name} GT7Pro CN2IN ${ver}" ;;
                *)   artifact_base="${ftype_name} ${region_disp} ${ver}" ;;
              esac
            else
              case "$DEV" in
                "13T")
                  if [[ "$REGION" == "CN" ]]; then
                    os_tag="COS"
                  else
                    os_tag="OOS"
                  fi
                  artifact_base="${ftype_name} 13T ${region_disp} ${ver}"
                  ;;
                "Ace5")
                  if [[ "$region_code" == "CN" ]]; then
                    artifact_base="${ftype_name} A5 COS ${ver}"
                  else
                    artifact_base="${ftype_name} A5 ${region_code} OOS+COS ODM ${ver}"
                  fi
                  ;;
                "Ace6T")
                  if [[ "$REGION" == "CN" ]]; then
                    os_tag="COS"
                  else
                    os_tag="${region_disp} OOS+COS ODM"
                  fi
                  artifact_base="${ftype_name} A6T ${os_tag} ${ver}"
                  ;;
                *)
                  artifact_base="${ftype_name} ${device_model} ${region_disp} ${ver}"
                  ;;
              esac
            fi

          zip_path="$zip_root/${artifact_base}.zip"
          rm -f "$zip_path"

          echo "================ Packaging info ================"
          echo "Source folder : $result_dir"
          echo "Artifact name : $artifact_base"
          echo "ZIP output    : $zip_path"
          echo "================================================"

          cd "$result_dir"
          
          echo "================ Folder tree (max depth 8) ================"
          tree -L 8 -h . || echo "tree not available"
          echo "Total size:"
          du -sh .
          echo "==========================================================="
          

          if command -v 7zz >/dev/null 2>&1; then
            seven=7zz
          elif command -v 7z >/dev/null 2>&1; then
            seven=7z
          else
            seven=""
          fi

          if [ -n "$seven" ]; then
            "$seven" a -tzip -mm=Deflate -mx=3 -mfb=32 -mmt=on -bso0 -bsp0 "$zip_path" .
          else
            zip -qr -3 "$zip_path" .
          fi

          [ -f "$zip_path" ] || { echo "Packaging failed: ZIP not created at $zip_path"; exit 1; }

          {
            echo "ARTIFACT_NAME=$artifact_base"
            echo "ZIP_FILE=$zip_path"
          } >> "$GITHUB_ENV"
          
      # ===============================================================================
      # ===============================================================================

      - name: Upload artifact
        if: ${{ inputs.upload_to == 'Artifact Only' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          
      # ===============================================================================
      # ===============================================================================

      - name: Compute upload paths
        shell: bash
        run: |
          set -euo pipefail
          device="${{ inputs.device }}"
          ftype="${{ inputs.flasher_type }}"
          region="${{ inputs.region }}"
          dev_disp="${{ inputs.device }}"

          # -----------------------------
          # Base category & relative path
          # -----------------------------
          if [[ "$ftype" == "Super Flasher" && "$region" != "CN" && ( "$device" == "Oneplus 13T" || "$device" == "Oneplus Ace 6T" ) ]]; then
            category="OxygenOS Flashers"
            rel="$device/$category"
          else
            if [[ "$ftype" =~ ^(SuperHybrid\ Flasher|Super\ Flasher)$ ]]; then
              category="Super Flashers"
            else
              category="Regional Flashers"
            fi
            rel="$device/$category"
          fi

          # -----------------------------
          # Devices that do NOT get region subfolders
          # -----------------------------
          no_region_devices=(
            "Oneplus 13S"
            "Oneplus 13T"
            "Oneplus Ace 5"
            "Oneplus Ace 5 Pro"
            "Oneplus Ace 6"
            "Oneplus Ace 6T"
          )

          needs_region=1
          for n in "${no_region_devices[@]}"; do
            [[ "$n" == "$device" ]] && needs_region=0
          done

          # -----------------------------
          # Special OxygenOS case for Ace 5
          # -----------------------------
          if [[ "$device" == "Oneplus Ace 5" && "$region" != "CN" ]]; then
            rel="$device/OxygenOS/$category"

          # -----------------------------
          # Region subfolder (COS / Global / EU / IN / NA)
          # -----------------------------
          elif [[ $needs_region -eq 1 ]]; then
            case "$region" in
              CN)  region_folder="COS" ;;
              GLO) region_folder="Global" ;;
              EU)  region_folder="EU" ;;
              IN)  region_folder="IN" ;;
              NA)  region_folder="NA" ;;
              *)   region_folder="$region" ;;
            esac
            rel="$rel/$region_folder"
          fi

          # -----------------------------
          # Normalize + export
          # -----------------------------
          rel="${rel//\\//}"
          [[ "${rel: -1}" == "/" ]] || rel="${rel}/"
          echo "REL_UPLOAD_DIR=$rel" >> "$GITHUB_ENV"

          ftp_base="$(printf "%s" "${{ secrets.DS_FTP_PATH }}" | sed 's#^/*##; s#/*$##;')"
          if [ -n "$ftp_base" ]; then
            ftp_abs="$ftp_base/$rel"
          else
            ftp_abs="$rel"
          fi
          echo "FTP_UPLOAD_DIR=$ftp_abs" >> "$GITHUB_ENV"
          
      # ===============================================================================
      # ===============================================================================

      - name: Upload to DS_FTP
        if: ${{ inputs.upload_to == 'DS_FTP' }}
        env:
          DS_FTP_HOST: ${{ secrets.DS_FTP_HOST }}
          DS_FTP_USER: ${{ secrets.DS_FTP_USER }}
          DS_FTP_PASS: ${{ secrets.DS_FTP_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DS_FTP_HOST:?Missing DS_FTP_HOST}"
          : "${DS_FTP_USER:?Missing DS_FTP_USER}"
          : "${DS_FTP_PASS:?Missing DS_FTP_PASS}"

          remote_dir="$(printf "%s" "$FTP_UPLOAD_DIR" | sed 's#^/*##')"
          file_name="${ARTIFACT_NAME}.zip"
          zip_path="$ZIP_FILE"
          [ -f "$zip_path" ] || { echo "ZIP not found: $zip_path"; exit 1; }

          if command -v python3 >/dev/null 2>&1; then
            enc_path="$(python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1], safe='/'))" "${remote_dir}${file_name}")"
          else
            enc_path="$(printf '%s' "${remote_dir}${file_name}" \
              | sed -e 's/%/%25/g' -e 's/ /%20/g' -e 's/#/%23/g' -e 's/+/%2B/g' -e 's/?/%3F/g')"
          fi

          part_url="ftp://${DS_FTP_HOST}/${enc_path}.filepart"
          echo "Uploading via curl to: $part_url"

          curl --ftp-pasv --disable-eprt --ftp-method nocwd \
               --user "${DS_FTP_USER}:${DS_FTP_PASS}" \
               --ftp-create-dirs \
               -T "$zip_path" "$part_url" \
               --fail --show-error --silent

          cwd_path="${remote_dir%/}"
          if [[ -n "$cwd_path" ]]; then CWD_Q=(-Q "CWD $cwd_path"); else CWD_Q=(); fi

          curl --ftp-pasv --disable-eprt -sS -o /dev/null \
               --user "${DS_FTP_USER}:${DS_FTP_PASS}" "ftp://${DS_FTP_HOST}/" \
               "${CWD_Q[@]}" \
               -Q "RNFR ${file_name}.filepart" \
               -Q "RNTO ${file_name}" \
               --fail --show-error --silent
               
      # ===============================================================================
      # ===============================================================================

      - name: Telegram notify
        if: ${{ inputs.upload_to == 'DS_FTP' }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8

          device_disp="${{ inputs.device }}"
          region="$REGION"
          artifact="$ARTIFACT_NAME"
          ftp_rel_dir="$FTP_UPLOAD_DIR"

          # -----------------------------
          # Device -> Chat ID mapping
          # -----------------------------
          chat_id=""
          chat_name=""
          case "$device_disp" in
            "Oneplus 13"|"Oneplus 13R"|"Oneplus 13S"|"Oneplus 13T"|"Oneplus Ace 5"|"Oneplus Ace 5 Pro")
              chat_id="-1001902568181"
              chat_name="Oneplus 13 Group"
              ;;
            "Oneplus 15"|"Oneplus 15R"|"Oneplus Ace 6"|"Oneplus Ace 6T")
              chat_id="-1001903485514"
              chat_name="Oneplus 15 Group"
              ;;
            *)
              echo "ℹ️ Telegram: No group mapping for device '$device_disp' -> skipping notify."
              exit 0
              ;;
          esac

          # -----------------------------
          # Build links (same logic as before)
          # -----------------------------
          raw_path="Files/${ftp_rel_dir}${artifact}.zip"
          enc_raw="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$raw_path")"
          enc_raw="${enc_raw//%20/+}"
          zip_link="https://roms.danielspringer.at/download.php?file=${enc_raw}&download=true"

          zip_dir="$ftp_rel_dir"
          zip_dir="${zip_dir#Files/}"
          zip_dir="${zip_dir#/}"
          zip_plain="${zip_dir}${artifact}.zip"

          zip_param="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$zip_plain")"
          zip_param="${zip_param//%20/+}"

          if [[ "$region" == "CN" ]]; then
            img_folder="COS_FILES_HERE"
          else
            img_folder="OOS_FILES_HERE"
          fi

          boot_param="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "${img_folder}/boot.img")"
          boot_param="${boot_param//%20/+}"
          init_boot_param="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "${img_folder}/init_boot.img")"
          init_boot_param="${init_boot_param//%20/+}"

          boot_link="https://roms.danielspringer.at/download_from_zip.php?zip=${zip_param}&file=${boot_param}"
          init_boot_link="https://roms.danielspringer.at/download_from_zip.php?zip=${zip_param}&file=${init_boot_param}"

          # -----------------------------
          # Always log what would happen
          # -----------------------------
          echo "================ Telegram notify (dry info) ================"
          echo "Device:   $device_disp"
          echo "Region:   $region  -> img_folder=$img_folder"
          echo "Artifact: $artifact"
          echo "Target:   $chat_name ($chat_id)"
          echo "ZIP:      $zip_link"
          echo "boot.img: $boot_link"
          echo "init_boot.img: $init_boot_link"
          echo "notify_telegram input: ${{ inputs.notify_telegram }}"
          echo "============================================================"

          # -----------------------------
          # Send only if enabled
          # -----------------------------
          if [[ "${{ inputs.notify_telegram }}" != "true" ]]; then
            echo "ℹ️ Telegram: notify_telegram=false -> not sending (log-only)."
            exit 0
          fi

          payload_path="$RUNNER_TEMP/tg_payload.json"
          CHAT_ID="$chat_id" DEVICE="$device_disp" ARTIFACT="$artifact" ZIP="$zip_link" BOOT="$boot_link" INIT="$init_boot_link" OUT="$payload_path" \
          python3 -c 'import os,json; p={"chat_id":int(os.environ["CHAT_ID"]),"text":"✨ <b>New Build released</b> ✨\n"+os.environ["DEVICE"]+" <b>"+os.environ["ARTIFACT"]+"</b>","parse_mode":"HTML","disable_web_page_preview":True,"reply_markup":{"inline_keyboard":[[{"text":"⬇️ Download ZIP","url":os.environ["ZIP"]}],[{"text":"📦 boot.img","url":os.environ["BOOT"]},{"text":"📦 init_boot.img","url":os.environ["INIT"]}]]}}; open(os.environ["OUT"],"w",encoding="utf-8").write(json.dumps(p, ensure_ascii=False, separators=(",",":")))'

          test -s "$payload_path" || { echo "Telegram payload not created"; exit 1; }

          curl -fsS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
               -H "Content-Type: application/json; charset=utf-8" \
               --data-binary "@${payload_path}"

          echo "✅ Telegram: sent to $chat_name ($chat_id)."
