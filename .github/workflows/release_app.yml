name: Native desktop releases
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release version (v1.0.0)
        required: true
        default: v1.0.0
permissions:
  contents: read
concurrency:
  group: native-desktop-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/publish_app_release.py --prepare --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            archive: FlasherBuilder-linux-x86_64.tar.gz
          - os: windows-2022
            platform: windows
            archive: FlasherBuilder-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI and packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.17.0
      - name: Install Qt runtime libraries on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
      - name: Fetch pinned native tools
        run: python scripts/fetch_tools.py --platform all
      - name: Run regression tests
        timeout-minutes: 5
        run: python -m unittest discover -s tests -v
      - name: Exercise native extraction and builders
        run: python flasher-worker.py --self-test --output runner-tests
      - name: Package native GUI and worker
        run: python scripts/package_app.py --native
      - name: Test the extracted package
        run: python scripts/verify_package.py dist/${{ matrix.archive }} --report dist/validation-${{ matrix.platform }}.json
      - name: Upload verified package to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/publish_app_release.py --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --upload "dist/${{ matrix.archive }}" "dist/validation-${{ matrix.platform }}.json" "dist/validation-${{ matrix.platform }}.log"
      - name: Upload source package to draft release
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/publish_app_release.py --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --upload dist/FlasherBuilder-source-linux-windows.zip
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate both packages and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/publish_app_release.py --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --download release-files
          python3 scripts/publish_app_release.py --directory release-files --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
