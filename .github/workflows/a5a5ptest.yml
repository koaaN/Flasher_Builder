name: Upload Test

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
          - Oneplus Ace 5
          - Oneplus Ace 5 Pro
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
          - Super Flasher
          - Regional Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - DS_FTP
          - Sourceforge
          - "Both DS_FTP & Sourceforge"
          - Artifact Only
        default: Artifact Only

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prep dirs and placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "download","$env:OUT_DIR" | Out-Null
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            Set-Content -Path "download\PLACEHOLDER.txt" -Value "Placeholder OTA for dry-run"
            if (Test-Path "download\OTA.zip") { Remove-Item "download\OTA.zip" -Force }
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\OTA.zip" -Force
          }

      - name: Download OTA zip (aria2 → curl fallback)
        if: ${{ inputs.ota_url != '' }}
        shell: cmd
        run: |
          mkdir download
          if exist aria2\aria2c.exe (
            echo Using aria2c for OTA download...
            aria2\aria2c.exe -x 8 -s 8 -c --file-allocation=none --retry-wait=5 --max-tries=10 --timeout=30 -o download\OTA.zip "${{ inputs.ota_url }}"
          ) else (
            echo aria2c.exe not found, falling back to curl...
            curl -L -o download\OTA.zip "${{ inputs.ota_url }}"
          )

      - name: Export OTA env
        shell: pwsh
        run: |
          if (-not (Test-Path "download\OTA.zip")) { throw "OTA.zip not found in download\" }
          $ota = (Resolve-Path 'download\OTA.zip').Path
          $otaDir = Split-Path -Path $ota -Parent
          "OTA_PATH=$ota"    | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTA_DIR=$otaDir"  | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Extract OTA version (from META-INF/com/android/metadata)
        shell: pwsh
        run: |
          $ota = $env:OTA_PATH
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = [System.IO.Compression.ZipFile]::OpenRead($ota)
          try {
            $entry = $zip.Entries | Where-Object {
              ($_.FullName -replace '\\','/') -ieq 'META-INF/com/android/metadata'
            }
            if (-not $entry) { throw "metadata not found in OTA.zip" }
            $sr = New-Object System.IO.StreamReader($entry.Open())
            $content = $sr.ReadToEnd()
            $sr.Close()
          } finally {
            $zip.Dispose()
          }

          $versionLine = ($content -split "`r?`n") | Where-Object { $_ -match '^version_name=' } | Select-Object -First 1
          if (-not $versionLine) { throw "version_name not found in metadata" }
          $val = $versionLine.Substring('version_name='.Length)

          $m = [regex]::Matches($val, '\d+(?:\.\d+){1,4}')
          if ($m.Count -eq 0) { throw ("Could not parse numeric version from '{0}'" -f $val) }
          $numeric = ($m | Sort-Object { $_.Value.Length } -Descending | Select-Object -First 1).Value

          "OTA_VERSION=$numeric" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host ("Parsed OTA version: {0}" -f $numeric)

      - name: Map device → pick builder
        shell: pwsh
        run: |
          $devDisp = "${{ inputs.device }}"
          $dev = switch ($devDisp) {
            'Oneplus 13'        { '13' }
            'Oneplus 13R'       { '13R' }
            'Oneplus 13S'       { '13S' }
            'Oneplus 13T'       { '13T' }
            'Oneplus Ace 5'     { 'Ace5' }
            'Oneplus Ace 5 Pro' { 'Ace5Pro' }
            default { throw "Unknown device: $devDisp" }
          }
      
          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"
      
          # Ace 5 Pro doesn't support Super Flasher
          if ($dev -eq 'Ace5Pro' -and $ftype -eq 'Super Flasher') {
            throw "Oneplus Ace 5 Pro does not support 'Super Flasher'. Please choose 'Regional Flasher'."
          }
      
          # ---- pick builder BAT ----
          $batName = switch ($ftype) {
            'SuperHybrid Flasher' {
              if ($region -eq 'CN') { 'SUPERHYBRID_CN_FULL_SUPERBUILD.bat' }
              else                  { 'SUPERHYBRID_FULL_SUPERBUILD.bat' }
            }
            'RegionalHybrid Flasher' {
              if ($region -eq 'CN') { 'REGIONALHYBRID_CN_FULL_BUILD.bat' }
              else                  { 'REGIONALHYBRID_FULL_BUILD.bat' }
            }
            'SuperHybrid SunOS Flasher' { 'SUPERHYBRID_SUNOS_FULL_SUPERBUILD.bat' }
      
            'Super Flasher' {
              if ($dev -in @('13R','13S','13T')) {
                if     ($region -eq 'CN') { 'SUPER_CN_FULL_SUPERBUILD.bat' }
                elseif ($dev -eq '13S')   { 'SUPER_IN_FULL_SUPERBUILD.bat' }
                elseif ($dev -eq '13R')   { 'SUPER_EUGLO_FULL_SUPERBUILD.bat' }
                elseif ($dev -eq '13T')   { 'SUPER_IN_FULL_SUPERBUILD.bat' }
                else                      { 'SUPER_EUGLO_FULL_SUPERBUILD.bat' }
              }
              elseif ($dev -eq 'Ace5') {
                if ($region -eq 'CN') { 'SUPER_CN_FULL_SUPERBUILD.bat' }
                else                  { 'SUPER_OOS_FULL_SUPERBUILD.bat' }
              }
              else {
                'SUPERHYBRID_FULL_SUPERBUILD.bat'
              }
            }
      
            'Regional Flasher' {
              if ($dev -eq '13R') {
                if     ($region -eq 'CN') { 'REGIONAL_CN_FULL_BUILD.bat' }
                else                      { 'REGIONAL_EUGLO_FULL_BUILD.bat' }
              }
              elseif ($dev -eq '13S') { 'REGIONAL_IN_FULL_BUILD.bat' }
              elseif ($dev -eq 'Ace5') {
                if     ($region -eq 'CN') { 'REGIONAL_CN_FULL_BUILD.bat' }
                else                      { 'REGIONAL_EUGLO_FULL_BUILD.bat' }
              }
              elseif ($dev -eq 'Ace5Pro') {
                if     ($region -eq 'CN') { 'REGIONAL_ACE5PRO_CN_FULL_BUILD.bat' }  # ✅ use A5P CN builder
                else                      { 'REGIONAL_EUGLO_FULL_BUILD.bat' }        # change if you have an A5P-specific non-CN builder
              }
              else {
                'REGIONALHYBRID_FULL_BUILD.bat'
              }
            }
      
            default { throw "Unknown flasher type: $ftype" }
          }
      
          "DEV=$dev"             | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE=$ftype"         | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION=$region"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILDER_BAT=$batName" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Selected builder: $batName (dev=$dev, region=$region, type=$ftype)"


      - name: Stage files (13-series + Ace 5 *** Ace 5 Pro; hybrid LF fix)
        shell: pwsh
        run: |
          #-----------------------------
          # Helpers
          #-----------------------------
          function Copy-BloatFromFolder {
            param(
              [string]$base,
              [string]$folder,          # e.g. CN_BLOAT, EUGLO_BLOAT, IN_BLOAT, NA_BLOAT, A5P_BLOAT
              [string]$dest,
              [string[]]$skip = @()
            )
            if (-not $folder) { return }
            $src = Join-Path $base $folder
            if (-not (Test-Path $src)) { return }
            if (-not (Test-Path $dest)) { New-Item -ItemType Directory -Force -Path $dest | Out-Null }
      
            $needed = @('my_preload.img','my_company.img','odm.img','oplusstanvbk.img','my_region.img')
            foreach ($f in $needed) {
              if ($skip -contains $f) { continue }
              $img = Join-Path $src $f
              if (Test-Path $img) { Copy-Item $img -Destination $dest -Force; continue }
      
              # Try stub without extension (e.g. 'my_preload', 'odm')
              $stub = Join-Path $src ([System.IO.Path]::GetFileNameWithoutExtension($f))
              if (Test-Path $stub) {
                try {
                  $url = (Get-Content $stub -Raw).Trim()
                  if ($url) { Invoke-WebRequest -Uri $url -OutFile (Join-Path $dest $f) }
                } catch {
                  Write-Warning ("Failed to download {0} from {1}: {2}" -f $f, $stub, $_.Exception.Message)
                }
              }
            }
          }
      
          function Copy-DebloatPair {
            param(
              [string]$debloatDir,  # e.g. bloat\Ace5\A5_DEBLOAT or bloat\Ace5\A5P_DEBLOAT
              [string]$dest
            )
            if (-not (Test-Path $debloatDir)) { return }
            if (-not (Test-Path $dest)) { New-Item -ItemType Directory -Force -Path $dest | Out-Null }
      
            foreach ($f in 'my_company.img','my_preload.img') {
              $src = Join-Path $debloatDir $f
              if (Test-Path $src) {
                Copy-Item $src -Destination $dest -Force
              } else {
                # allow stub for my_preload
                $stub = Join-Path $debloatDir ([System.IO.Path]::GetFileNameWithoutExtension($f))
                if (Test-Path $stub) {
                  try {
                    $url=(Get-Content $stub -Raw).Trim()
                    if ($url) { Invoke-WebRequest -Uri $url -OutFile (Join-Path $dest $f) }
                  } catch {
                    Write-Warning ("Failed to download {0} from {1}: {2}" -f $f, $stub, $_.Exception.Message)
                  }
                }
              }
            }
          }
      
          function Normalize-UpdaterScriptLF {
            param([string]$metaRoot)
            $up = Join-Path $metaRoot 'com\google\android\updater-script'
            if (-not (Test-Path $up)) { return }
            try {
              $raw = Get-Content -LiteralPath $up -Raw
              $lf  = ($raw -replace "`r`n","`n") -replace "`r","`n"
              Set-Content -LiteralPath $up -Value $lf -Encoding ascii -NoNewline
              Write-Host ("Normalized line endings to LF for: {0}" -f $up)
            } catch {
              Write-Warning ("Failed to normalize LF in {0}: {1}" -f $up, $_.Exception.Message)
            }
          }
      
          #-----------------------------
          # Inputs / paths  (robust DEV parsing)
          #-----------------------------
          $devRaw = "$env:DEV"
          $m = [regex]::Match($devRaw, '(Ace5Pro|Ace5|13T|13S|13R|13)')
          $dev = if ($m.Success) { $m.Groups[1].Value } else { ($devRaw -split '\s+')[0] }
      
          $ftype  = $env:FTYPE
          $region = $env:REGION
          $root   = $env:GITHUB_WORKSPACE
      
          Write-Host "DEV(raw)='$devRaw'  →  DEV(norm)='$dev' • FTYPE='$ftype' • REGION='$region'"
      
          # Ace 5 Pro uses the Ace5 trees for scripts & bloat
          $scriptDev = if ($dev -in @('Ace5','Ace5Pro')) { 'Ace5' } else { $dev }
      
          $builderDir = Join-Path $root ("build_scripts\" + $scriptDev)
          $bloatBase  = Join-Path $root ("bloat\" + $scriptDev)
      
          # Fresh OUT_DIR
          if (Test-Path $env:OUT_DIR) { Remove-Item $env:OUT_DIR -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $env:OUT_DIR | Out-Null
      
          # Main folder: otaripper + builder .bat
          $otaripper = Join-Path $root 'otaripper\otaripper.exe'
          if (Test-Path $otaripper) { Copy-Item $otaripper -Destination $env:OUT_DIR -Force }
          $builderSrc = Join-Path $builderDir $env:BUILDER_BAT
          if (Test-Path $builderSrc) { Copy-Item $builderSrc -Destination $env:OUT_DIR -Force }
      
          # Working folder name (CN suffix where required)
          $workName = switch ($ftype) {
            'SuperHybrid Flasher'       { if ($dev -eq '13' -and $region -eq 'CN') { 'SuperHybrid Flasher CN' } else { 'SuperHybrid Flasher' } }
            'RegionalHybrid Flasher'    { 'RegionalHybrid Flasher' }
            'SuperHybrid SunOS Flasher' { 'SuperHybrid SunOS Flasher' }
            'Super Flasher' {
              if ( ($dev -in @('13R','13T','Ace5')) -and ($region -eq 'CN') ) { 'Super Flasher CN' } else { 'Super Flasher' }
            }
            'Regional Flasher' {
              if ( ($dev -in @('13R','Ace5','Ace5Pro')) -and ($region -eq 'CN') ) { 'Regional Flasher CN' } else { 'Regional Flasher' }
            }
          }
          $workDir = Join-Path $env:OUT_DIR $workName
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null
      
          # -----------------------------
          # Template root selection (+ copy)
          # -----------------------------
          $tplDev = if ($dev -in @('Ace5','Ace5Pro')) { 'Ace5' } else { $dev }
      
          function Get-OsSubtree([string]$dev,[string]$ftype,[string]$region) {
            if ($ftype -like '*Hybrid*') { return (($region -eq 'CN') ? 'cos' : 'oos') }
            if ($ftype -eq 'Regional Flasher') { return (($region -eq 'CN') ? 'cos' : 'oos') }
            if ($ftype -eq 'Super Flasher') {
              if ( ($dev -in @('13T','Ace5')) -and ($region -eq 'CN') ) { return 'cos' }
              return 'oos'
            }
            return 'oos'
          }
      
          $osSub  = Get-OsSubtree -dev $dev -ftype $ftype -region $region
          $kind   = ($ftype -like '*Super*') ? 'super' : 'regional'
      
          $tplBase = Join-Path $root ("flasher_scripts\" + $tplDev)
          $tplBase = Join-Path $tplBase $osSub
          $tplBase = Join-Path $tplBase $kind
      
          # Hard rule: Ace 5 Pro • Regional Flasher • CN → Ace5\cos\regional (Regional_Flasher_COS.bat)
          if ($dev -eq 'Ace5Pro' -and $ftype -eq 'Regional Flasher' -and $region -eq 'CN') {
            $tplBase = Join-Path $root 'flasher_scripts\Ace5\cos\regional'
          }
      
          Write-Host "Using flasher template: $tplBase"
          if (-not (Test-Path $tplBase)) {
            throw "Flasher template not found: $tplBase (dev=$dev, ftype=$ftype, region=$region)"
          }
      
          # Copy template
          Copy-Item "$tplBase\*" -Destination $workDir -Recurse -Force
      
          # HYBRID ONLY: prevent double META-INF & LF-normalize updater-script
          if ($ftype -like '*Hybrid*') {
            $miSrc  = Join-Path $tplBase 'META-INF'
            $miDest = Join-Path $workDir 'META-INF'
            if (Test-Path $miSrc) {
              if (-not (Test-Path $miDest)) {
                New-Item -ItemType Directory -Force -Path $miDest | Out-Null
                Copy-Item "$miSrc\*" -Destination $miDest -Recurse -Force
              } else {
                Write-Host ("META-INF already present in {0} - skipping duplicate copy." -f $miDest)
              }
              Normalize-UpdaterScriptLF -metaRoot $miDest
            }
          }
      
          # ALWAYS copy Platform-Tools into flasher dir
          $ptSrc = Join-Path $root 'Platform-Tools'
          if (Test-Path $ptSrc) {
            $ptDst = Join-Path $workDir 'Platform-Tools'
            New-Item -ItemType Directory -Force -Path $ptDst | Out-Null
            Copy-Item "$ptSrc\*" -Destination $ptDst -Recurse -Force
          } else {
            Write-Warning ("Platform-Tools not found at repo root: {0}" -f $ptSrc)
          }
      
          function Get-BloatFolder {
            param([string]$dev,[string]$region)
            switch ($dev) {
              'Ace5'    { switch ($region) { 'CN'{'CN_BLOAT'} 'EU'{'EUGLO_BLOAT'} 'GLO'{'EUGLO_BLOAT'} 'IN'{'IN_BLOAT'} 'NA'{'NA_BLOAT'} default {$null} } }
              'Ace5Pro' { if ($region -eq 'CN') { 'A5P_BLOAT' } else { $null } }
              default   { switch ($region) { 'CN'{'CN_BLOAT'} 'EU'{'EUGLO_BLOAT'} 'GLO'{'EUGLO_BLOAT'} 'IN'{'IN_BLOAT'} 'NA'{'NA_BLOAT'} default {$null} } }
            }
          }
      
          #-----------------------------
          # Super builds
          #-----------------------------
          if ($ftype -match 'Super') {
            $superDir = Join-Path $workDir 'Super'
            New-Item -ItemType Directory -Force -Path $superDir | Out-Null
            Copy-Item (Join-Path $root 'lpmake\lpmake.exe')  -Destination $superDir -Force
            Copy-Item (Join-Path $root 'lpmake\cygwin1.dll') -Destination $superDir -Force
      
            # Packer scripts
            if ($dev -eq '13T') {
              $pdir = Join-Path $root 'super_packers\13T'
              Copy-Item (Join-Path $pdir ($(if ($region -eq 'CN') { 'super_cos.bat' } else { 'super_oos.bat' }))) -Destination $superDir -Force
            } elseif ($dev -eq 'Ace5') {
              $pdir = Join-Path $root 'super_packers\Ace5'
              Copy-Item (Join-Path $pdir ($(if ($region -eq 'CN') { 'super_cos.bat' } else { 'super_oos.bat' }))) -Destination $superDir -Force
            } else {
              $p = Join-Path $root ("super_packers\" + $dev + "\super_oos.bat")
              if (Test-Path $p) { Copy-Item $p -Destination $superDir -Force }
            }
      
            # Standard bloat into Super\
            $bloatFolder = Get-BloatFolder -dev $dev -region $region
            if ($dev -eq '13T' -and $ftype -eq 'Super Flasher' -and $region -eq 'IN') {
              # Skip 3 files; they go to COS_FILES_HERE
              Copy-BloatFromFolder -base $bloatBase -folder $bloatFolder -dest $superDir -skip @('my_region.img','oplusstanvbk.img','odm.img')
              $cosHere = Join-Path $workDir 'COS_FILES_HERE'
              New-Item -ItemType Directory -Force -Path $cosHere | Out-Null
              foreach ($f in 'my_region.img','oplusstanvbk.img','odm.img') {
                $srcInSuper = Join-Path $superDir $f
                $dstInCos   = Join-Path $cosHere $f
                if (Test-Path $srcInSuper) { Move-Item $srcInSuper $dstInCos -Force }
              }
            } else {
              Copy-BloatFromFolder -base $bloatBase -folder $bloatFolder -dest $superDir
            }
      
            # CN extra OOS staging
            if ($region -eq 'CN') {
              if ($dev -eq '13' -and $ftype -eq 'SuperHybrid Flasher') {
                # OnePlus 13 SuperHybrid CN: put EUGLO_BLOAT into OOS_FILES_HERE (no COS_FILES_HERE here)
                $oosHere = Join-Path $workDir 'OOS_FILES_HERE'
                New-Item -ItemType Directory -Force -Path $oosHere | Out-Null
                Copy-BloatFromFolder -base $bloatBase -folder 'EUGLO_BLOAT' -dest $oosHere
              }
              elseif ($dev -notin @('Ace5','Ace5Pro')) {
                # Other CN 13-series: previous behavior
                $oosHere = Join-Path $workDir 'OOS_FILES_HERE'
                New-Item -ItemType Directory -Force -Path $oosHere | Out-Null
                if ($dev -eq '13R') { Copy-BloatFromFolder -base $bloatBase -folder 'A5_DEBLOAT'   -dest $oosHere }
                else                { Copy-BloatFromFolder -base $bloatBase -folder 'EUGLO_BLOAT' -dest $oosHere }
              }
            }
      
            # Ace 5 CN: put A5_DEBLOAT pair into OOS_FILES_HERE
            if ($dev -eq 'Ace5' -and $region -eq 'CN') {
              $oosHere = Join-Path $workDir 'OOS_FILES_HERE'
              New-Item -ItemType Directory -Force -Path $oosHere | Out-Null
              Copy-DebloatPair -debloatDir (Join-Path $bloatBase 'A5_DEBLOAT') -dest $oosHere
            }
          }
      
          #-----------------------------
          # Regional / RegionalHybrid builds
          #-----------------------------
          if ($ftype -in @('Regional Flasher','RegionalHybrid Flasher')) {
            $oosHere = Join-Path $workDir 'OOS_FILES_HERE'
            New-Item -ItemType Directory -Force -Path $oosHere | Out-Null
            $bloatFolder = Get-BloatFolder -dev $dev -region $region
            Copy-BloatFromFolder -base $bloatBase -folder $bloatFolder -dest $oosHere
      
            # CN: also prepare COS_FILES_HERE
            if ($region -eq 'CN') {
              $cosHere = Join-Path $workDir 'COS_FILES_HERE'
              New-Item -ItemType Directory -Force -Path $cosHere | Out-Null
              $cnFolder = if ($dev -eq 'Ace5Pro') { 'A5P_BLOAT' } else { 'CN_BLOAT' }
              Copy-BloatFromFolder -base $bloatBase -folder $cnFolder -dest $cosHere
            }
      
            # 13S + Regional IN: ensure the two files in OOS_FILES_HERE
            if ($dev -eq '13S' -and $region -eq 'IN') {
              foreach ($f in 'my_preload.img','my_company.img') {
                $src = Join-Path (Join-Path $bloatBase 'IN_BLOAT') $f
                if (Test-Path $src) { Copy-Item $src -Destination $oosHere -Force }
              }
            }
      
            # Ace 5 CN: A5_DEBLOAT pair into OOS_FILES_HERE
            if ($dev -eq 'Ace5' -and $region -eq 'CN') {
              Copy-DebloatPair -debloatDir (Join-Path $bloatBase 'A5_DEBLOAT') -dest $oosHere
            }
            # Ace 5 Pro CN: A5P_DEBLOAT pair into OOS_FILES_HERE
            if ($dev -eq 'Ace5Pro' -and $region -eq 'CN') {
              Copy-DebloatPair -debloatDir (Join-Path $bloatBase 'A5P_DEBLOAT') -dest $oosHere
            }
          }
      
          #-----------------------------
          # Oneplus 13 + Hybrid extras (SuperHybrid + RegionalHybrid)
          #-----------------------------
          if ($dev -eq '13' -and $ftype -in @('SuperHybrid Flasher','RegionalHybrid Flasher')) {
            # Stage 16DTBO from flasher_scripts\13\oos\super\16DTBO
            $src16  = Join-Path $root 'flasher_scripts\13\oos\super\16DTBO'
            $main16 = Join-Path $env:OUT_DIR '16DTBO'
      
            if (Test-Path $src16) {
              New-Item -ItemType Directory -Force -Path $main16 | Out-Null
              Copy-Item "$src16\*" -Destination $main16 -Recurse -Force
              # Ensure optional name
              $dtboPlain = Join-Path $main16 'dtbo.img'
              $dtboNamed = Join-Path $main16 '16.0.0.1_dtbo.img'
              if ((Test-Path $dtboPlain) -and -not (Test-Path $dtboNamed)) {
                Copy-Item $dtboPlain $dtboNamed -Force
              }
            } else {
              Write-Warning ("16DTBO source not found: {0}" -f $src16)
            }
      
            # Move stray 16DTBO created inside working dir up to MAIN
            $work16 = Join-Path $workDir '16DTBO'
            if (Test-Path $work16) {
              if (Test-Path $main16) { Remove-Item $main16 -Recurse -Force }
              Move-Item $work16 $main16
              Write-Host "Moved stray 16DTBO from working folder to MAIN."
            }
      
            # DO NOT inject COS_FILES_HERE for CN (avoid COS files for 13 SuperHybrid CN).
            if ($region -ne 'CN') {
              $cosBloat = Join-Path $bloatBase 'COS_FILES_HERE'
              if (Test-Path $cosBloat) {
                $cosDest = Join-Path $workDir 'COS_FILES_HERE'
                New-Item -ItemType Directory -Force -Path $cosDest | Out-Null
                Copy-Item "$cosBloat\*" -Destination $cosDest -Recurse -Force
              }
            }
          }
      
          # Expose for next steps
          "WORK_DIR=$workDir" | Out-File -FilePath $env:GITHUB_ENV -Append



      - name: Patch RegionalHybrid builder (force pushd, strip %~d1/%~p1)
        if: contains(env.BUILDER_BAT, 'REGIONALHYBRID')
        shell: pwsh
        working-directory: ${{ env.OUT_DIR }}
        run: |
          $bat = Join-Path $PWD $env:BUILDER_BAT
          if (!(Test-Path $bat)) { throw "Builder not found: $bat" }
            
          # keep a backup
          Copy-Item $bat ($bat + '.orig') -Force
            
          $txt = Get-Content -LiteralPath $bat -Raw
            
          # Prepend a robust prelude that always runs from the OTA directory
          $pre = @(
            '@echo off'
            'setlocal enableextensions'
            'set "_ARG1=%~f1"'
            'set "_ARGDIR=%~dp1"'
            'if not defined _ARG1 (echo ERROR: No OTA argument passed.& exit /b 2)'
            'rem Force current dir to the OTA location (cross-drive safe)'
            'pushd "%_ARGDIR%" || (echo ERROR: pushd "%_ARGDIR%" failed.& exit /b 3)'
           ) -join "`r`n"
            
          if ($txt -notmatch '(?im)^\s*pushd\s+"%_ARGDIR%"') {
                  $txt = $pre + "`r`n" + $txt
           }
            
          # Normalize classic drag&drop patterns to a single pushd "%~dp1"
          $txt = [regex]::Replace($txt,'(?im)^\s*cd\s+/d?\s*"?%~dp?1"?\s*$', 'pushd "%~dp1"')
          $txt = [regex]::Replace($txt,'(?im)%~d1\s*&&\s*cd\s+%~p1',         'pushd "%~dp1"')
          $txt = [regex]::Replace($txt,'(?im)^\s*cd\s+%~p1\s*$',             'pushd "%~dp1"')
          $txt = $txt -replace '%~d1%~p1','%~dp1'
          $txt = $txt -replace '%~d1\\%~p1','%~dp1'
          $txt = [regex]::Replace($txt,'(?im)^\s*%~d1\s*$', 'rem (stripped bare %~d1)')
            
          Set-Content -LiteralPath $bat -Value $txt -Encoding ascii
          Write-Host "Patched $($env:BUILDER_BAT)."

      # --- Run the (now patched) builder from the OTA folder with full OTA path
      - name: Run builder (Explorer-style drag & drop)
        shell: cmd
        working-directory: ${{ env.OTA_DIR }}
        run: |
          echo CWD is %CD%
          echo Calling builder: "%GITHUB_WORKSPACE%\%OUT_DIR%\%BUILDER_BAT%" "%OTA_PATH%"
          (echo.| call "%GITHUB_WORKSPACE%\%OUT_DIR%\%BUILDER_BAT%" "%OTA_PATH%") || exit /b 1

      - name: "Package final output (tar -a; names: 13T OOS/COS + A5/A5P; no COS ODM for CN)"
        shell: pwsh
        run: |
          $otaDir  = $env:OTA_DIR
          $dev     = $env:DEV
          $ftype   = $env:FTYPE
          $region  = $env:REGION
      
          # --- Find builder output next to the OTA ---
          $byFtype = switch ($ftype) {
            'SuperHybrid Flasher'       { @('SuperHybrid Flasher') }
            'RegionalHybrid Flasher'    { @('RegionalHybrid Flasher') }
            'SuperHybrid SunOS Flasher' { @('SuperHybrid SunOS Flasher') }
            'Super Flasher' {
              if ( ($dev -in @('13R','13T','Ace5','Ace5P','Ace5Pro')) -and ($region -eq 'CN') ) { @('Super Flasher CN') } else { @('Super Flasher') }
            }
            'Regional Flasher' {
              if ( ($dev -in @('13R','Ace5','Ace5P','Ace5Pro')) -and ($region -eq 'CN') ) { @('Regional Flasher CN') } else { @('Regional Flasher') }
            }
            default { @() }
          }
          $fallback = @(
            'Regional Flasher CN',
            'Regional Flasher',
            'Super Flasher CN',
            'Super Flasher',
            'SuperHybrid Flasher',
            'RegionalHybrid Flasher',
            'SuperHybrid SunOS Flasher'
          )
          $candidates = @() + $byFtype + $fallback | Select-Object -Unique
      
          $resultDir = $null
          foreach ($name in $candidates) {
            $p = Join-Path $otaDir $name
            if (Test-Path $p) { $resultDir = $p; break }
          }
          if (-not $resultDir) {
            throw ("Could not find builder output folder next to OTA in '{0}'. Looked for: {1}" -f $otaDir, ($candidates -join ', '))
          }
      
          # --- Output root ---
          $zipRoot = Join-Path $env:GITHUB_WORKSPACE $env:OUT_DIR
          New-Item -ItemType Directory -Force -Path $zipRoot | Out-Null
      
          # ---------- Naming ----------
          $ver     = if ([string]::IsNullOrWhiteSpace($env:OTA_VERSION)) { 'UNKNOWN' } else { $env:OTA_VERSION }
          $devCode = $dev
          if ($devCode -eq 'Ace5Pro') { $devCode = 'Ace5P' }
      
          function RegionDisp([string]$r) {
            switch ($r) {
              'CN'  { 'COS' }
              'GLO' { 'Global' }
              'EU'  { 'EU' }
              'IN'  { 'IN' }
              'NA'  { 'NA' }
              default { $r }
            }
          }
      
          switch ($devCode) {
            '13T' {
              $osTag = if ($region -eq 'CN') { 'COS' } else { 'OOS' }
              $artifactBase = "{0} 13T {1} {2}" -f $ftype, $osTag, $ver
            }
            '13S' {
              $artifactBase = "{0} 13S {1}" -f $ftype, $ver
            }
            '13R' {
              $artifactBase = "{0} 13R {1} {2}" -f $ftype, (RegionDisp $region), $ver
            }
            '13' {
              $artifactBase = "{0} {1} {2}" -f $ftype, (RegionDisp $region), $ver
            }
            'Ace5' {
              if ($region -eq 'CN') {
                $artifactBase = "{0} A5 COS {1}" -f $ftype, $ver
              } else {
                $artifactBase = "{0} A5 {1} OOS+COS ODM {2}" -f $ftype, (RegionDisp $region), $ver
              }
            }
            'Ace5P' {
              if ($region -eq 'CN') {
                $artifactBase = "{0} A5P COS {1}" -f $ftype, $ver
              } else {
                $artifactBase = "{0} A5P {1} OOS+COS ODM {2}" -f $ftype, (RegionDisp $region), $ver
              }
            }
            default {
              $artifactBase = "{0} {1} {2}" -f $ftype, (RegionDisp $region), $ver
            }
          }
      
          $zipPath = Join-Path $zipRoot ($artifactBase + '.zip')
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
      
          $tar   = Get-Command tar -ErrorAction Stop
          $items = Get-ChildItem -LiteralPath $resultDir -Force | ForEach-Object { $_.Name }
          if ($items.Count -eq 0) { throw ("Nothing to archive in {0}" -f $resultDir) }
      
          & $tar.Path -a -c -f "$zipPath" -C "$resultDir" @items
      
          if (-not (Test-Path $zipPath)) { throw ("Packaging failed: ZIP not created at {0}" -f $zipPath) }
      
          "ARTIFACT_NAME=$artifactBase" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_FILE=$zipPath"           | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compute upload paths
        shell: pwsh
        run: |
          $device = "${{ inputs.device }}"
          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"

          # Does this device normally have region subfolders?
          $needsRegion = $true
          if ($device -in @('Oneplus 13S','Oneplus 13T','Oneplus Ace 5','Oneplus Ace 5 Pro')) { $needsRegion = $false }

          function RegionFolder([string]$r){
            switch ($r) {
              'CN'  { 'COS' }
              'GLO' { 'Global' }
              'EU'  { 'EU' }
              'IN'  { 'IN' }
              'NA'  { 'NA' }
              default { $r }
            }
          }

          # Default category
          $category = if ($ftype -match '^(SuperHybrid Flasher|SuperHybrid SunOS Flasher|Super Flasher)$') {
            'Super Flashers'
          } else {
            'Regional Flashers'
          }

          # Special categories
          if ($device -eq 'Oneplus 13T' -and $ftype -eq 'Super Flasher' -and $region -eq 'IN') {
            $category = 'OxygenOS Flashers'
          }

          # Build relative path ($rel)
          $rel = $null

          if ($device -eq 'Oneplus Ace 5 Pro') {
            # Always Regional Flashers, no region folder
            $rel = Join-Path $device 'Regional Flashers'
          }
          elseif ($device -eq 'Oneplus Ace 5') {
            if ($ftype -eq 'Super Flasher' -and $region -ne 'CN') {
              # Non-CN Super goes under OxygenOS/Super Flashers
              $rel = Join-Path (Join-Path $device 'OxygenOS') 'Super Flashers'
            } else {
              # CN (or Regional) just under device/<category>, no region folder
              $rel = Join-Path $device $category
            }
          }
          else {
            if ($needsRegion -and $category -ne 'OxygenOS Flashers') {
              $rel = Join-Path (Join-Path $device $category) (RegionFolder $region)
            } else {
              $rel = Join-Path $device $category
            }
          }

          # Normalize to forward slashes + trailing slash
          $rel = ($rel -replace '\\','/')
          if (-not $rel.EndsWith('/')) { $rel += '/' }
          "REL_UPLOAD_DIR=$rel" | Out-File -FilePath $env:GITHUB_ENV -Append

          # DS FTP absolute target (prefix is optional)
          $ftpBase = "${{ secrets.DS_FTP_PATH }}".Trim('/')
          $ftpAbs  = ($ftpBase.Length -gt 0) ? "$ftpBase/$rel" : $rel
          "FTP_UPLOAD_DIR=$ftpAbs" | Out-File -FilePath $env:GITHUB_ENV -Append

          # SourceForge absolute base (required to be absolute)
          $sfBaseAbs = "${{ secrets.SF_PROJECT_PATH }}".Trim()
          if ([string]::IsNullOrWhiteSpace($sfBaseAbs) -or -not $sfBaseAbs.StartsWith('/')) {
            throw "SF_PROJECT_PATH must be an absolute path like /home/frs/project/oneplus13flashers"
          }
          $sfBaseAbs = ($sfBaseAbs -replace '\\','/').TrimEnd('/')
          "SF_UPLOAD_DIR=$sfBaseAbs/$rel" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to DS_FTP (streamed, large-file safe)
        if: ${{ inputs.upload_to == 'DS_FTP' || inputs.upload_to == 'Both DS_FTP & Sourceforge' }}
        shell: pwsh
        env:
          DS_FTP_HOST: ${{ secrets.DS_FTP_HOST }}
          DS_FTP_USER: ${{ secrets.DS_FTP_USER }}
          DS_FTP_PASS: ${{ secrets.DS_FTP_PASS }}
        run: |
          if (-not $env:DS_FTP_HOST -or -not $env:DS_FTP_USER -or -not $env:DS_FTP_PASS) {
            throw "Missing DS_FTP secrets. Required: DS_FTP_HOST, DS_FTP_USER, DS_FTP_PASS"
          }

          $ftpHost   = $env:DS_FTP_HOST
          $user      = $env:DS_FTP_USER
          $pass      = $env:DS_FTP_PASS
          $remoteDir = "$env:FTP_UPLOAD_DIR".Trim('/')
          $fileName  = "$($env:ARTIFACT_NAME).zip"
          $zipPath   = $env:ZIP_FILE

          if (-not (Test-Path $zipPath)) { throw ("ZIP not found: {0}" -f $zipPath) }

          $encPath = ($remoteDir.Split('/') | Where-Object { $_ -ne '' } | ForEach-Object { [System.Uri]::EscapeDataString($_) }) -join '/'

          function New-FtpRequest([string]$uri,[string]$method){
            $r=[System.Net.FtpWebRequest]::Create($uri)
            $r.Credentials = New-Object System.Net.NetworkCredential($user,$pass)
            $r.Method      = $method
            $r.UsePassive  = $true
            $r.UseBinary   = $true
            $r.KeepAlive   = $false
            return $r
          }

          $dirUri = if ($encPath) { "ftp://$ftpHost/$encPath" } else { "ftp://$ftpHost/" }
          try {
            (New-FtpRequest $dirUri ([System.Net.WebRequestMethods+Ftp]::ListDirectory)).GetResponse().Close()
          } catch {
            $detail = $_.Exception.Response?.StatusDescription
            throw ("Target folder does not exist or is not accessible: {0} ({1})" -f $dirUri, $detail)
          }

          $uploadUri = if ($encPath) {
            "ftp://$ftpHost/$encPath/$([System.Uri]::EscapeDataString($fileName))"
          } else {
            "ftp://$ftpHost/$([System.Uri]::EscapeDataString($fileName))"
          }

          try {
            $req = New-FtpRequest $uploadUri ([System.Net.WebRequestMethods+Ftp]::UploadFile)
            $req.ContentLength = (Get-Item $zipPath).Length

            $bufferSize = 4MB
            $buffer     = New-Object byte[] $bufferSize
            $fs   = [System.IO.File]::OpenRead($zipPath)
            $dest = $req.GetRequestStream()
            try {
              while (($read = $fs.Read($buffer,0,$buffer.Length)) -gt 0) {
                $dest.Write($buffer,0,$read)
              }
            } finally {
              $dest.Close()
              $fs.Close()
            }

            $resp = $req.GetResponse()
            Write-Host ("FTP server response: {0}" -f $resp.StatusDescription)
            $resp.Close()
          } catch {
            Write-Warning ("Streaming FTP upload failed: {0}" -f $_.Exception.Message)
            Write-Warning "Falling back to curl..."

            $curlExe = Get-Command curl -ErrorAction SilentlyContinue
            if (-not $curlExe) { throw "curl not found and FTP upload failed." }

            $urlBase = if ($encPath) { "ftp://$ftpHost/$encPath/" } else { "ftp://$ftpHost/" }
            $urlFull = $urlBase + [System.Uri]::EscapeDataString($fileName)
            $userPwd = "$($user):$($pass)"
            & $curlExe.Path --ftp-pasv --disable-eprt --user $userPwd -T "$zipPath" "$urlFull" --fail --show-error --silent
          }

      - name: Setup SSH for SourceForge
        if: ${{ inputs.upload_to == 'Sourceforge' || inputs.upload_to == 'Both DS_FTP & Sourceforge' }}
        shell: pwsh
        env:
          SF_SSH_PRIVATE_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
        run: |
          if (-not $env:SF_SSH_PRIVATE_KEY) { throw "Missing SF_SSH_PRIVATE_KEY secret." }

          $sshDir  = Join-Path $env:USERPROFILE ".ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyPath = Join-Path $sshDir "id_ed25519"

          $key = ($env:SF_SSH_PRIVATE_KEY -replace "`r","").Trim() + "`n"
          $first = ($key -split "`n")[0]
          if ($first -notmatch "BEGIN OPENSSH PRIVATE KEY|BEGIN RSA PRIVATE KEY") {
            throw "SF_SSH_PRIVATE_KEY doesn't look like an OpenSSH private key (bad header)."
          }

          Set-Content -Path $keyPath -Value $key -Encoding ascii
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null

          $kh = Join-Path $sshDir "known_hosts"
          ssh-keyscan -t rsa frs.sourceforge.net | Out-File -FilePath $kh -Encoding ascii

          $cfgPath  = Join-Path $sshDir "config"
          @(
            "Host frs.sourceforge.net"
            "  UserKnownHostsFile $kh"
            "  IdentitiesOnly yes"
            "  IdentityFile $keyPath"
          ) | Set-Content -Path $cfgPath -Encoding ascii

      - name: Upload to SourceForge (SCP)
        if: ${{ inputs.upload_to == 'Sourceforge' || inputs.upload_to == 'Both DS_FTP & Sourceforge' }}
        shell: pwsh
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        run: |
          if (-not $env:SF_USERNAME -or -not $env:SF_UPLOAD_DIR) {
            throw "Missing SourceForge config at runtime. Need SF_USERNAME and computed SF_UPLOAD_DIR."
          }

          $zip = $env:ZIP_FILE
          if (-not (Test-Path $zip)) { throw ("ZIP file not found: {0}" -f $zip) }

          $destDir = ($env:SF_UPLOAD_DIR -replace '\\','/').TrimEnd('/')
          $dest    = "$destDir/$($env:ARTIFACT_NAME).zip"
          $key     = "$env:USERPROFILE\.ssh\id_ed25519"

          ssh -i "$key" -o StrictHostKeyChecking=yes "$($env:SF_USERNAME)@frs.sourceforge.net" "test -d `"$destDir`" || { echo 'ERROR: Destination folder does not exist on SourceForge: ' `"$destDir`"; exit 66; }"

          Write-Host ("Uploading to SourceForge: {0}" -f $dest)
          scp -i "$key" -o StrictHostKeyChecking=yes "$zip" "$($env:SF_USERNAME)@frs.sourceforge.net:`"$dest`""
