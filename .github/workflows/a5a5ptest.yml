name: Build Tools (Linux)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
          - Oneplus 15
          - Oneplus Ace 5
          - Oneplus Ace 5 Pro
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
          - SuperHybrid Matrixx Flasher
          - Super Flasher
          - Regional Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - DS_FTP
          - Artifact Only
        default: DS_FTP
      notify_telegram:
        description: "Notify Telegram"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          # CRLF -> LF
          git ls-files '*.sh' | while read -r f; do sed -i 's/\r$//' "$f"; done
          # Make executable
          find build_scripts   -type f -name "*.sh" -exec chmod +x {} +
          find super_packers   -type f -name "*.sh" -exec chmod +x {} +
          find flasher_scripts -type f -name "*.sh" -exec chmod +x {} +
          # Binaries (if present)
          [ -f lpmake/lpmake ] && chmod +x lpmake/lpmake || true
          [ -f otaripper/otaripper ] && chmod +x otaripper/otaripper || true

      - name: Prep dirs and placeholder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p download "${OUT_DIR}"

          # URL säubern: trim, Quotes weg, \u0026 -> &
          raw="${{ inputs.ota_url }}"
          url="$(printf '%s' "$raw" \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                  -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" \
                  -e 's/\\u0026/\&/g')"

          # für den nächsten Step in die Environment legen (auch wenn leer)
          echo "SANITIZED_URL=$url" >> "$GITHUB_ENV"

          if [ -z "$url" ]; then
            echo "Placeholder OTA for dry-run" > download/PLACEHOLDER.txt
            rm -f download/OTA.zip
            (cd download && zip -q OTA.zip PLACEHOLDER.txt)
          fi


      - name: Download OTA zip
        if: ${{ inputs.ota_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p download
          url="${{ inputs.ota_url }}"
          ftype="${{ inputs.flasher_type }}"

          # Nur für SunOS & Matrixx: Original-Dateinamen ermitteln
          if [[ "$ftype" == "SuperHybrid SunOS Flasher" || "$ftype" == "SuperHybrid Matrixx Flasher" ]]; then
            # 1) Originalname aus Content-Disposition
            fname="$(curl -sIL "$url" \
              | tr -d '\r' \
              | grep -i 'content-disposition' \
              | sed -n 's/.*filename[^=]*=[ \"]*//p' \
              | sed 's/[\";].*//')"

            # 2) URL-Decoding für %xx (nur Shell, kein Python)
            if [ -n "$fname" ]; then
              fname_decoded="$(printf '%b' "${fname//%/\\x}")" || true
              [ -n "$fname_decoded" ] && fname="$fname_decoded"
            fi

            # 3) Fallback: Basisname + aktuelles Datum
            if [ -z "$fname" ]; then
              current_date="$(date +%Y%m%d)"
              if [[ "$ftype" == "SuperHybrid SunOS Flasher" ]]; then
                fname="Sun-varuna-${current_date}-dodge-Official.zip"
              elif [[ "$ftype" == "SuperHybrid Matrixx Flasher" ]]; then
                fname="Matrixx-v11.7.0-Unofficial-dodge-Gapps-${current_date}.zip"
              fi
            fi

            # Präfix "SuperHybrid" immer vorne dran

            echo "Using OTA artifact filename: ${fname}"
            echo "OTA_ORIG_NAME=${fname}" >> "$GITHUB_ENV"
          fi

          # Download: Datei MUSS OTA.zip heißen (immer)
          if command -v aria2c >/dev/null 2>&1; then
            aria2c -x 8 -s 8 -c --file-allocation=none --retry-wait=5 --max-tries=10 --timeout=30 \
              --header="User-Agent: Dalvik/2.1.0 (Linux; U; Android 16; CPH2653 Build/AP3A.240617.008)" \
              --header="userId: oplus-ota|15002017" \
              --header="language: en-US" \
              --header="brand: oneplus-exp" \
              -o "download/OTA.zip" "$url"
          else
            curl -L --fail --retry 5 --retry-delay 5 \
              -H "User-Agent: Dalvik/2.1.0 (Linux; U; Android 16; CPH2653 Build/AP3A.240617.008)" \
              -H "userId: oplus-ota|15002017" \
              -H "language: en-US" \
              -H "brand: oneplus-exp" \
              -o "download/OTA.zip" "$url"
          fi

      - name: Export OTA env
        shell: bash
        run: |
          set -euo pipefail
          test -f "download/OTA.zip" || { echo "OTA.zip not found in download/"; exit 1; }
          ota="$(realpath download/OTA.zip)"
          ota_dir="$(dirname "$ota")"
          {
            echo "OTA_PATH=$ota"
            echo "OTA_DIR=$ota_dir"
          } >> "$GITHUB_ENV"

      - name: Extract OTA version (from META-INF/com/android/metadata)
        if: ${{ inputs.flasher_type != 'SuperHybrid SunOS Flasher' && inputs.flasher_type != 'SuperHybrid Matrixx Flasher' }}
        shell: bash
        run: |
          set -euo pipefail
          content="$(unzip -p "$OTA_PATH" META-INF/com/android/metadata 2>/dev/null || true)"
          [ -n "$content" ] || { echo "metadata not found in OTA.zip"; exit 1; }
          version_line="$(printf "%s" "$content" | grep -E '^version_name=')" || { echo "version_name not found in metadata"; exit 1; }
          val="${version_line#version_name=}"
          numeric="$(printf "%s" "$val" | grep -oE '[0-9]+(\.[0-9]+){1,4}' | awk '{ print length, $0 }' | sort -nr | head -n1 | cut -d" " -f2-)"
          [ -n "$numeric" ] || { echo "Could not parse numeric version from '$val'"; exit 1; }
          echo "Parsed OTA version: $numeric"
          echo "OTA_VERSION=$numeric" >> "$GITHUB_ENV"

      - name: Map device → pick builder
        shell: bash
        run: |
          set -euo pipefail
          dev_disp="${{ inputs.device }}"
                dev_disp="${{ inputs.device }}"
          case "$dev_disp" in
            "Oneplus 13") dev="13" ;;
            "Oneplus 13R") dev="13R" ;;
            "Oneplus 13S") dev="13S" ;;
            "Oneplus 13T") dev="13T" ;;
            "Oneplus Ace 5") dev="Ace5" ;;
            "Oneplus Ace 5 Pro") dev="Ace5Pro" ;;
            "Oneplus 15") dev="15" ;;
            *) echo "Unknown device: $dev_disp"; exit 1 ;;
          esac


          ftype="${{ inputs.flasher_type }}"
          region="${{ inputs.region }}"



          pick_bat() {
            case "$ftype" in
              "SuperHybrid Flasher")
                if [[ "$dev" == "Ace5" || "$dev" == "Ace5Pro" ]]; then echo "Hybrid flashers are not supported for $dev_disp." >&2; exit 1; fi
                if [[ "$region" == "CN" ]]; then echo "SUPERHYBRID_CN_FULL_SUPERBUILD"; else echo "SUPERHYBRID_FULL_SUPERBUILD"; fi
              ;;
              "RegionalHybrid Flasher")
                if [[ "$dev" == "Ace5" || "$dev" == "Ace5Pro" ]]; then echo "Hybrid flashers are not supported for $dev_disp." >&2; exit 1; fi
                if [[ "$region" == "CN" ]]; then echo "REGIONALHYBRID_CN_FULL_BUILD"; else echo "REGIONALHYBRID_FULL_BUILD"; fi
              ;;
              "SuperHybrid SunOS Flasher")
                if [[ "$dev" == "Ace5" || "$dev" == "Ace5Pro" ]]; then echo "Hybrid flashers are not supported for $dev_disp." >&2; exit 1; fi
                echo "SUPERHYBRID_SUNOS_FULL_SUPERBUILD"
              ;;
              "SuperHybrid Matrixx Flasher")
                if [[ "$dev" != "13" ]]; then echo "Matrixx flasher is available for Oneplus 13 only." >&2; exit 1; fi
                echo "SUPERHYBRID_MATRIXX_FULL_SUPERBUILD"
              ;;
              "Super Flasher")
                if   [[ "$dev" == "13R" && "$region" == "CN" ]]; then echo "SUPER_CN_FULL_SUPERBUILD"
                elif [[ "$dev" == "13R" ]]; then echo "SUPER_EUGLO_FULL_SUPERBUILD"
                elif [[ "$dev" == "13S" ]]; then echo "SUPER_IN_FULL_SUPERBUILD"
                elif [[ "$dev" == "13T" && "$region" == "CN" ]]; then echo "SUPER_CN_FULL_SUPERBUILD"
                elif [[ "$dev" == "13T" ]]; then echo "SUPER_IN_FULL_SUPERBUILD"
                elif [[ "$dev" == "Ace5" && "$region" == "CN" ]]; then echo "SUPER_CN_FULL_SUPERBUILD"
                elif [[ "$dev" == "Ace5" ]]; then echo "SUPER_OOS_FULL_SUPERBUILD"
                elif [[ "$dev" == "Ace5Pro" ]]; then echo "ERROR_ACE5PRO_REGIONAL_ONLY"
                else echo "SUPERHYBRID_FULL_SUPERBUILD"; fi
              ;;
              "Regional Flasher")
                if   [[ "$dev" == "13R" && "$region" == "CN" ]]; then echo "REGIONAL_CN_FULL_BUILD"
                elif [[ "$dev" == "13R" ]]; then echo "REGIONAL_EUGLO_FULL_BUILD"
                elif [[ "$dev" == "13S" ]]; then echo "REGIONAL_IN_FULL_BUILD"
                elif [[ "$dev" == "Ace5Pro" ]]; then echo "REGIONAL_ACE5PRO_CN_FULL_BUILD"
                elif [[ "$dev" == "Ace5" ]]; then echo "REGIONAL_CN_FULL_BUILD"
                else echo "REGIONALHYBRID_FULL_BUILD"; fi
              ;;
              *)
                echo "Unknown flasher type: $ftype" >&2; exit 1 ;;
            esac
          }

          base_name="$(pick_bat)"
          if [[ "$base_name" == "ERROR_ACE5PRO_REGIONAL_ONLY" ]]; then
            echo "Ace 5 Pro supports Regional Flasher only." >&2
            exit 1
          fi

                    # Override builder selection for Oneplus 15
          if [[ "$dev" == "15" ]]; then
            case "$ftype" in
              "RegionalHybrid Flasher")
                case "$region" in
                  EU)  base_name="REGIONALHYBRID_EU_FULL_BUILD" ;;
                  GLO) base_name="REGIONALHYBRID_GLO_FULL_BUILD" ;;
                  IN)  base_name="REGIONALHYBRID_IN_FULL_BUILD" ;;
                esac
                ;;
              "SuperHybrid Flasher")
                case "$region" in
                  CN)  base_name="SUPERHYBRID_CN_FULL_SUPERBUILD" ;;
                  EU)  base_name="SUPERHYBRID_EU_FULL_SUPERBUILD" ;;
                  GLO) base_name="SUPERHYBRID_GLO_FULL_SUPERBUILD" ;;
                  IN)  base_name="SUPERHYBRID_IN_FULL_SUPERBUILD" ;;
                esac
                ;;
            esac
          fi


          builder_sh="${base_name}.sh"

          {
            echo "DEV=$dev"
            echo "FTYPE=$ftype"
            echo "REGION=$region"
            echo "BUILDER_SH=$builder_sh"
          } >> "$GITHUB_ENV"

      - name: Stage files
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage_files.sh

      - name: Pre-stage flasher into OTA folder
        if: ${{ inputs.flasher_type == 'RegionalHybrid Flasher' || inputs.flasher_type == 'SuperHybrid Flasher' || inputs.flasher_type == 'SuperHybrid SunOS Flasher' || inputs.flasher_type == 'SuperHybrid Matrixx Flasher' }}
        shell: bash
        run: |
          set -euo pipefail
          src="$WORK_DIR"
          [ -d "$src" ] || { echo "WORK_DIR not found: $src"; exit 1; }
          dst="$OTA_DIR/$(basename "$src")"
          mkdir -p "$dst"
          rsync -a --info=progress2 "$src/" "$dst/"
          [ -f "$OUT_DIR/otaripper" ] && cp -f "$OUT_DIR/otaripper" "$OTA_DIR/"

      - name: Run builder
        shell: bash
        working-directory: ${{ env.OTA_DIR }}
        run: |
          set -euo pipefail
          echo "CWD is $(pwd)"
          echo "Calling builder: \"$GITHUB_WORKSPACE/$OUT_DIR/$BUILDER_SH\" \"$OTA_PATH\""
          bash "$GITHUB_WORKSPACE/$OUT_DIR/$BUILDER_SH" "$OTA_PATH"

      - name: Package final output
        shell: bash
        run: |
          set -euo pipefail
          ota_dir="$OTA_DIR"

          declare -a by_ftype
          case "$FTYPE" in
            "SuperHybrid Flasher")
              if [[ "$REGION" == "CN" ]]; then
                by_ftype=("SuperHybrid Flasher CN")
              else
                by_ftype=("SuperHybrid Flasher")
              fi
            ;;
            "RegionalHybrid Flasher")
              if [[ "$REGION" == "CN" ]]; then
                by_ftype=("RegionalHybrid Flasher CN")
              else
                by_ftype=("Regional Hybrid Flasher")
              fi
            ;;
            "SuperHybrid SunOS Flasher")
              by_ftype=("SuperHybrid SunOS Flasher")
            ;;
            "SuperHybrid Matrixx Flasher")
              by_ftype=("SuperHybrid Matrixx Flasher")
            ;;
            "Super Flasher")
              if [[ "$REGION" == "CN" && ( "$DEV" == "13R" || "$DEV" == "13T" || "$DEV" == "Ace5" ) ]]; then
                by_ftype=("Super Flasher CN")
              else
                by_ftype=("Super Flasher")
              fi
            ;;
            "Regional Flasher")
              if [[ "$REGION" == "CN" && ( "$DEV" == "Ace5" || "$DEV" == "Ace5Pro" ) ]]; then
                by_ftype=("Regional Flasher CN")
              else
                by_ftype=("Regional Flasher")
              fi
            ;;
          esac

          fallback=(
            "RegionalHybrid Flasher CN"
            "Regional Hybrid Flasher"
            "RegionalHybrid Flasher"
            "SuperHybrid Flasher CN"
            "SuperHybrid Flasher"
            "SuperHybrid Matrixx Flasher"
            "SuperHybrid SunOS Flasher"
            "Super Flasher CN"
            "Super Flasher"
            "Regional Flasher CN"
            "Regional Flasher"
          )

          mapfile -t candidates < <(printf "%s\n" "${by_ftype[@]}" "${fallback[@]}" | awk '!seen[$0]++')

          echo "Folders in OTA_DIR:"
          ls -la "$ota_dir" || true

          result_dir=""
          for name in "${candidates[@]}"; do
            p="$ota_dir/$name"
            if [ -d "$p" ]; then result_dir="$p"; break; fi
          done
          [ -n "$result_dir" ] || {
            echo "Could not find builder output folder next to OTA in '$ota_dir'."
            echo "Looked for:"; printf ' - %s\n' "${candidates[@]}"; exit 1;
          }

          zip_root="$GITHUB_WORKSPACE/$OUT_DIR"
          mkdir -p "$zip_root"

          ftype_name="$FTYPE"
          region_code="$REGION"
          ver="${OTA_VERSION:-UNKNOWN}"
          current_date=$(date +%Y%m%d)

          if [[ "$FTYPE" == "SuperHybrid SunOS Flasher" || "$FTYPE" == "SuperHybrid Matrixx Flasher" ]]; then
            ota_file="${OTA_ORIG_NAME:-OTA.zip}"
            ota_name="${ota_file%.zip}"
            artifact_base="SuperHybrid ${ota_name}"
          else
            case "$region_code" in
              CN)  region_disp="COS" ;;
              GLO) region_disp="Global" ;;
              EU)  region_disp="EU" ;;
              IN)  region_disp="IN" ;;
              NA)  region_disp="NA" ;;
              *)   region_disp="$region_code" ;;
            esac

              # 🔥 Sonderfall: Oneplus 15 + SuperHybrid Flasher + EU/GLO/IN
            if [[ "$DEV" == "15" && "$FTYPE" == "SuperHybrid Flasher" ]]; then
              case "$region_code" in
                EU)
                  artifact_base="${ftype_name} OP15 CN2EU ${ver}"
                  ;;
                GLO)
                  artifact_base="${ftype_name} OP15 CN2GLO ${ver}"
                  ;;
                IN)
                  artifact_base="${ftype_name} OP15 CN2IN ${ver}"
                  ;;
                *)
                  # alle anderen Regionen (z.B. CN) -> Standard-Fallback
                  artifact_base="${ftype_name} ${region_disp} ${ver}"
                  ;;
              esac
            else

            case "$DEV" in
              "13T")
                if [[ "$REGION" == "CN" ]]; then os_tag="COS"; else os_tag="OOS"; fi
                artifact_base="${ftype_name} 13T ${os_tag} ${ver}"
              ;;
              "13S")
                artifact_base="${ftype_name} 13S ${ver}"
              ;;
              "13R")
                artifact_base="${ftype_name} 13R ${region_disp} ${ver}"
              ;;
              "Ace5")
                if [[ "$region_code" == "CN" ]]; then
                  artifact_base="${ftype_name} A5 COS ${ver}"
                else
                  artifact_base="${ftype_name} A5 ${region_code} OOS+COS ODM ${ver}"
                fi
              ;;
              "Ace5Pro")
                artifact_base="${ftype_name} A5P ${region_disp} ${ver}"
              ;;
              *)
                artifact_base="${ftype_name} ${region_disp} ${ver}"
              ;;
            esac
          fi

          zip_path="$zip_root/${artifact_base}.zip"
          rm -f "$zip_path"

          cd "$result_dir"

          if command -v 7zz >/dev/null 2>&1; then
            seven=7zz
          elif command -v 7z >/dev/null 2>&1; then
            seven=7z
          else
            seven=""
          fi

          if [ -n "$seven" ]; then
            "$seven" a -tzip -mm=Deflate -mx=3 -mfb=32 -mmt=on -bso0 -bsp0 "$zip_path" .
          else
            zip -qr -3 "$zip_path" .
          fi

          [ -f "$zip_path" ] || { echo "Packaging failed: ZIP not created at $zip_path"; exit 1; }

          {
            echo "ARTIFACT_NAME=$artifact_base"
            echo "ZIP_FILE=$zip_path"
          } >> "$GITHUB_ENV"

      - name: Upload artifact
        if: ${{ inputs.upload_to == 'Artifact Only' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Compute upload paths
        shell: bash
        run: |
          set -euo pipefail
          device="${{ inputs.device }}"
          ftype="${{ inputs.flasher_type }}"
          region="${{ inputs.region }}"

          if [[ "$ftype" == "SuperHybrid SunOS Flasher" ]]; then
            category="SunOS Super Flashers"
            rel="Oneplus 13/Custom Roms/$category"
          elif [[ "$ftype" == "SuperHybrid Matrixx Flasher" ]]; then
            category="Project Matrixx Super Flashers"
            rel="Oneplus 13/Custom Roms/$category"
          elif [[ "$device" == "Oneplus 13T" && "$ftype" == "Super Flasher" && "$region" == "IN" ]]; then
            category="OxygenOS Flashers"
            rel="$device/$category"
          elif [[ "$device" == "Oneplus Ace 5 Pro" ]]; then
            category="Regional Flashers"
            rel="$device/$category"
          else
            if [[ "$ftype" =~ ^(SuperHybrid Flasher|Super Flasher|SuperHybrid Matrixx Flasher)$ ]]; then
              category="Super Flashers"
            else
              category="Regional Flashers"
            fi
            rel="$device/$category"
          fi

          no_region_devices=("Oneplus 13S" "Oneplus 13T" "Oneplus Ace 5" "Oneplus Ace 5 Pro")
          needs_region=1
          for n in "${no_region_devices[@]}"; do
            [[ "$n" == "$device" ]] && needs_region=0
          done

          if [[ "$device" == "Oneplus Ace 5" && "$region" != "CN" ]]; then
            rel="$device/OxygenOS/$category"
          elif [[ $needs_region -eq 1 && "$ftype" != "SuperHybrid SunOS Flasher" && "$ftype" != "SuperHybrid Matrixx Flasher" ]]; then
            case "$region" in
              CN)  region_folder="COS" ;;
              GLO) region_folder="Global" ;;
              EU)  region_folder="EU" ;;
              IN)  region_folder="IN" ;;
              NA)  region_folder="NA" ;;
              *)   region_folder="$region" ;;
            esac
            rel="$rel/$region_folder"
          fi

          rel="${rel//\\//}"
          [[ "${rel: -1}" == "/" ]] || rel="${rel}/"
          echo "REL_UPLOAD_DIR=$rel" >> "$GITHUB_ENV"

          ftp_base="$(printf "%s" "${{ secrets.DS_FTP_PATH }}" | sed 's#^/*##; s#/*$##;')"
          if [ -n "$ftp_base" ]; then ftp_abs="$ftp_base/$rel"; else ftp_abs="$rel"; fi
          echo "FTP_UPLOAD_DIR=$ftp_abs" >> "$GITHUB_ENV"


      - name: Upload to DS_FTP
        if: ${{ inputs.upload_to == 'DS_FTP' }}
        env:
          DS_FTP_HOST: ${{ secrets.DS_FTP_HOST }}
          DS_FTP_USER: ${{ secrets.DS_FTP_USER }}
          DS_FTP_PASS: ${{ secrets.DS_FTP_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DS_FTP_HOST:?Missing DS_FTP_HOST}"
          : "${DS_FTP_USER:?Missing DS_FTP_USER}"
          : "${DS_FTP_PASS:?Missing DS_FTP_PASS}"

          remote_dir="$(printf "%s" "$FTP_UPLOAD_DIR" | sed 's#^/*##')"  # e.g. "Oneplus 13/SunOS Super Flashers/"
          file_name="${ARTIFACT_NAME}.zip"
          zip_path="$ZIP_FILE"
          [ -f "$zip_path" ] || { echo "ZIP not found: $zip_path"; exit 1; }

          # URL-encode (keep slashes)
          if command -v python3 >/dev/null 2>&1; then
            enc_path="$(python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1], safe='/'))" "${remote_dir}${file_name}")"
          else
            enc_path="$(printf '%s' "${remote_dir}${file_name}" \
              | sed -e 's/%/%25/g' -e 's/ /%20/g' -e 's/#/%23/g' -e 's/+/%2B/g' -e 's/?/%3F/g')"
          fi

          # Upload als .filepart
          part_url="ftp://${DS_FTP_HOST}/${enc_path}.filepart"
          echo "Uploading via curl to: $part_url"

          curl --ftp-pasv --disable-eprt --ftp-method nocwd \
               --user "${DS_FTP_USER}:${DS_FTP_PASS}" \
               --ftp-create-dirs \
               -T "$zip_path" "$part_url" \
               --fail --show-error --silent

          # Nach erfolgreichem Upload im Zielordner umbenennen (.filepart -> final)
          cwd_path="${remote_dir%/}"  # ggf. trailing slash entfernen
          if [[ -n "$cwd_path" ]]; then CWD_Q=(-Q "CWD $cwd_path"); else CWD_Q=(); fi

          curl --ftp-pasv --disable-eprt -sS -o /dev/null \
               --user "${DS_FTP_USER}:${DS_FTP_PASS}" "ftp://${DS_FTP_HOST}/" \
               "${CWD_Q[@]}" \
               -Q "RNFR ${file_name}.filepart" \
               -Q "RNTO ${file_name}" \
               --fail --show-error --silent

      - name: Notify Telegram (Oneplus 13 Group -1001902568181)
        if: ${{ inputs.upload_to == 'DS_FTP' && inputs.flasher_type != 'SuperHybrid SunOS Flasher' && inputs.flasher_type != 'SuperHybrid Matrixx Flasher' && inputs.notify_telegram && inputs.device != 'Oneplus 15' }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8

          device_disp="${{ inputs.device }}"
          region="$REGION"
          ftype="$FTYPE"
          artifact="$ARTIFACT_NAME"
          ftp_rel_dir="$FTP_UPLOAD_DIR"

          # Type folder like on Windows
          if [[ "$ftype" == "RegionalHybrid Flasher" ]]; then
            type_dir="Regional Flashers"
          else
            type_dir="Super Flashers"
          fi

          # Region display like on Windows
          case "$region" in
            GLO) region_dir="Global" ;;
            CN)  region_dir="COS" ;;
            *)   region_dir="$region" ;;
          esac

          # Main download link
          raw_path="Files/${ftp_rel_dir}${artifact}.zip"
