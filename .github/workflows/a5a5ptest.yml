name: Build Tools (Linux)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
          - Oneplus Ace 5
          - Oneplus Ace 5 Pro
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
          - Super Flasher
          - Regional Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - DS_FTP
          - Sourceforge
          - "Both DS_FTP & Sourceforge"
          - Artifact Only
        default: DS_FTP

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make scripts executable (+ normalize line endings)
        shell: bash
        run: |
          set -euo pipefail
          # CRLF -> LF
          git ls-files '*.sh' | while read -r f; do sed -i 's/\r$//' "$f"; done
          # Ausführbar machen
          find build_scripts   -type f -name "*.sh" -exec chmod +x {} +
          find super_packers   -type f -name "*.sh" -exec chmod +x {} +
          find flasher_scripts -type f -name "*.sh" -exec chmod +x {} +
          # Binaries (falls vorhanden)
          [ -f lpmake/lpmake ] && chmod +x lpmake/lpmake || true
          [ -f otaripper/otaripper ] && chmod +x otaripper/otaripper || true

      - name: Ensure deps (optional, falls Runner schon alles hat)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -e
          if command -v apt-get >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                aria2 curl unzip zip rsync openssh-client ca-certificates tar coreutils grep sed gawk p7zip-full python3
            elif sudo -n true 2>/dev/null; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                aria2 curl unzip zip rsync openssh-client ca-certificates tar coreutils grep sed gawk p7zip-full python3
            else
              echo "No passwordless sudo → skip apt install (assume deps present)."
            fi
          fi

      - name: Prep dirs and placeholder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p download "${OUT_DIR}"
          url="${{ inputs.ota_url }}"
          url="$(printf "%s" "$url" | xargs)"  # trim
          if [ -z "$url" ]; then
            echo "Placeholder OTA for dry-run" > download/PLACEHOLDER.txt
            rm -f download/OTA.zip
            (cd download && zip -q OTA.zip PLACEHOLDER.txt)
          fi

      - name: Download OTA zip (aria2 → curl fallback)
        if: ${{ inputs.ota_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p download
          if command -v aria2c >/dev/null 2>&1; then
            aria2c -x 8 -s 8 -c --file-allocation=none --retry-wait=5 --max-tries=10 --timeout=30 \
              -o "download/OTA.zip" "${{ inputs.ota_url }}"
          else
            curl -L --fail --retry 5 --retry-delay 5 -o "download/OTA.zip" "${{ inputs.ota_url }}"
          fi

      - name: Export OTA env
        shell: bash
        run: |
          set -euo pipefail
          test -f "download/OTA.zip" || { echo "OTA.zip not found in download/"; exit 1; }
          ota="$(realpath download/OTA.zip)"
          ota_dir="$(dirname "$ota")"
          {
            echo "OTA_PATH=$ota"
            echo "OTA_DIR=$ota_dir"
          } >> "$GITHUB_ENV"

      - name: Extract OTA version (from META-INF/com/android/metadata)
        shell: bash
        run: |
          set -euo pipefail
          content="$(unzip -p "$OTA_PATH" META-INF/com/android/metadata 2>/dev/null || true)"
          [ -n "$content" ] || { echo "metadata not found in OTA.zip"; exit 1; }
          version_line="$(printf "%s" "$content" | grep -E '^version_name=')" || { echo "version_name not found in metadata"; exit 1; }
          val="${version_line#version_name=}"
          numeric="$(printf "%s" "$val" | grep -oE '[0-9]+(\.[0-9]+){1,4}' | awk '{ print length, $0 }' | sort -nr | head -n1 | cut -d" " -f2-)"
          [ -n "$numeric" ] || { echo "Could not parse numeric version from '$val'"; exit 1; }
          echo "Parsed OTA version: $numeric"
          echo "OTA_VERSION=$numeric" >> "$GITHUB_ENV"

      - name: Map device → pick builder
        shell: bash
        run: |
          set -euo pipefail
          dev_disp="${{ inputs.device }}"
          case "$dev_disp" in
            "Oneplus 13") dev="13" ;;
            "Oneplus 13R") dev="13R" ;;
            "Oneplus 13S") dev="13S" ;;
            "Oneplus 13T") dev="13T" ;;
            "Oneplus Ace 5") dev="Ace5" ;;
            "Oneplus Ace 5 Pro") dev="Ace5Pro" ;;
            *) echo "Unknown device: $dev_disp"; exit 1 ;;
          esac

          ftype="${{ inputs.flasher_type }}"
          region="${{ inputs.region }}"

          pick_bat() {
            case "$ftype" in
              "SuperHybrid Flasher")
                if [[ "$dev" == "Ace5" || "$dev" == "Ace5Pro" ]]; then echo "Hybrid flashers are not supported for $dev_disp." >&2; exit 1; fi
                if [[ "$region" == "CN" ]]; then echo "SUPERHYBRID_CN_FULL_SUPERBUILD"; else echo "SUPERHYBRID_FULL_SUPERBUILD"; fi
              ;;
              "RegionalHybrid Flasher")
                if [[ "$dev" == "Ace5" || "$dev" == "Ace5Pro" ]]; then echo "Hybrid flashers are not supported for $dev_disp." >&2; exit 1; fi
                if [[ "$region" == "CN" ]]; then echo "REGIONALHYBRID_CN_FULL_BUILD"; else echo "REGIONALHYBRID_FULL_BUILD"; fi
              ;;
              "SuperHybrid SunOS Flasher")
                if [[ "$dev" == "Ace5" || "$dev" == "Ace5Pro" ]]; then echo "Hybrid flashers are not supported for $dev_disp." >&2; exit 1; fi
                echo "SUPERHYBRID_SUNOS_FULL_SUPERBUILD"
              ;;
              "Super Flasher")
                if   [[ "$dev" == "13R" && "$region" == "CN" ]]; then echo "SUPER_CN_FULL_SUPERBUILD"
                elif [[ "$dev" == "13R" ]]; then echo "SUPER_EUGLO_FULL_SUPERBUILD"
                elif [[ "$dev" == "13S" ]]; then echo "SUPER_IN_FULL_SUPERBUILD"
                elif [[ "$dev" == "13T" && "$region" == "CN" ]]; then echo "SUPER_CN_FULL_SUPERBUILD"
                elif [[ "$dev" == "13T" ]]; then echo "SUPER_IN_FULL_SUPERBUILD"
                elif [[ "$dev" == "Ace5" && "$region" == "CN" ]]; then echo "SUPER_CN_FULL_SUPERBUILD"
                elif [[ "$dev" == "Ace5" ]]; then echo "SUPER_OOS_FULL_SUPERBUILD"
                elif [[ "$dev" == "Ace5Pro" ]]; then echo "ERROR_ACE5PRO_REGIONAL_ONLY"
                else echo "SUPERHYBRID_FULL_SUPERBUILD"; fi
              ;;
              "Regional Flasher")
                if   [[ "$dev" == "13R" && "$region" == "CN" ]]; then echo "REGIONAL_CN_FULL_BUILD"
                elif [[ "$dev" == "13R" ]]; then echo "REGIONAL_EUGLO_FULL_BUILD"
                elif [[ "$dev" == "13S" ]]; then echo "REGIONAL_IN_FULL_BUILD"
                elif [[ "$dev" == "Ace5Pro" ]]; then echo "REGIONAL_ACE5PRO_CN_FULL_BUILD"
                elif [[ "$dev" == "Ace5" ]]; then echo "REGIONAL_CN_FULL_BUILD"
                else echo "REGIONALHYBRID_FULL_BUILD"; fi
              ;;
              *)
                echo "Unknown flasher type: $ftype" >&2; exit 1 ;;
            esac
          }

          base_name="$(pick_bat)"
          if [[ "$base_name" == "ERROR_ACE5PRO_REGIONAL_ONLY" ]]; then
            echo "Ace 5 Pro supports Regional Flasher only." >&2
            exit 1
          fi

          builder_sh="${base_name}.sh"

          {
            echo "DEV=$dev"
            echo "FTYPE=$ftype"
            echo "REGION=$region"
            echo "BUILDER_SH=$builder_sh"
          } >> "$GITHUB_ENV"

      - name: Stage files (13-series + Ace 5 / Ace 5 Pro; fix updater-script LF)
        shell: bash
        run: |
          set -euo pipefail

          copy_bloat_files () {
            local base="$1" region="$2" dest="$3"
            declare -A map=( ["EU"]="EUGLO_BLOAT" ["GLO"]="EUGLO_BLOAT" ["IN"]="IN_BLOAT" ["NA"]="NA_BLOAT" ["CN"]="CN_BLOAT" ["A5"]="A5_DEBLOAT" ["A5P"]="A5P_BLOAT" )
            local needed=( "my_preload.img" "my_company.img" "odm.img" "oplusstanvbk.img" "my_region.img" )
            local folder="${map[$region]:-}"
            [ -n "$folder" ] || return 0
            local src="$base/$folder"
            [ -d "$src" ] || return 0
            mkdir -p "$dest"
            for f in "${needed[@]}"; do
              if [ -f "$src/$f" ]; then
                cp -f "$src/$f" "$dest/"
                continue
              fi
              local stub="$src/${f%.img}"
              if [ -f "$stub" ]; then
                url="$(tr -d '\r' < "$stub" | xargs || true)"
                if [ -n "$url" ]; then
                  echo "Downloading $f from $url"
                  curl -L --fail --retry 3 --retry-delay 5 -o "$dest/$f" "$url" || echo "WARN: download failed for $f"
                fi
              fi
            done
          }

          copy_or_download () {
            local dir="$1" base="$2" dest="$3"
            if [ -f "$dir/${base}.img" ]; then
              cp -f "$dir/${base}.img" "$dest"
            else
              local stub="$dir/${base}"
              if [ -f "$stub" ]; then
                url="$(tr -d '\r' < "$stub" | xargs || true)"
                if [ -n "$url" ]; then
                  echo "Downloading ${base}.img from $url"
                  curl -L --fail --retry 3 --retry-delay 5 -o "$dest" "$url" || echo "WARN: download failed for ${base}.img"
                fi
              fi
            fi
          }

          dev="$DEV"
          ftype="$FTYPE"
          region="$REGION"
          root="$GITHUB_WORKSPACE"

          if [[ "$dev" == "Ace5" || "$dev" == "Ace5Pro" ]]; then
            builder_base_dev="Ace5"
            bloat_base="$root/bloat/Ace5"
          else
            builder_base_dev="$dev"
            bloat_base="$root/bloat/$dev"
          fi
          builder_dir="$root/build_scripts/$builder_base_dev"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          if [ -f "$root/otaripper/otaripper" ]; then
            cp -f "$root/otaripper/otaripper" "$OUT_DIR/"
            chmod +x "$OUT_DIR/otaripper"
          fi

          builder_src="$builder_dir/$BUILDER_SH"
          if [ -f "$builder_src" ]; then
            cp -f "$builder_src" "$OUT_DIR/"
            chmod +x "$OUT_DIR/$BUILDER_SH"
          fi

          case "$FTYPE" in
            "SuperHybrid Flasher")
              if [[ "$REGION" == "CN" ]]; then
                work_name="SuperHybrid Flasher CN"
              else
                work_name="SuperHybrid Flasher"
              fi
            ;;
            "RegionalHybrid Flasher")
              if [[ "$REGION" == "CN" ]]; then
                work_name="RegionalHybrid Flasher CN"   # exakt so, ohne Leerzeichen zw. Regional/Hybrid + CN
              else
                work_name="Regional Hybrid Flasher"      # non-CN behält das Leerzeichen
              fi
            ;;
            "SuperHybrid SunOS Flasher")
              work_name="SuperHybrid SunOS Flasher"
            ;;
            "Super Flasher")
              if [[ "$REGION" == "CN" && ( "$DEV" == "13R" || "$DEV" == "13T" || "$DEV" == "Ace5" ) ]]; then
                work_name="Super Flasher CN"
              else
                work_name="Super Flasher"
              fi
            ;;
            "Regional Flasher")
              if [[ "$REGION" == "CN" && ( "$DEV" == "Ace5" || "$DEV" == "Ace5Pro" ) ]]; then
                work_name="Regional Flasher CN"
              else
                work_name="Regional Flasher"
              fi
            ;;
          esac

          work_dir="$OUT_DIR/$work_name"
          mkdir -p "$work_dir"

          if [[ "$DEV" == "Ace5" || "$DEV" == "Ace5Pro" ]]; then
            tpl_dev="Ace5"
          else
            tpl_dev="$DEV"
          fi
          tpl_base="$root/flasher_scripts/$tpl_dev"
          if [[ "$FTYPE" == *Hybrid* ]]; then
            if [[ "$REGION" == "CN" ]]; then os_root="cos"; else os_root="oos"; fi
            if [[ "$FTYPE" == *Super* ]]; then kind="super"; else kind="regional"; fi
            tpl_base="$tpl_base/$os_root/$kind"
          elif [[ "$FTYPE" == "Super Flasher" ]]; then
            if [[ "$DEV" == "13T" && "$REGION" == "CN" ]]; then tpl_base="$tpl_base/cos/super"
            elif [[ "$DEV" == "Ace5" && "$REGION" == "CN" ]]; then tpl_base="$tpl_base/cos/super"
            else tpl_base="$tpl_base/oos/super"
            fi
          elif [[ "$FTYPE" == "Regional Flasher" ]]; then
            if [[ "$REGION" == "CN" && ( "$DEV" == "13R" || "$DEV" == "Ace5" || "$DEV" == "Ace5Pro" ) ]]; then
              tpl_base="$tpl_base/cos/regional"
            else
              tpl_base="$tpl_base/oos/regional"
            fi
          fi

          rsync -a "$tpl_base/" "$work_dir/"

          # === Regional / RegionalHybrid ===
          # OOS_FILES_HERE immer befüllen. Für OP13+CN (RegionalHybrid) gilt:
          #   - OOS_FILES_HERE ← EUGLO_BLOAT
          #   - COS_FILES_HERE ← CN_BLOAT
          if [[ "$FTYPE" == "RegionalHybrid Flasher" || "$FTYPE" == "Regional Flasher" ]]; then
            oos_here="$work_dir/OOS_FILES_HERE"
            mkdir -p "$oos_here"

            if [[ "$FTYPE" == "RegionalHybrid Flasher" && "$DEV" == "13" && "$REGION" == "CN" ]]; then
              # *** SPECIAL: Oneplus 13 CN (RegionalHybrid) ***
              copy_bloat_files "$bloat_base" "GLO" "$oos_here"   # EUGLO_BLOAT → OOS
              cos_here="$work_dir/COS_FILES_HERE"
              mkdir -p "$cos_here"
              copy_bloat_files "$bloat_base" "CN" "$cos_here"    # CN_BLOAT → COS
            else
              # Default Verhalten: OOS by region + bei CN zusätzlich COS (CN_BLOAT/A5P_BLOAT)
              copy_bloat_files "$bloat_base" "$REGION" "$oos_here"

              if [[ "$REGION" == "CN" ]]; then
                cos_here="$work_dir/COS_FILES_HERE"
                mkdir -p "$cos_here"
                if [[ "$DEV" == "Ace5Pro" ]]; then
                  copy_bloat_files "$bloat_base" "A5P" "$cos_here"
                else
                  copy_bloat_files "$bloat_base" "CN" "$cos_here"
                fi

                # Ace5/Ace5Pro: Switchback-Paar in OOS_FILES_HERE
                if [[ "$DEV" == "Ace5" ]]; then
                  deb="$bloat_base/A5_DEBLOAT"
                  for f in my_preload.img my_company.img; do
                    [ -f "$deb/$f" ] && cp -f "$deb/$f" "$oos_here/"
                  done
                elif [[ "$DEV" == "Ace5Pro" ]]; then
                  deb="$bloat_base/A5P_DEBLOAT"; [ -d "$deb" ] || deb="$bloat_base/A5P_BLOAT"
                  for f in my_preload.img my_company.img; do
                    [ -f "$deb/$f" ] && cp -f "$deb/$f" "$oos_here/"
                  done
                fi
              fi
            fi
          fi

          if [[ "$FTYPE" == *Hybrid* ]]; then
            mi="$tpl_base/META-INF"
            if [ -d "$mi" ]; then
              if [ ! -d "$work_dir/META-INF" ]; then
                mkdir -p "$work_dir/META-INF"
                rsync -a "$mi/" "$work_dir/META-INF/"
              else
                echo "META-INF already present in $work_dir - skipping duplicate copy."
              fi
            fi
            upd="$work_dir/META-INF/com/google/android/updater-script"
            if [ -f "$upd" ]; then
              awk '{ sub(/\r$/,""); print }' "$upd" > "$upd.tmp" && mv "$upd.tmp" "$upd"
            else
              echo "WARN: Expected updater-script not found at: $upd"
            fi
          fi

          pt_src="$root/Platform-Tools"
          if [ -d "$pt_src" ]; then
            mkdir -p "$work_dir/Platform-Tools"
            rsync -a "$pt_src/" "$work_dir/Platform-Tools/"
          else
            echo "WARN: Platform-Tools not found at repo root: $pt_src"
          fi

          if [[ "$FTYPE" =~ Super ]]; then
            super_dir="$work_dir/Super"
            mkdir -p "$super_dir"
            if [ -f "$root/lpmake/lpmake" ]; then
              cp -f "$root/lpmake/lpmake" "$super_dir/"
              chmod +x "$super_dir/lpmake"
            fi

            # --- Select & copy correct super packer (CN => super_cos.sh, else super_oos.sh)
            if [[ "$DEV" == "13T" ]]; then
              pdir="$root/super_packers/13T"
              if [[ "$REGION" == "CN" && -f "$pdir/super_cos.sh" ]]; then
                cp -f "$pdir/super_cos.sh" "$super_dir/super_cos.sh" && chmod +x "$super_dir/super_cos.sh"
              elif [[ -f "$pdir/super_oos.sh" ]]; then
                cp -f "$pdir/super_oos.sh" "$super_dir/super_oos.sh" && chmod +x "$super_dir/super_oos.sh"
              else
                echo "WARN: no super packer found for 13T"
              fi

            elif [[ "$DEV" == "Ace5" ]]; then
              pdir="$root/super_packers/Ace5"
              if [[ "$REGION" == "CN" && -f "$pdir/super_cos.sh" ]]; then
                cp -f "$pdir/super_cos.sh" "$super_dir/super_cos.sh" && chmod +x "$super_dir/super_cos.sh"
              elif [[ -f "$pdir/super_oos.sh" ]]; then
                cp -f "$pdir/super_oos.sh" "$super_dir/super_oos.sh" && chmod +x "$super_dir/super_oos.sh"
              else
                echo "WARN: no super packer found for Ace5"
              fi

            else
              pdir="$root/super_packers/$tpl_dev"
              if [[ "$REGION" == "CN" && -f "$pdir/super_cos.sh" ]]; then
                cp -f "$pdir/super_cos.sh" "$super_dir/super_cos.sh" && chmod +x "$super_dir/super_cos.sh"
              elif [[ -f "$pdir/super_oos.sh" ]]; then
                cp -f "$pdir/super_oos.sh" "$super_dir/super_oos.sh" && chmod +x "$super_dir/super_oos.sh"
              else
                echo "ERROR: no super packer (cos/oos) found for $tpl_dev" >&2
                exit 1
              fi
            fi

            # Bloat → Super (by region) + special cases
            if [[ "$DEV" == "Ace5" ]]; then
              if [[ "$REGION" == "CN" ]]; then
                copy_bloat_files "$bloat_base" "CN" "$super_dir"
              else
                case "$REGION" in
                  EU|GLO) reg_folder="EUGLO_BLOAT" ;;
                  IN)     reg_folder="IN_BLOAT" ;;
                  NA)     reg_folder="NA_BLOAT" ;;
                  *)      reg_folder="EUGLO_BLOAT" ;;
                esac
                src_dir="$bloat_base/$reg_folder"
                copy_or_download "$src_dir" "my_preload" "$super_dir/my_preload.img"
                [ -f "$src_dir/my_company.img" ] && cp -f "$src_dir/my_company.img" "$super_dir/"
                copy_or_download "$src_dir" "odm" "$super_dir/odm.img"
              fi
            elif [[ "$DEV" == "Ace5Pro" ]]; then
              copy_bloat_files "$bloat_base" "A5P" "$super_dir"
            else
              copy_bloat_files "$bloat_base" "$REGION" "$super_dir"
            fi

            # 13T Super IN: move 3 files to COS_FILES_HERE
            if [[ "$DEV" == "13T" && "$FTYPE" == "Super Flasher" && "$REGION" == "IN" ]]; then
              cos_here="$work_dir/COS_FILES_HERE"
              mkdir -p "$cos_here"
              in_bloat="$bloat_base/IN_BLOAT"
              for f in my_region.img oplusstanvbk.img odm.img; do
                if [ -f "$super_dir/$f" ]; then mv -f "$super_dir/$f" "$cos_here/$f"; elif [ -f "$in_bloat/$f" ]; then cp -f "$in_bloat/$f" "$cos_here/$f"; fi
                rm -f "$super_dir/$f"
              done
            fi

            # CN extra OOS staging (for non-Ace5/Pro)
            if [[ "$REGION" == "CN" ]]; then
              oos_here="$work_dir/OOS_FILES_HERE"
              mkdir -p "$oos_here"
              if [[ "$DEV" == "13R" ]]; then
                copy_bloat_files "$bloat_base" "A5" "$oos_here"
              elif [[ "$DEV" == "Ace5" ]]; then
                deb="$bloat_base/A5_DEBLOAT"
                for f in my_preload.img my_company.img; do
                  [ -f "$deb/$f" ] && cp -f "$deb/$f" "$oos_here/"
                done
              else
                copy_bloat_files "$bloat_base" "GLO" "$oos_here"   # EUGLO_BLOAT → OOS_FILES_HERE (matches your rule)
              fi
            fi
          fi

          if [[ "$FTYPE" == "Regional Flasher" && "$DEV" == "Ace5" && "$REGION" == "CN" ]]; then
            cos_here="$work_dir/COS_FILES_HERE"
            mkdir -p "$cos_here"
            cn_bloat="$bloat_base/CN_BLOAT"
            for b in my_preload my_company; do
              if [ -f "$cn_bloat/${b}.img" ]; then
                cp -f "$cn_bloat/${b}.img" "$cos_here/"
              elif [ -f "$cn_bloat/$b" ]; then
                url="$(tr -d '\r' < "$cn_bloat/$b" | xargs || true)"
                [ -n "$url" ] && curl -L --fail --retry 3 --retry-delay 5 -o "$cos_here/${b}.img" "$url" || echo "WARN: download failed for ${b}.img"
              fi
            done
          fi

          if [[ "$FTYPE" == "Regional Flasher" && "$DEV" == "Ace5Pro" && "$REGION" == "CN" ]]; then
            cos_here="$work_dir/COS_FILES_HERE"
            mkdir -p "$cos_here"
            a5p_bloat="$bloat_base/A5P_BLOAT"
            for b in my_preload my_company; do
              if [ -f "$a5p_bloat/${b}.img" ]; then
                cp -f "$a5p_bloat/${b}.img" "$cos_here/"
              elif [ -f "$a5p_bloat/$b" ]; then
                url="$(tr -d '\r' < "$a5p_bloat/$b" | xargs || true)"
                [ -n "$url" ] && curl -L --fail --retry 3 --retry-delay 5 -o "$cos_here/${b}.img" "$url" || echo "WARN: download failed for ${b}.img"
              fi
            done
          fi

          if [[ "$DEV" == "13" && ( "$FTYPE" == "SuperHybrid Flasher" || "$FTYPE" == "RegionalHybrid Flasher" ) ]]; then
            repo16="$root/16DTBO"
            main16="$OUT_DIR/16DTBO"
            if [ -d "$repo16" ]; then
              rm -rf "$main16"
              mkdir -p "$main16"
              rsync -a "$repo16/" "$main16/"
              echo "Staged 16DTBO to MAIN: $main16"
            else
              echo "WARN: 16DTBO folder not found at repo root."
            fi
            work16="$work_dir/16DTBO"
            if [ -d "$work16" ]; then
              rm -rf "$main16"
              mv "$work16" "$main16"
              echo "Moved stray 16DTBO from working folder to MAIN."
            fi
          fi

          if [[ "$DEV" == "13" && "$FTYPE" == "SuperHybrid Flasher" ]]; then
            cos_bloat="$bloat_base/COS_FILES_HERE"
            if [ -d "$cos_bloat" ]; then
              cos_dest="$work_dir/COS_FILES_HERE"
              mkdir -p "$cos_dest"
              rsync -a "$cos_bloat/" "$cos_dest/"
            else
              echo "WARN: COS_FILES_HERE not found under $bloat_base"
            fi
          fi

          echo "WORK_DIR=$work_dir" >> "$GITHUB_ENV"

      - name: Pre-stage flasher into OTA folder (bypass flaky XCOPY)
        if: ${{ inputs.flasher_type == 'RegionalHybrid Flasher' || inputs.flasher_type == 'SuperHybrid Flasher' }}
        shell: bash
        run: |
          set -euo pipefail
          src="$WORK_DIR"
          [ -d "$src" ] || { echo "WORK_DIR not found: $src"; exit 1; }
          dst="$OTA_DIR/$(basename "$src")"
          mkdir -p "$dst"
          rsync -a --info=progress2 "$src/" "$dst/"
          # otaripper neben die ZIP legen
          [ -f "$OUT_DIR/otaripper" ] && cp -f "$OUT_DIR/otaripper" "$OTA_DIR/"

      - name: Run builder
        shell: bash
        working-directory: ${{ env.OTA_DIR }}
        run: |
          set -euo pipefail
          echo "CWD is $(pwd)"
          echo "Calling builder: \"$GITHUB_WORKSPACE/$OUT_DIR/$BUILDER_SH\" \"$OTA_PATH\""
          bash "$GITHUB_WORKSPACE/$OUT_DIR/$BUILDER_SH" "$OTA_PATH"

      - name: "Package final output (zip; names: 13T OOS/COS + A5 region OOS+COS ODM)"
        shell: bash
        run: |
          set -euo pipefail
          ota_dir="$OTA_DIR"

          declare -a by_ftype
          case "$FTYPE" in
            "SuperHybrid Flasher")
              if [[ "$REGION" == "CN" ]]; then
                by_ftype=("SuperHybrid Flasher CN")
              else
                by_ftype=("SuperHybrid Flasher")
              fi
            ;;
            "RegionalHybrid Flasher")
              if [[ "$REGION" == "CN" ]]; then
                by_ftype=("RegionalHybrid Flasher CN")
              else
                by_ftype=("Regional Hybrid Flasher")
              fi
            ;;
            "SuperHybrid SunOS Flasher")
              by_ftype=("SuperHybrid SunOS Flasher")
            ;;
            "Super Flasher")
              if [[ "$REGION" == "CN" && ( "$DEV" == "13R" || "$DEV" == "13T" || "$DEV" == "Ace5" ) ]]; then
                by_ftype=("Super Flasher CN")
              else
                by_ftype=("Super Flasher")
              fi
            ;;
            "Regional Flasher")
              if [[ "$REGION" == "CN" && ( "$DEV" == "Ace5" || "$DEV" == "Ace5Pro" ) ]]; then
                by_ftype=("Regional Flasher CN")
              else
                by_ftype=("Regional Flasher")
              fi
            ;;
          esac

          # Fallbacks (beide Schreibweisen + CN-Varianten)
          fallback=(
            "RegionalHybrid Flasher CN"
            "Regional Hybrid Flasher"
            "RegionalHybrid Flasher"
            "SuperHybrid Flasher CN"
            "SuperHybrid Flasher"
            "SuperHybrid SunOS Flasher"
            "Super Flasher CN"
            "Super Flasher"
            "Regional Flasher CN"
            "Regional Flasher"
          )

          mapfile -t candidates < <(printf "%s\n" "${by_ftype[@]}" "${fallback[@]}" | awk '!seen[$0]++')

          # Kandidaten robust (CN/Space/ohne Space)
          mapfile -t candidates < <(
            printf "%s\n" "${by_ftype[@]}" \
              "SuperHybrid Flasher CN" \
              "Regional Hybrid Flasher" "RegionalHybrid Flasher" \
              "SuperHybrid Flasher" "SuperHybrid SunOS Flasher" \
              "Super Flasher CN" "Super Flasher" "Regional Flasher CN" "Regional Flasher" \
            | awk '!seen[$0]++'
          )

          echo "Folders in OTA_DIR:"
          ls -la "$ota_dir" || true

          result_dir=""
          for name in "${candidates[@]}"; do
            p="$ota_dir/$name"
            if [ -d "$p" ]; then result_dir="$p"; break; fi
          done
          [ -n "$result_dir" ] || {
            echo "Could not find builder output folder next to OTA in '$ota_dir'."
            echo "Looked for:"; printf ' - %s\n' "${candidates[@]}"; exit 1;
          }

          zip_root="$GITHUB_WORKSPACE/$OUT_DIR"
          mkdir -p "$zip_root"

          ftype_name="$FTYPE"
          region_code="$REGION"
          ver="${OTA_VERSION:-UNKNOWN}"

          case "$region_code" in
            CN)  region_disp="COS" ;;
            GLO) region_disp="Global" ;;
            EU)  region_disp="EU" ;;
            IN)  region_disp="IN" ;;
            NA)  region_disp="NA" ;;
            *)   region_disp="$region_code" ;;
          esac

          case "$DEV" in
            "13T")
              if [[ "$REGION" == "CN" ]]; then os_tag="COS"; else os_tag="OOS"; fi
              artifact_base="${ftype_name} 13T ${os_tag} ${ver}"
            ;;
            "13S")
              artifact_base="${ftype_name} 13S ${ver}"
            ;;
            "13R")
              artifact_base="${ftype_name} 13R ${region_disp} ${ver}"
            ;;
            "Ace5")
              region_tag="$region_code"
              if [[ "$region_code" == "CN" ]]; then os_tag="COS"; else os_tag="OOS+COS"; fi
              artifact_base="${ftype_name} A5 ${region_tag} ${os_tag} ODM ${ver}"
            ;;
            "Ace5Pro")
              artifact_base="${ftype_name} A5P ${region_disp} ${ver}"
            ;;
            *)
              artifact_base="${ftype_name} ${region_disp} ${ver}"
            ;;
          esac

          zip_path="$zip_root/${artifact_base}.zip"
          rm -f "$zip_path"

          cd "$result_dir"

          if command -v 7zz >/dev/null 2>&1; then
            seven=7zz
          elif command -v 7z >/dev/null 2>&1; then
            seven=7z
          else
            seven=""
          fi

          if [ -n "$seven" ]; then
            "$seven" a -tzip -mm=Deflate -mx=5 -mfb=32 -mmt=on "$zip_path" .
          else
            zip -qr -5 "$zip_path" .
          fi

          [ -f "$zip_path" ] || { echo "Packaging failed: ZIP not created at $zip_path"; exit 1; }

          {
            echo "ARTIFACT_NAME=$artifact_base"
            echo "ZIP_FILE=$zip_path"
          } >> "$GITHUB_ENV"

      - name: Upload artifact (single zip only)
        if: ${{ inputs.upload_to == 'Artifact Only' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Compute upload paths
        shell: bash
        run: |
          set -euo pipefail
          device="${{ inputs.device }}"
          ftype="${{ inputs.flasher_type }}"
          region="${{ inputs.region }}"
          upload_to="${{ inputs.upload_to }}"

          if [[ "$device" == "Oneplus 13T" && "$ftype" == "Super Flasher" && "$region" == "IN" ]]; then
            category="OxygenOS Flashers"
          elif [[ "$device" == "Oneplus Ace 5 Pro" ]]; then
            category="Regional Flashers"
          else
            if [[ "$ftype" =~ ^(SuperHybrid Flasher|SuperHybrid SunOS Flasher|Super Flasher)$ ]]; then
              category="Super Flashers"
            else
              category="Regional Flashers"
            fi
          fi

          no_region_devices=("Oneplus 13S" "Oneplus 13T" "Oneplus Ace 5" "Oneplus Ace 5 Pro")
          needs_region=1
          for n in "${no_region_devices[@]}"; do
            [[ "$n" == "$device" ]] && needs_region=0
          done

          if [[ "$device" == "Oneplus Ace 5" && "$region" != "CN" ]]; then
            base="$device/OxygenOS/$category"
            rel="$base"
          elif [[ $needs_region -eq 1 ]]; then
            case "$region" in
              CN)  region_folder="COS" ;;
              GLO) region_folder="Global" ;;
              EU)  region_folder="EU" ;;
              IN)  region_folder="IN" ;;
              NA)  region_folder="NA" ;;
              *)   region_folder="$region" ;;
            esac
            rel="$device/$category/$region_folder"
          else
            rel="$device/$category"
          fi

          rel="${rel//\\//}"
          [[ "${rel: -1}" == "/" ]] || rel="${rel}/"
          echo "REL_UPLOAD_DIR=$rel" >> "$GITHUB_ENV"

          ftp_base="$(printf "%s" "${{ secrets.DS_FTP_PATH }}" | sed 's#^/*##; s#/*$##;')"
          if [ -n "$ftp_base" ]; then ftp_abs="$ftp_base/$rel"; else ftp_abs="$rel"; fi
          echo "FTP_UPLOAD_DIR=$ftp_abs" >> "$GITHUB_ENV"

          if [[ "$upload_to" == "Sourceforge" || "$upload_to" == "Both DS_FTP & Sourceforge" ]]; then
            sf_base_abs="$(printf "%s" "${{ secrets.SF_PROJECT_PATH }}" | tr -d '\r')"
            if [ -z "$sf_base_abs" ] || [[ "$sf_base_abs" != /* ]]; then
              echo "SF_PROJECT_PATH must be an absolute path like /home/frs/project/oneplus13flashers"
              exit 1
            fi
            sf_base_abs="$(printf "%s" "$sf_base_abs" | sed 's#\\#/#g; s#/*$##')"
            echo "SF_UPLOAD_DIR=$sf_base_abs/$rel" >> "$GITHUB_ENV"
          else
            echo "SF_UPLOAD_DIR=" >> "$GITHUB_ENV"
          fi

      - name: Upload to DS_FTP (curl, streamed)
        if: ${{ inputs.upload_to == 'DS_FTP' || inputs.upload_to == 'Both DS_FTP & Sourceforge' }}
        env:
          DS_FTP_HOST: ${{ secrets.DS_FTP_HOST }}
          DS_FTP_USER: ${{ secrets.DS_FTP_USER }}
          DS_FTP_PASS: ${{ secrets.DS_FTP_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DS_FTP_HOST:?Missing DS_FTP_HOST}"
          : "${DS_FTP_USER:?Missing DS_FTP_USER}"
          : "${DS_FTP_PASS:?Missing DS_FTP_PASS}"

          remote_dir="$(printf "%s" "$FTP_UPLOAD_DIR" | sed 's#^/*##')"  # e.g. "Oneplus 13/Super Flashers/Global/"
          file_name="${ARTIFACT_NAME}.zip"
          zip_path="$ZIP_FILE"
          [ -f "$zip_path" ] || { echo "ZIP not found: $zip_path"; exit 1; }

          # URL-encode (Slash bleibt erhalten)
          if command -v python3 >/dev/null 2>&1; then
            enc_path="$(python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1], safe='/'))" "${remote_dir}${file_name}")"
          else
            enc_path="$(printf '%s' "${remote_dir}${file_name}" \
              | sed -e 's/%/%25/g' -e 's/ /%20/g' -e 's/#/%23/g' -e 's/+/%2B/g' -e 's/?/%3F/g')"
          fi

          url="ftp://${DS_FTP_HOST}/${enc_path}"
          echo "Uploading via curl to: $url"

          curl --ftp-pasv --disable-eprt --ftp-method nocwd \
               --user "${DS_FTP_USER}:${DS_FTP_PASS}" \
               --ftp-create-dirs \
               -T "$zip_path" "$url" \
               --fail --show-error --silent


      - name: Notify Telegram
        if: ${{ inputs.upload_to == 'DS_FTP' || inputs.upload_to == 'Both DS_FTP & Sourceforge' }}
        shell: bash
        run: |
          set -euo pipefail

          device_disp="${{ inputs.device }}"
          region="$REGION"
          ftype="$FTYPE"
          artifact="$ARTIFACT_NAME"
          ftp_rel_dir="$FTP_UPLOAD_DIR"

          # Type-Ordner wie in Windows:
          if [[ "$ftype" == "RegionalHybrid Flasher" ]]; then
            type_dir="Regional Flashers"
          else
            type_dir="Super Flashers"
          fi

          # Region-Anzeige wie in Windows:
          case "$region" in
            GLO) region_dir="Global" ;;
            CN)  region_dir="COS" ;;
            *)   region_dir="$region" ;;
          esac

          # Hauptdownload-Link (FTP → download.php)
          raw_path="Files/${ftp_rel_dir}${artifact}.zip"
          enc_raw="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$raw_path")"
          enc_raw="${enc_raw//%20/+}"
          zip_link="https://roms.danielspringer.at/download.php?file=${enc_raw}&download=true"

          # Pfad für download_from_zip.php (ohne "Files/")
          zip_plain="${device_disp}/${type_dir}/${region_dir}/${artifact}.zip"
          zip_param="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$zip_plain")"
          zip_param="${zip_param//%20/+}"

          # COS vs OOS Folder im ZIP
          if [[ "$region" == "CN" ]]; then img_folder="COS_FILES_HERE"; else img_folder="OOS_FILES_HERE"; fi
          boot_param="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "${img_folder}/boot.img")"
          boot_param="${boot_param//%20/+}"
          init_boot_param="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "${img_folder}/init_boot.img")"
          init_boot_param="${init_boot_param//%20/+}"

          boot_link="https://roms.danielspringer.at/download_from_zip.php?zip=${zip_param}&file=${boot_param}"
          init_boot_link="https://roms.danielspringer.at/download_from_zip.php?zip=${zip_param}&file=${init_boot_param}"

          # Pfad für Payload-Datei
          payload_path="$RUNNER_TEMP/tg_payload.json"

          # Variablen an Python via ENV
          export TG_DEVICE="$device_disp"
          export TG_ARTIFACT="$artifact"
          export TG_ZIP_LINK="$zip_link"
          export TG_BOOT_LINK="$boot_link"
          export TG_INIT_BOOT_LINK="$init_boot_link"
          export TG_PAYLOAD_PATH="$payload_path"

          # JSON in Datei schreiben (ohne Here-Doc)
          python3 -c "
import os, json
device = os.environ['TG_DEVICE']
artifact = os.environ['TG_ARTIFACT']
zip_link = os.environ['TG_ZIP_LINK']
boot_link = os.environ['TG_BOOT_LINK']
init_boot_link = os.environ['TG_INIT_BOOT_LINK']
out = os.environ['TG_PAYLOAD_PATH']

sparkle = '\u2728'
dl = '\u2B07'
pkg = '\U0001F4E6'

msg = f'{sparkle} <b>New Build released</b> {sparkle}\n{device} <b>{artifact}</b>'
payload = {
  'chat_id': -1001902568181,
  'text': msg,
  'parse_mode': 'HTML',
  'disable_web_page_preview': True,
  'reply_markup': {
    'inline_keyboard': [
      [ { 'text': f'{dl} Download ZIP', 'url': zip_link } ],
      [ { 'text': f'{pkg} boot.img', 'url': boot_link },
        { 'text': f'{pkg} init_boot.img', 'url': init_boot_link } ]
    ]
  }
}
open(out, 'w', encoding='utf-8').write(json.dumps(payload, ensure_ascii=False, separators=(',',':')))
"

          # Absenden
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
               -H "Content-Type: application/json; charset=utf-8" \
               --data-binary "@${payload_path}"




      - name: Setup SSH for SourceForge
        if: ${{ inputs.upload_to == 'Sourceforge' || inputs.upload_to == 'Both DS_FTP & Sourceforge' }}
        env:
          SF_SSH_PRIVATE_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SF_SSH_PRIVATE_KEY:?Missing SF_SSH_PRIVATE_KEY}"
          ssh_dir="$HOME/.ssh"
          mkdir -p "$ssh_dir"
          key_path="$ssh_dir/id_ed25519"
          printf "%s\n" "$SF_SSH_PRIVATE_KEY" | sed 's/\r$//' > "$key_path"
          chmod 600 "$key_path"
          # beide Host-Key-Typen aufnehmen
          ssh-keyscan -t rsa frs.sourceforge.net >> "$ssh_dir/known_hosts" 2>/dev/null
          ssh-keyscan -t ed25519 frs.sourceforge.net >> "$ssh_dir/known_hosts" 2>/dev/null

      - name: Upload to SourceForge (SCP)
        if: ${{ inputs.upload_to == 'Sourceforge' || inputs.upload_to == 'Both DS_FTP & Sourceforge' }}
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SF_USERNAME:?Missing SF_USERNAME}"
          : "${SF_UPLOAD_DIR:?Missing SF_UPLOAD_DIR}"
          zip="$ZIP_FILE"
          [ -f "$zip" ] || { echo "ZIP file not found: $zip"; exit 1; }
          dest_dir="$(printf "%s" "$SF_UPLOAD_DIR" | sed 's#\\#/#g; s#/*$##')"
          dest="${dest_dir}/${ARTIFACT_NAME}.zip"
          key="$HOME/.ssh/id_ed25519"

          ssh -i "$key" -o StrictHostKeyChecking=yes "${SF_USERNAME}@frs.sourceforge.net" "test -d \"$dest_dir\" || { echo 'ERROR: Destination folder does not exist on SourceForge: ' \"$dest_dir\"; exit 66; }"
          echo "Uploading to SourceForge: $dest"
          scp -i "$key" -o StrictHostKeyChecking=yes "$zip" "${SF_USERNAME}@frs.sourceforge.net:\"$dest\""
