name: Build Tools (Linux)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
          - Oneplus Ace 5
          - Oneplus Ace 5 Pro
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
          - SuperHybrid Matrixx Flasher
          - Super Flasher
          - Regional Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - DS_FTP
          - Artifact Only
        default: DS_FTP
      notify_telegram:
        description: "Notify Telegram"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: [self-hosted, Linux, X64, github]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          # CRLF -> LF
          git ls-files '*.sh' | while read -r f; do sed -i 's/\r$//' "$f"; done
          # Make executable
          find build_scripts   -type f -name "*.sh" -exec chmod +x {} +
          find super_packers   -type f -name "*.sh" -exec chmod +x {} +
          find flasher_scripts -type f -name "*.sh" -exec chmod +x {} +
          # Binaries (if present)
          [ -f lpmake/lpmake ] && chmod +x lpmake/lpmake || true
          [ -f otaripper/otaripper ] && chmod +x otaripper/otaripper || true

      - name: Prep dirs and placeholder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p download "${OUT_DIR}"
          url="${{ inputs.ota_url }}"
          url="$(printf "%s" "$url" | xargs)"  # trim
          if [ -z "$url" ]; then
            echo "Placeholder OTA for dry-run" > download/PLACEHOLDER.txt
            rm -f download/OTA.zip
            (cd download && zip -q OTA.zip PLACEHOLDER.txt)
          fi

      - name: Download OTA zip
        if: ${{ inputs.ota_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p download
          if command -v aria2c >/dev/null 2>&1; then
            aria2c -x 8 -s 8 -c --file-allocation=none --retry-wait=5 --max-tries=10 --timeout=30 \
              -o "download/OTA.zip" "${{ inputs.ota_url }}"
          else
            curl -L --fail --retry 5 --retry-delay 5 -o "download/OTA.zip" "${{ inputs.ota_url }}"
          fi

      - name: Export OTA env
        shell: bash
        run: |
          set -euo pipefail
          test -f "download/OTA.zip" || { echo "OTA.zip not found in download/"; exit 1; }
          ota="$(realpath download/OTA.zip)"
          ota_dir="$(dirname "$ota")"
          {
            echo "OTA_PATH=$ota"
            echo "OTA_DIR=$ota_dir"
          } >> "$GITHUB_ENV"

      - name: Extract OTA version (from META-INF/com/android/metadata)
        if: ${{ inputs.flasher_type != 'SuperHybrid SunOS Flasher' }}
        shell: bash
        run: |
          set -euo pipefail
          content="$(unzip -p "$OTA_PATH" META-INF/com/android/metadata 2>/dev/null || true)"
          [ -n "$content" ] || { echo "metadata not found in OTA.zip"; exit 1; }
          version_line="$(printf "%s" "$content" | grep -E '^version_name=')" || { echo "version_name not found in metadata"; exit 1; }
          val="${version_line#version_name=}"
          numeric="$(printf "%s" "$val" | grep -oE '[0-9]+(\.[0-9]+){1,4}' | awk '{ print length, $0 }' | sort -nr | head -n1 | cut -d" " -f2-)"
          [ -n "$numeric" ] || { echo "Could not parse numeric version from '$val'"; exit 1; }
          echo "Parsed OTA version: $numeric"
          echo "OTA_VERSION=$numeric" >> "$GITHUB_ENV"

      - name: Set default OTA version for SunOS
        if: ${{ inputs.flasher_type == 'SuperHybrid SunOS Flasher' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Skipping OTA version extraction for SunOS, using default version"
          echo "OTA_VERSION=UNKNOWN" >> "$GITHUB_ENV"

      - name: Map device → pick builder
        shell: bash
        run: |
          set -euo pipefail
          dev_disp="${{ inputs.device }}"
          case "$dev_disp" in
            "Oneplus 13") dev="13" ;;
            "Oneplus 13R") dev="13R" ;;
            "Oneplus 13S") dev="13S" ;;
            "Oneplus 13T") dev="13T" ;;
            "Oneplus Ace 5") dev="Ace5" ;;
            "Oneplus Ace 5 Pro") dev="Ace5Pro" ;;
            *) echo "Unknown device: $dev_disp"; exit 1 ;;
          esac

          ftype="${{ inputs.flasher_type }}"
          region="${{ inputs.region }}"

          pick_bat() {
            case "$ftype" in
              "SuperHybrid Flasher")
                if [[ "$dev" == "Ace5" || "$dev" == "Ace5Pro" ]]; then echo "Hybrid flashers are not supported for $dev_disp." >&2; exit 1; fi
                if [[ "$region" == "CN" ]]; then echo "SUPERHYBRID_CN_FULL_SUPERBUILD"; else echo "SUPERHYBRID_FULL_SUPERBUILD"; fi
              ;;
              "RegionalHybrid Flasher")
                if [[ "$dev" == "Ace5" || "$dev" == "Ace5Pro" ]]; then echo "Hybrid flashers are not supported for $dev_disp." >&2; exit 1; fi
                if [[ "$region" == "CN" ]]; then echo "REGIONALHYBRID_CN_FULL_BUILD"; else echo "REGIONALHYBRID_FULL_BUILD"; fi
              ;;
              "SuperHybrid SunOS Flasher")
                if [[ "$dev" == "Ace5" || "$dev" == "Ace5Pro" ]]; then echo "Hybrid flashers are not supported for $dev_disp." >&2; exit 1; fi
                echo "SUPERHYBRID_SUNOS_FULL_SUPERBUILD"
              ;;
              "SuperHybrid Matrixx Flasher")
                if [[ "$dev" != "13" ]]; then echo "Matrixx flasher is available for Oneplus 13 only." >&2; exit 1; fi
                echo "SUPERHYBRID_MATRIXX_FULL_SUPERBUILD"
              ;;
              "Super Flasher")
                if   [[ "$dev" == "13R" && "$region" == "CN" ]]; then echo "SUPER_CN_FULL_SUPERBUILD"
                elif [[ "$dev" == "13R" ]]; then echo "SUPER_EUGLO_FULL_SUPERBUILD"
                elif [[ "$dev" == "13S" ]]; then echo "SUPER_IN_FULL_SUPERBUILD"
                elif [[ "$dev" == "13T" && "$region" == "CN" ]]; then echo "SUPER_CN_FULL_SUPERBUILD"
                elif [[ "$dev" == "13T" ]]; then echo "SUPER_IN_FULL_SUPERBUILD"
                elif [[ "$dev" == "Ace5" && "$region" == "CN" ]]; then echo "SUPER_CN_FULL_SUPERBUILD"
                elif [[ "$dev" == "Ace5" ]]; then echo "SUPER_OOS_FULL_SUPERBUILD"
                elif [[ "$dev" == "Ace5Pro" ]]; then echo "ERROR_ACE5PRO_REGIONAL_ONLY"
                else echo "SUPERHYBRID_FULL_SUPERBUILD"; fi
              ;;
              "Regional Flasher")
                if   [[ "$dev" == "13R" && "$region" == "CN" ]]; then echo "REGIONAL_CN_FULL_BUILD"
                elif [[ "$dev" == "13R" ]]; then echo "REGIONAL_EUGLO_FULL_BUILD"
                elif [[ "$dev" == "13S" ]]; then echo "REGIONAL_IN_FULL_BUILD"
                elif [[ "$dev" == "Ace5Pro" ]]; then echo "REGIONAL_ACE5PRO_CN_FULL_BUILD"
                elif [[ "$dev" == "Ace5" ]]; then echo "REGIONAL_CN_FULL_BUILD"
                else echo "REGIONALHYBRID_FULL_BUILD"; fi
              ;;
              *)
                echo "Unknown flasher type: $ftype" >&2; exit 1 ;;
            esac
          }

          base_name="$(pick_bat)"
          if [[ "$base_name" == "ERROR_ACE5PRO_REGIONAL_ONLY" ]]; then
            echo "Ace 5 Pro supports Regional Flasher only." >&2
            exit 1
          fi

          builder_sh="${base_name}.sh"

          {
            echo "DEV=$dev"
            echo "FTYPE=$ftype"
            echo "REGION=$region"
            echo "BUILDER_SH=$builder_sh"
          } >> "$GITHUB_ENV"

      - name: Stage files
        shell: bash
        run: |
          set -euo pipefail

          # -----------------------------
          # Helpers
          # -----------------------------
          copy_bloat_from_folder () {
            local base="$1" folder="$2" dest="$3"; shift 3 || true
            local skip_list=("$@")  # array of exact filenames to skip
            [ -n "${folder:-}" ] || return 0
            local src="${base}/${folder}"
            [ -d "$src" ] || return 0
            mkdir -p "$dest"
            local needed=( "my_preload.img" "my_company.img" "odm.img" "oplusstanvbk.img" "my_region.img" )
            for f in "${needed[@]}"; do
              local skip=0
              for s in "${skip_list[@]}"; do
                if [[ "$f" == "$s" ]]; then skip=1; break; fi
              done
              [ "$skip" -eq 1 ] && continue
              if [ -f "$src/$f" ]; then
                cp -f "$src/$f" "$dest/"
                continue
              fi
              local stub="$src/${f%.img}"
              if [ -f "$stub" ]; then
                local url; url="$(tr -d '\r' < "$stub" | xargs || true)"
                if [ -n "$url" ]; then
                  echo "Downloading $f from $url"
                  curl -L --fail --retry 3 --retry-delay 5 -o "$dest/$f" "$url" || echo "WARN: download failed for $f"
                fi
              fi
            done
          }

          copy_debloat_pair () {
            local debloat_dir="$1" dest="$2"
            [ -d "$debloat_dir" ] || return 0
            mkdir -p "$dest"
            # my_company.img + my_preload.img (stub allowed for my_preload)
            for f in "my_company.img" "my_preload.img"; do
              if [ -f "$debloat_dir/$f" ]; then
                cp -f "$debloat_dir/$f" "$dest/"
              else
                local stub="$debloat_dir/${f%.img}"
                if [ -f "$stub" ]; then
                  local url; url="$(tr -d '\r' < "$stub" | xargs || true)"
                  if [ -n "$url" ]; then
                    echo "Downloading $f from $url"
                    curl -L --fail --retry 3 --retry-delay 5 -o "$dest/$f" "$url" || echo "WARN: download failed for $f"
                  fi
                fi
              fi
            done
          }

          normalize_updater_script_lf () {
            local meta_root="$1"
            local up="$meta_root/com/google/android/updater-script"
            [ -f "$up" ] || return 0
            awk '{ sub(/\r$/,""); print }' "$up" > "$up.tmp" && mv "$up.tmp" "$up"
          }

          get_bloat_folder () {
            # args: dev region
            local dev="$1" region="$2"
            case "$dev" in
              "Ace5")
                case "$region" in
                  CN) echo "CN_BLOAT" ;;
                  EU|GLO) echo "EUGLO_BLOAT" ;;
                  IN) echo "IN_BLOAT" ;;
                  NA) echo "NA_BLOAT" ;;
                  *) echo "" ;;
                esac
              ;;
              "Ace5Pro")
                if [[ "$region" == "CN" ]]; then echo "A5P_BLOAT"; else echo ""; fi
              ;;
              *)
                case "$region" in
                  CN) echo "CN_BLOAT" ;;
                  EU|GLO) echo "EUGLO_BLOAT" ;;
                  IN) echo "IN_BLOAT" ;;
                  NA) echo "NA_BLOAT" ;;
                  *) echo "" ;;
                esac
              ;;
            esac
          }

          get_os_subtree () {
            # args: dev ftype region -> prints 'oos' or 'cos'
            local dev="$1" ftype="$2" region="$3"
            if [[ "$ftype" == *Hybrid* ]]; then
              if [[ "$region" == "CN" ]]; then echo "cos"; else echo "oos"; fi
              return
            fi
            if [[ "$ftype" == "Regional Flasher" ]]; then
              if [[ "$region" == "CN" ]]; then echo "cos"; else echo "oos"; fi
              return
            fi
            if [[ "$ftype" == "Super Flasher" ]]; then
              if { [[ "$dev" == "13T" || "$dev" == "Ace5" ]] && [[ "$region" == "CN" ]]; }; then
                echo "cos"
              else
                echo "oos"
              fi
              return
            fi
            echo "oos"
          }

          copy_or_download () {
            local dir="$1" base="$2" dest="$3"
            if [ -f "$dir/${base}.img" ]; then
              cp -f "$dir/${base}.img" "$dest"
            else
              local stub="$dir/${base}"
              if [ -f "$stub" ]; then
                local url; url="$(tr -d '\r' < "$stub" | xargs || true)"
                if [ -n "$url" ]; then
                  echo "Downloading ${base}.img from $url"
                  curl -L --fail --retry 3 --retry-delay 5 -o "$dest" "$url" || echo "WARN: download failed for ${base}.img"
                fi
              fi
            fi
          }

          # -----------------------------
          # Inputs / paths
          # -----------------------------
          dev_raw="$DEV"
          # normalize device like Jonas: first matching token
          if [[ "$dev_raw" =~ (Ace5Pro|Ace5|13T|13S|13R|13) ]]; then
            dev="${BASH_REMATCH[1]}"
          else
            dev="${dev_raw%% *}"
          fi

          ftype="$FTYPE"
          region="$REGION"
          root="$GITHUB_WORKSPACE"

          echo "DEV(raw)='$dev_raw' → DEV(norm)='$dev' • FTYPE='$ftype' • REGION='$region'"

          # Ace5Pro uses Ace5 trees
          if [[ "$dev" == "Ace5Pro" || "$dev" == "Ace5" ]]; then
            script_dev="Ace5"
          else
            script_dev="$dev"
          fi

          builder_dir="$root/build_scripts/$script_dev"
          bloat_base="$root/bloat/$script_dev"

          # Fresh OUT_DIR
          rm -rf "$OUT_DIR" || true
          mkdir -p "$OUT_DIR"

          # Main folder: otaripper + builder .sh (Linux)
          if [ -f "$root/otaripper/otaripper" ]; then
            cp -f "$root/otaripper/otaripper" "$OUT_DIR/"
            chmod +x "$OUT_DIR/otaripper"
          fi
          if [ -n "${BUILDER_SH:-}" ] && [ -f "$builder_dir/$BUILDER_SH" ]; then
            cp -f "$builder_dir/$BUILDER_SH" "$OUT_DIR/"
            chmod +x "$OUT_DIR/$BUILDER_SH"
          fi

          # Working folder name (CN variants where needed)
          case "$ftype" in
            "SuperHybrid Flasher")
              if [[ "$dev" == "13" && "$region" == "CN" ]]; then work_name="SuperHybrid Flasher CN"; else work_name="SuperHybrid Flasher"; fi
            ;;
            "RegionalHybrid Flasher")
              if [[ "$region" == "CN" ]]; then work_name="RegionalHybrid Flasher CN"; else work_name="RegionalHybrid Flasher"; fi
            ;;
            "SuperHybrid SunOS Flasher")
              if [[ "$region" == "CN" ]]; then work_name="SuperHybrid SunOS Flasher CN"; else work_name="SuperHybrid SunOS Flasher"; fi
            ;;
            "Super Flasher")
              if { [[ "$dev" == "13R" || "$dev" == "13T" || "$dev" == "Ace5" ]] && [[ "$region" == "CN" ]]; }; then
                work_name="Super Flasher CN"
              else
                work_name="Super Flasher"
              fi
            ;;
            "Regional Flasher")
              if { [[ "$dev" == "13R" || "$dev" == "Ace5" || "$dev" == "Ace5Pro" ]] && [[ "$region" == "CN" ]]; }; then
                work_name="Regional Flasher CN"
              else
                work_name="Regional Flasher"
              fi
            ;;
            *) work_name="$ftype" ;;
          esac

          work_dir="$OUT_DIR/$work_name"
          mkdir -p "$work_dir"

          # Template root selection
          if [[ "$dev" == "Ace5" || "$dev" == "Ace5Pro" ]]; then
            tpl_dev="Ace5"
          else
            tpl_dev="$dev"
          fi

          if [[ "$ftype" == "SuperHybrid Matrixx Flasher" ]]; then
            # Fixed path for Matrixx templates
            tpl_base="$root/flasher_scripts/13/matrixx/super"
          elif [[ "$ftype" == "SuperHybrid SunOS Flasher" ]]; then
            tpl_base="$root/flasher_scripts/$tpl_dev/sunos/super"
          else
            os_sub="$(get_os_subtree "$dev" "$ftype" "$region")"
            kind="$([[ "$ftype" == *Super* ]] && echo "super" || echo "regional")"
            tpl_base="$root/flasher_scripts/$tpl_dev/$os_sub/$kind"
            # Ace5Pro • Regional Flasher • CN → force Ace5\cos\regional
            if [[ "$dev" == "Ace5Pro" && "$ftype" == "Regional Flasher" && "$region" == "CN" ]]; then
              tpl_base="$root/flasher_scripts/Ace5/cos/regional"
            fi
          fi

          echo "Using flasher template: $tpl_base"
          if [ ! -d "$tpl_base" ]; then
            echo "ERROR: Flasher template not found: $tpl_base (dev=$dev, ftype=$ftype, region=$region)" >&2
            exit 1
          fi

          # -----------------------------
          # SunOS block (UNCHANGED)
          # -----------------------------
          if [[ "$ftype" == "SuperHybrid SunOS Flasher" ]]; then
            fastbootd_files="$work_dir/FASTBOOTD_FILES_HERE"
            mkdir -p "$fastbootd_files"
            echo "Downloading SunOS bloat files into FASTBOOTD_FILES_HERE..."
            declare -a sunos_bloat=(
              abl.img aop.img aop_config.img bluetooth.img cpucp.img cpucp_dtb.img
              devcfg.img dsp.img engineering_cdt.img featenabler.img hyp.img imagefv.img
              keymaster.img oplus_sec.img oplusstanvbk.img qupfw.img shrm.img splash.img
              tz.img uefi.img uefisecapp.img xbl.img xbl_config.img xbl_ramdump.img
            )
            for img in "${sunos_bloat[@]}"; do
              url="https://roms.danielspringer.at/download.php?file=Files%2FBloat%2F13%2FSunOS%2F${img}&download=true"
              echo "Downloading $img from $url"
              curl -L --fail --retry 3 --retry-delay 5 -o "$fastbootd_files/$img" "$url" || echo "WARN: Download failed for $img"
            done

            cos_here="$work_dir/COS_FILES_HERE"
            mkdir -p "$cos_here"

            echo "Downloading modem.img for SunOS → COS_FILES_HERE"
            curl -L --fail --retry 3 --retry-delay 5 \
              -o "$cos_here/modem.img" \
              "https://roms.danielspringer.at/download.php?file=Files%2FBloat%2F13%2FSunOS%2FCOS_FILES_HERE%2Fmodem.img&download=true" \
              || echo "WARN: Download failed for modem.img"

            echo "Downloading oplusstanvbk.img for SunOS → COS_FILES_HERE"
            curl -L --fail --retry 3 --retry-delay 5 \
              -o "$cos_here/oplusstanvbk.img" \
              "https://roms.danielspringer.at/download.php?file=Files%2FBloat%2F13%2FSunOS%2FCOS_FILES_HERE%2Foplusstanvbk.img&download=true" \
              || echo "WARN: Download failed for oplusstanvbk.img"

            pdir="$root/super_packers/13"
            super_dir="$work_dir/Super"
            mkdir -p "$super_dir"
            if [[ -f "$pdir/super_sunos.sh" ]]; then
              cp -f "$pdir/super_sunos.sh" "$super_dir/super_sunos.sh"
              chmod +x "$super_dir/super_sunos.sh"
            else
              echo "ERROR: super_sunos.sh not found in $pdir" >&2
              exit 1
            fi

            pt_src="$root/Platform-Tools"
            if [ -d "$pt_src" ]; then
              mkdir -p "$work_dir/Platform-Tools"
              rsync -a "$pt_src/" "$work_dir/Platform-Tools/"
            else
              echo "WARN: Platform-Tools not found at repo root: $pt_src"
            fi

            # lpmake (linux)
            if [ -f "$root/lpmake/lpmake" ]; then
              cp -f "$root/lpmake/lpmake" "$super_dir/"
              chmod +x "$super_dir/lpmake"
            else
              echo "WARN: lpmake not found at $root/lpmake/lpmake"
            fi

            rsync -a --exclude '16DTBO/' --exclude 'dtbo_patcher.sh' --exclude 'Super_Flasher*.bat' "$tpl_base/" "$work_dir/"

            upd="$work_dir/META-INF/com/google/android/updater-script"
            if [ -f "$upd" ]; then
              awk '{ sub(/\r$/,""); print }' "$upd" > "$upd.tmp" && mv "$upd.tmp" "$upd"
            else
              echo "WARN: Expected updater-script not found at: $upd"
            fi

            echo "WORK_DIR=$work_dir" >> "$GITHUB_ENV"
            exit 0
          fi

          # -----------------------------
          # Generic (non-SunOS) copy template
          # -----------------------------
          rsync -a "$tpl_base/" "$work_dir/"

          # HYBRID ONLY: ensure META-INF + LF normalize
          if [[ "$ftype" == *Hybrid* ]]; then
            mi="$tpl_base/META-INF"
            if [ -d "$mi" ]; then
              if [ ! -d "$work_dir/META-INF" ]; then
                mkdir -p "$work_dir/META-INF"
                rsync -a "$mi/" "$work_dir/META-INF/"
              else
                echo "META-INF already present in $work_dir - skipping duplicate copy."
              fi
              normalize_updater_script_lf "$work_dir/META-INF"
            fi
          fi

          # ALWAYS copy Platform-Tools into flasher dir
          pt_src="$root/Platform-Tools"
          if [ -d "$pt_src" ]; then
            mkdir -p "$work_dir/Platform-Tools"
            rsync -a "$pt_src/" "$work_dir/Platform-Tools/"
          else
            echo "WARN: Platform-Tools not found at repo root: $pt_src"
          fi

          # -----------------------------
          # Super builds
          # -----------------------------
          if [[ "$ftype" =~ Super ]]; then
            super_dir="$work_dir/Super"
            mkdir -p "$super_dir"
            # lpmake (linux)
            if [ -f "$root/lpmake/lpmake" ]; then
              cp -f "$root/lpmake/lpmake" "$super_dir/"
              chmod +x "$super_dir/lpmake"
            fi

            # Special handling: SuperHybrid Matrixx Flasher
            if [[ "$ftype" == "SuperHybrid Matrixx Flasher" ]]; then
              # Packer
              pdir="$root/super_packers/13"
              if [[ -f "$pdir/super_matrixx.sh" ]]; then
                cp -f "$pdir/super_matrixx.sh" "$super_dir/super_matrixx.sh"
                chmod +x "$super_dir/super_matrixx.sh"
              else
                echo "ERROR: super_matrixx.sh not found in $pdir" >&2
                exit 1
              fi

              # COS_FILES_HERE: ONLY modem.img + oplusstanvbk.img
              cos_here="$work_dir/COS_FILES_HERE"
              mkdir -p "$cos_here"

              echo "Downloading Matrixx COS files (oplusstanvbk.img, modem.img)..."
              curl -L --fail --retry 3 --retry-delay 5 \
                -o "$cos_here/oplusstanvbk.img" \
                "https://roms.danielspringer.at/download.php?file=Files%2FBloat%2F13%2FSunOS%2FCOS_FILES_HERE%2Foplusstanvbk.img&download=true" \
                || echo "WARN: Download failed for oplusstanvbk.img"

              curl -L --fail --retry 3 --retry-delay 5 \
                -o "$cos_here/modem.img" \
                "https://roms.danielspringer.at/download.php?file=Files%2FBloat%2F13%2FSunOS%2FCOS_FILES_HERE%2Fmodem.img&download=true" \
                || echo "WARN: Download failed for modem.img"

              # No other bloat for Matrixx
            else
              # Packer scripts (existing logic)
              if [[ "$dev" == "13" ]]; then
                pdir="$root/super_packers/13"
                if [[ "$region" == "CN" && "$ftype" == "SuperHybrid Flasher" && -f "$pdir/super_cos.sh" ]]; then
                  cp -f "$pdir/super_cos.sh" "$super_dir/super_cos.sh"; chmod +x "$super_dir/super_cos.sh"
                elif [[ -f "$pdir/super_oos.sh" ]]; then
                  cp -f "$pdir/super_oos.sh" "$super_dir/super_oos.sh"; chmod +x "$super_dir/super_oos.sh"
                fi
              elif [[ "$dev" == "13T" ]]; then
                pdir="$root/super_packers/13T"
                if [[ "$region" == "CN" && -f "$pdir/super_cos.sh" ]]; then
                  cp -f "$pdir/super_cos.sh" "$super_dir/super_cos.sh"; chmod +x "$super_dir/super_cos.sh"
                elif [[ -f "$pdir/super_oos.sh" ]]; then
                  cp -f "$pdir/super_oos.sh" "$super_dir/super_oos.sh"; chmod +x "$super_dir/super_oos.sh"
                fi
              elif [[ "$dev" == "Ace5" ]]; then
                pdir="$root/super_packers/Ace5"
                if [[ "$region" == "CN" && -f "$pdir/super_cos.sh" ]]; then
                  cp -f "$pdir/super_cos.sh" "$super_dir/super_cos.sh"; chmod +x "$super_dir/super_cos.sh"
                elif [[ -f "$pdir/super_oos.sh" ]]; then
                  cp -f "$pdir/super_oos.sh" "$super_dir/super_oos.sh"; chmod +x "$super_dir/super_oos.sh"
                fi
              else
                p="$root/super_packers/$dev/super_oos.sh"
                [ -f "$p" ] && cp -f "$p" "$super_dir/super_oos.sh" && chmod +x "$super_dir/super_oos.sh"
              fi

              # Standard bloat into Super/
              bloat_folder="$(get_bloat_folder "$dev" "$region")"

              if [[ "$dev" == "13T" && "$ftype" == "Super Flasher" && "$region" == "IN" ]]; then
                # Copy all except 3 specific files into Super/
                copy_bloat_from_folder "$bloat_base" "$bloat_folder" "$super_dir" "my_region.img" "oplusstanvbk.img" "odm.img"
                # Then ensure the 3 go into COS_FILES_HERE
                cos_here="$work_dir/COS_FILES_HERE"
                mkdir -p "$cos_here"
                in_bloat="$bloat_base/IN_BLOAT"
                copy_or_download "$in_bloat" "my_region" "$cos_here/my_region.img"
                copy_or_download "$in_bloat" "oplusstanvbk" "$cos_here/oplusstanvbk.img"
                copy_or_download "$in_bloat" "odm" "$cos_here/odm.img"
                # Remove if accidentally landed in Super/
                for f in my_region.img oplusstanvbk.img odm.img; do
                  [ -f "$super_dir/$f" ] && rm -f "$super_dir/$f"
                done
              else
                copy_bloat_from_folder "$bloat_base" "$bloat_folder" "$super_dir"
              fi

              # OP13 • SuperHybrid • non-CN → copy my_region & oplusstanvbk to COS_FILES_HERE
              if [[ "$dev" == "13" && "$ftype" == "SuperHybrid Flasher" && "$region" != "CN" ]]; then
                repo_cos="$root/bloat/13/COS_FILES_HERE"
                if [[ -d "$repo_cos" ]]; then
                  cos_here="$work_dir/COS_FILES_HERE"
                  mkdir -p "$cos_here"
                  for f in my_region.img oplusstanvbk.img; do
                    src="$repo_cos/$f"
                    if [[ -f "$src" ]]; then
                      cp -f "$src" "$cos_here/"
                    else
                      echo "WARN: wanted $f in $repo_cos but not found"
                    fi
                  done
                else
                  echo "WARN: repo COS_FILES_HERE not found: $repo_cos"
                fi
              fi

              # CN extra OOS staging
              if [[ "$region" == "CN" ]]; then
                if [[ "$dev" == "13" && "$ftype" == "SuperHybrid Flasher" ]]; then
                  # OnePlus 13 SuperHybrid CN: EUGLO_BLOAT → OOS_FILES_HERE; NO COS_FILES_HERE
                  oos_here="$work_dir/OOS_FILES_HERE"
                  mkdir -p "$oos_here"
                  copy_bloat_from_folder "$bloat_base" "EUGLO_BLOAT" "$oos_here"
                elif [[ "$dev" != "Ace5" && "$dev" != "Ace5Pro" ]]; then
                  # Other CN 13-series behavior
                  oos_here="$work_dir/OOS_FILES_HERE"
                  mkdir -p "$oos_here"
                  if [[ "$dev" == "13R" ]]; then
                    copy_bloat_from_folder "$bloat_base" "A5_DEBLOAT" "$oos_here"
                  else
                    copy_bloat_from_folder "$bloat_base" "EUGLO_BLOAT" "$oos_here"
                  fi
                fi
              fi

              # Ace5 CN: put A5_DEBLOAT pair into OOS_FILES_HERE
              if [[ "$dev" == "Ace5" && "$region" == "CN" ]]; then
                oos_here="$work_dir/OOS_FILES_HERE"
                mkdir -p "$oos_here"
                copy_debloat_pair "$bloat_base/A5_DEBLOAT" "$oos_here"
              fi
            fi
          fi

          # -----------------------------
          # Regional / RegionalHybrid builds
          # -----------------------------
          if [[ "$ftype" == "Regional Flasher" || "$ftype" == "RegionalHybrid Flasher" ]]; then
            oos_here="$work_dir/OOS_FILES_HERE"
            mkdir -p "$oos_here"

            # Decide OOS bloat source
            if [[ "$dev" == "13" && "$ftype" == "RegionalHybrid Flasher" && "$region" == "CN" ]]; then
              bloat_folder_oos="EUGLO_BLOAT"
            else
              bloat_folder_oos="$(get_bloat_folder "$dev" "$region")"
            fi

            # For RegionalHybrid (non-CN), skip these files in OOS
            skip_oos=()
            if [[ "$ftype" == "RegionalHybrid Flasher" && "$region" =~ ^(GLO|EU|IN|NA)$ ]]; then
              skip_oos=("odm.img" "oplusstanvbk.img" "my_region.img")
            fi

            copy_bloat_from_folder "$bloat_base" "$bloat_folder_oos" "$oos_here" "${skip_oos[@]:-}"

            # COS side (only for CN regions)
            if [[ "$region" == "CN" ]]; then
              cos_here="$work_dir/COS_FILES_HERE"
              mkdir -p "$cos_here"
              if [[ "$dev" == "Ace5Pro" ]]; then
                copy_bloat_from_folder "$bloat_base" "A5P_BLOAT" "$cos_here"
              elif [[ "$dev" == "13" && "$ftype" == "RegionalHybrid Flasher" ]]; then
                # Only my_preload + my_company
                copy_bloat_from_folder "$bloat_base" "CN_BLOAT" "$cos_here" "odm.img" "oplusstanvbk.img" "my_region.img"
              else
                copy_bloat_from_folder "$bloat_base" "CN_BLOAT" "$cos_here"
              fi
            fi

            # 13S + Regional IN: ensure two files in OOS_FILES_HERE
            if [[ "$dev" == "13S" && "$region" == "IN" ]]; then
              for f in my_preload.img my_company.img; do
                [ -f "$bloat_base/IN_BLOAT/$f" ] && cp -f "$bloat_base/IN_BLOAT/$f" "$oos_here/"
              done
            fi

            # Ace5 CN: A5_DEBLOAT pair into OOS_FILES_HERE
            if [[ "$dev" == "Ace5" && "$region" == "CN" ]]; then
              copy_debloat_pair "$bloat_base/A5_DEBLOAT" "$oos_here"
            fi
            # Ace5Pro CN: A5P_DEBLOAT pair into OOS_FILES_HERE
            if [[ "$dev" == "Ace5Pro" && "$region" == "CN" ]]; then
              copy_debloat_pair "$bloat_base/A5P_DEBLOAT" "$oos_here"
            fi
          fi

          # -----------------------------
          # OnePlus 13 + Hybrid extras (SuperHybrid + RegionalHybrid)
          # -----------------------------
          if [[ "$dev" == "13" && ( "$ftype" == "SuperHybrid Flasher" || "$ftype" == "RegionalHybrid Flasher" ) ]]; then
            # Stage 16DTBO from flasher_scripts/13/oos/super/16DTBO
            src16="$root/flasher_scripts/13/oos/super/16DTBO"
            main16="$OUT_DIR/16DTBO"

            if [ -d "$src16" ]; then
              mkdir -p "$main16"
              rsync -a "$src16/" "$main16/"
              dtbo_plain="$main16/dtbo.img"
              dtbo_named="$main16/16.0.0.1_dtbo.img"
              if [ -f "$dtbo_plain" ] && [ ! -f "$dtbo_named" ]; then
                cp -f "$dtbo_plain" "$dtbo_named"
              fi
            else
              echo "WARN: 16DTBO source not found: $src16"
            fi

            # If template dropped 16DTBO inside working dir, move up
            work16="$work_dir/16DTBO"
            if [ -d "$work16" ]; then
              rm -rf "$main16"
              mv "$work16" "$main16"
              echo "Moved stray 16DTBO from working folder to MAIN."
            fi

            # IMPORTANT: For 13 SuperHybrid CN, do NOT stage COS files here (ensure removed)
            if [[ "$region" == "CN" && "$ftype" == "SuperHybrid Flasher" ]]; then
              cos_folder="$work_dir/COS_FILES_HERE"
              if [ -d "$cos_folder" ]; then
                echo "Removing stray COS_FILES_HERE for 13 SuperHybrid CN..."
                rm -rf "$cos_folder"
              fi
            fi
          fi

          # Expose for next steps
          echo "WORK_DIR=$work_dir" >> "$GITHUB_ENV"

      - name: Pre-stage flasher into OTA folder
        if: ${{ inputs.flasher_type == 'RegionalHybrid Flasher' || inputs.flasher_type == 'SuperHybrid Flasher' || inputs.flasher_type == 'SuperHybrid SunOS Flasher' || inputs.flasher_type == 'SuperHybrid Matrixx Flasher' }}
        shell: bash
        run: |
          set -euo pipefail
          src="$WORK_DIR"
          [ -d "$src" ] || { echo "WORK_DIR not found: $src"; exit 1; }
          dst="$OTA_DIR/$(basename "$src")"
          mkdir -p "$dst"
          rsync -a --info=progress2 "$src/" "$dst/"
          [ -f "$OUT_DIR/otaripper" ] && cp -f "$OUT_DIR/otaripper" "$OTA_DIR/"

      - name: Run builder
        shell: bash
        working-directory: ${{ env.OTA_DIR }}
        run: |
          set -euo pipefail
          echo "CWD is $(pwd)"
          echo "Calling builder: \"$GITHUB_WORKSPACE/$OUT_DIR/$BUILDER_SH\" \"$OTA_PATH\""
          bash "$GITHUB_WORKSPACE/$OUT_DIR/$BUILDER_SH" "$OTA_PATH"

      - name: Package final output
        shell: bash
        run: |
          set -euo pipefail
          ota_dir="$OTA_DIR"

          declare -a by_ftype
          case "$FTYPE" in
            "SuperHybrid Flasher")
              if [[ "$REGION" == "CN" ]]; then
                by_ftype=("SuperHybrid Flasher CN")
              else
                by_ftype=("SuperHybrid Flasher")
              fi
            ;;
            "RegionalHybrid Flasher")
              if [[ "$REGION" == "CN" ]]; then
                by_ftype=("RegionalHybrid Flasher CN")
              else
                by_ftype=("Regional Hybrid Flasher")
              fi
            ;;
            "SuperHybrid SunOS Flasher")
              by_ftype=("SuperHybrid SunOS Flasher")
            ;;
            "SuperHybrid Matrixx Flasher")
              by_ftype=("SuperHybrid Matrixx Flasher")
            ;;
            "Super Flasher")
              if [[ "$REGION" == "CN" && ( "$DEV" == "13R" || "$DEV" == "13T" || "$DEV" == "Ace5" ) ]]; then
                by_ftype=("Super Flasher CN")
              else
                by_ftype=("Super Flasher")
              fi
            ;;
            "Regional Flasher")
              if [[ "$REGION" == "CN" && ( "$DEV" == "Ace5" || "$DEV" == "Ace5Pro" ) ]]; then
                by_ftype=("Regional Flasher CN")
              else
                by_ftype=("Regional Flasher")
              fi
            ;;
          esac

          fallback=(
            "RegionalHybrid Flasher CN"
            "Regional Hybrid Flasher"
            "RegionalHybrid Flasher"
            "SuperHybrid Flasher CN"
            "SuperHybrid Flasher"
            "SuperHybrid Matrixx Flasher"
            "SuperHybrid SunOS Flasher"
            "Super Flasher CN"
            "Super Flasher"
            "Regional Flasher CN"
            "Regional Flasher"
          )

          mapfile -t candidates < <(printf "%s\n" "${by_ftype[@]}" "${fallback[@]}" | awk '!seen[$0]++')

          echo "Folders in OTA_DIR:"
          ls -la "$ota_dir" || true

          result_dir=""
          for name in "${candidates[@]}"; do
            p="$ota_dir/$name"
            if [ -d "$p" ]; then result_dir="$p"; break; fi
          done
          [ -n "$result_dir" ] || {
            echo "Could not find builder output folder next to OTA in '$ota_dir'."
            echo "Looked for:"; printf ' - %s\n' "${candidates[@]}"; exit 1;
          }

          zip_root="$GITHUB_WORKSPACE/$OUT_DIR"
          mkdir -p "$zip_root"

          ftype_name="$FTYPE"
          region_code="$REGION"
          ver="${OTA_VERSION:-UNKNOWN}"
          current_date=$(date +%Y%m%d)

          if [[ "$FTYPE" == "SuperHybrid SunOS Flasher" ]]; then
            artifact_base="SuperHybrid Sun-varuna-${current_date}-dodge-Official"
          else
            case "$region_code" in
              CN)  region_disp="COS" ;;
              GLO) region_disp="Global" ;;
              EU)  region_disp="EU" ;;
              IN)  region_disp="IN" ;;
              NA)  region_disp="NA" ;;
              *)   region_disp="$region_code" ;;
            esac

            case "$DEV" in
              "13T")
                if [[ "$REGION" == "CN" ]]; then os_tag="COS"; else os_tag="OOS"; fi
                artifact_base="${ftype_name} 13T ${os_tag} ${ver}"
              ;;
              "13S")
                artifact_base="${ftype_name} 13S ${ver}"
              ;;
              "13R")
                artifact_base="${ftype_name} 13R ${region_disp} ${ver}"
              ;;
              "Ace5")
                if [[ "$region_code" == "CN" ]]; then
                  artifact_base="${ftype_name} A5 COS ${ver}"
                else
                  artifact_base="${ftype_name} A5 ${region_code} OOS+COS ODM ${ver}"
                fi
              ;;
              "Ace5Pro")
                artifact_base="${ftype_name} A5P ${region_disp} ${ver}"
              ;;
              *)
                artifact_base="${ftype_name} ${region_disp} ${ver}"
              ;;
            esac
          fi

          zip_path="$zip_root/${artifact_base}.zip"
          rm -f "$zip_path"

          cd "$result_dir"

          if command -v 7zz >/dev/null 2>&1; then
            seven=7zz
          elif command -v 7z >/dev/null 2>&1; then
            seven=7z
          else
            seven=""
          fi

          if [ -n "$seven" ]; then
            "$seven" a -tzip -mm=Deflate -mx=1 -mfb=32 -mmt=on -bso0 -bsp0 "$zip_path" .
          else
            zip -qr -1 "$zip_path" .
          fi

          [ -f "$zip_path" ] || { echo "Packaging failed: ZIP not created at $zip_path"; exit 1; }

          {
            echo "ARTIFACT_NAME=$artifact_base"
            echo "ZIP_FILE=$zip_path"
          } >> "$GITHUB_ENV"

      - name: Upload artifact
        if: ${{ inputs.upload_to == 'Artifact Only' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Compute upload paths
        shell: bash
        run: |
          set -euo pipefail
          device="${{ inputs.device }}"
          ftype="${{ inputs.flasher_type }}"
          region="${{ inputs.region }}"

          if [[ "$ftype" == "SuperHybrid SunOS Flasher" ]]; then
            category="SunOS Super Flashers"
            rel="Oneplus 13/$category"
          elif [[ "$ftype" == "SuperHybrid Matrixx Flasher" ]]; then
            category="Project Matrixx Super Flashers"
            rel="Oneplus 13/$category"
          elif [[ "$device" == "Oneplus 13T" && "$ftype" == "Super Flasher" && "$region" == "IN" ]]; then
            category="OxygenOS Flashers"
            rel="$device/$category"
          elif [[ "$device" == "Oneplus Ace 5 Pro" ]]; then
            category="Regional Flashers"
            rel="$device/$category"
          else
            if [[ "$ftype" =~ ^(SuperHybrid Flasher|Super Flasher|SuperHybrid Matrixx Flasher)$ ]]; then
              category="Super Flashers"
            else
              category="Regional Flashers"
            fi
            rel="$device/$category"
          fi

          no_region_devices=("Oneplus 13S" "Oneplus 13T" "Oneplus Ace 5" "Oneplus Ace 5 Pro")
          needs_region=1
          for n in "${no_region_devices[@]}"; do
            [[ "$n" == "$device" ]] && needs_region=0
          done

          if [[ "$device" == "Oneplus Ace 5" && "$region" != "CN" ]]; then
            rel="$device/OxygenOS/$category"
          elif [[ $needs_region -eq 1 && "$ftype" != "SuperHybrid SunOS Flasher" ]]; then
            case "$region" in
              CN)  region_folder="COS" ;;
              GLO) region_folder="Global" ;;
              EU)  region_folder="EU" ;;
              IN)  region_folder="IN" ;;
              NA)  region_folder="NA" ;;
              *)   region_folder="$region" ;;
            esac
            rel="$rel/$region_folder"
          fi

          rel="${rel//\\//}"
          [[ "${rel: -1}" == "/" ]] || rel="${rel}/"
          echo "REL_UPLOAD_DIR=$rel" >> "$GITHUB_ENV"

          ftp_base="$(printf "%s" "${{ secrets.DS_FTP_PATH }}" | sed 's#^/*##; s#/*$##;')"
          if [ -n "$ftp_base" ]; then ftp_abs="$ftp_base/$rel"; else ftp_abs="$rel"; fi
          echo "FTP_UPLOAD_DIR=$ftp_abs" >> "$GITHUB_ENV"

      - name: Upload to DS_FTP
        if: ${{ inputs.upload_to == 'DS_FTP' }}
        env:
          DS_FTP_HOST: ${{ secrets.DS_FTP_HOST }}
          DS_FTP_USER: ${{ secrets.DS_FTP_USER }}
          DS_FTP_PASS: ${{ secrets.DS_FTP_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DS_FTP_HOST:?Missing DS_FTP_HOST}"
          : "${DS_FTP_USER:?Missing DS_FTP_USER}"
          : "${DS_FTP_PASS:?Missing DS_FTP_PASS}"

          remote_dir="$(printf "%s" "$FTP_UPLOAD_DIR" | sed 's#^/*##')"  # e.g. "Oneplus 13/SunOS Super Flashers/"
          file_name="${ARTIFACT_NAME}.zip"
          zip_path="$ZIP_FILE"
          [ -f "$zip_path" ] || { echo "ZIP not found: $zip_path"; exit 1; }

          # URL-encode (keep slashes)
          if command -v python3 >/dev/null 2>&1; then
            enc_path="$(python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1], safe='/'))" "${remote_dir}${file_name}")"
          else
            enc_path="$(printf '%s' "${remote_dir}${file_name}" \
              | sed -e 's/%/%25/g' -e 's/ /%20/g' -e 's/#/%23/g' -e 's/+/%2B/g' -e 's/?/%3F/g')"
          fi

          url="ftp://${DS_FTP_HOST}/${enc_path}"
          echo "Uploading via curl to: $url"

          curl --ftp-pasv --disable-eprt --ftp-method nocwd \
               --user "${DS_FTP_USER}:${DS_FTP_PASS}" \
               --ftp-create-dirs \
               -T "$zip_path" "$url" \
               --fail --show-error --silent

      - name: Notify Telegram (Oneplus 13 Main Group -1001902568181)
        if: ${{ inputs.upload_to == 'DS_FTP' && inputs.flasher_type != 'SuperHybrid SunOS Flasher' && inputs.flasher_type != 'SuperHybrid Matrixx Flasher' && inputs.notify_telegram }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8

          device_disp="${{ inputs.device }}"
          region="$REGION"
          ftype="$FTYPE"
          artifact="$ARTIFACT_NAME"
          ftp_rel_dir="$FTP_UPLOAD_DIR"

          # Type folder like on Windows
          if [[ "$ftype" == "RegionalHybrid Flasher" ]]; then
            type_dir="Regional Flashers"
          else
            type_dir="Super Flashers"
          fi

          # Region display like on Windows
          case "$region" in
            GLO) region_dir="Global" ;;
            CN)  region_dir="COS" ;;
            *)   region_dir="$region" ;;
          esac

          # Main download link
          raw_path="Files/${ftp_rel_dir}${artifact}.zip"
          enc_raw="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$raw_path")"
          enc_raw="${enc_raw//%20/+}"
          zip_link="https://roms.danielspringer.at/download.php?file=${enc_raw}&download=true"

          # Path for download_from_zip.php (without "Files/")
          zip_dir="$ftp_rel_dir"
          zip_dir="${zip_dir#Files/}"
          zip_dir="${zip_dir#/}"
          zip_plain="${zip_dir}${artifact}.zip"

          zip_param="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$zip_plain")"
          zip_param="${zip_param//%20/+}"

          # Image folder in ZIP
          if [[ "$ftype" == "SuperHybrid Matrixx Flasher" ]]; then
            img_folder="COS_FILES_HERE"
          elif [[ "$region" == "CN" ]]; then
            img_folder="COS_FILES_HERE"
          else
            img_folder="OOS_FILES_HERE"
          fi

          boot_param="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "${img_folder}/boot.img")"
          boot_param="${boot_param//%20/+}"
          init_boot_param="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "${img_folder}/init_boot.img")"
          init_boot_param="${init_boot_param//%20/+}"

          boot_link="https://roms.danielspringer.at/download_from_zip.php?zip=${zip_param}&file=${boot_param}"
          init_boot_link="https://roms.danielspringer.at/download_from_zip.php?zip=${zip_param}&file=${init_boot_param}"

          # Variables for Python one-liner
          export TG_DEVICE="$device_disp"
          export TG_ARTIFACT="$artifact"
          export TG_ZIP_LINK="$zip_link"
          export TG_BOOT_LINK="$boot_link"
          export TG_INIT_BOOT_LINK="$init_boot_link"
          payload_path="$RUNNER_TEMP/tg_payload.json"
          export TG_PAYLOAD_PATH="$payload_path"

          # Build JSON (ensure_ascii=False => real emojis)
          python3 -c 'import os,json; dev=os.environ["TG_DEVICE"]; art=os.environ["TG_ARTIFACT"]; p={"chat_id":193732076,"text":f"✨ <b>New Build released</b> ✨\n{dev} <b>{art}</b>","parse_mode":"HTML","disable_web_page_preview":True,"reply_markup":{"inline_keyboard":[[{"text":"⬇️ Download ZIP","url":os.environ["TG_ZIP_LINK"]}],[{"text":"📦 boot.img","url":os.environ["TG_BOOT_LINK"]},{"text":"📦 init_boot.img","url":os.environ["TG_INIT_BOOT_LINK"]}]]}}; open(os.environ["TG_PAYLOAD_PATH"],"w",encoding="utf-8").write(json.dumps(p, ensure_ascii=False, separators=(",",":")))'

          # Send
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
               -H "Content-Type: application/json; charset=utf-8" \
               --data-binary "@${payload_path}"

      - name: Notify Telegram (Oneplus 13 ROM Discussion -1002626357574)
        if: ${{ inputs.upload_to == 'DS_FTP' && inputs.notify_telegram && inputs.device == 'Oneplus 13' && (inputs.flasher_type == 'SuperHybrid Flasher' || inputs.flasher_type == 'RegionalHybrid Flasher' || inputs.flasher_type == 'SuperHybrid SunOS Flasher' || inputs.flasher_type == 'SuperHybrid Matrixx Flasher') }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8

          device_disp="${{ inputs.device }}"
          region="$REGION"
          ftype="$FTYPE"
          artifact="$ARTIFACT_NAME"
          ftp_rel_dir="$FTP_UPLOAD_DIR"

          # Main download link
          raw_path="Files/${ftp_rel_dir}${artifact}.zip"
          enc_raw="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$raw_path")"
          enc_raw="${enc_raw//%20/+}"
          zip_link="https://roms.danielspringer.at/download.php?file=${enc_raw}&download=true"

          # Path for download_from_zip.php (without "Files/")
          zip_dir="$ftp_rel_dir"
          zip_dir="${zip_dir#Files/}"
          zip_dir="${zip_dir#/}"
          zip_plain="${zip_dir}${artifact}.zip"

          zip_param="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$zip_plain")"
          zip_param="${zip_param//%20/+}"

          # Choose image folder in ZIP:
          # - Matrixx: COS_FILES_HERE
          # - SunOS:   FASTBOOT_FILES_HERE
          # - CN:      COS_FILES_HERE
          # - else:    OOS_FILES_HERE
          if [[ "$ftype" == "SuperHybrid Matrixx Flasher" ]]; then
            img_folder="FASTBOOT_FILES_HERE"
          elif [[ "$ftype" == "SuperHybrid SunOS Flasher" ]]; then
            img_folder="FASTBOOT_FILES_HERE"
          elif [[ "$region" == "CN" ]]; then
            img_folder="COS_FILES_HERE"
          else
            img_folder="OOS_FILES_HERE"
          fi

          boot_param="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "${img_folder}/boot.img")"
          boot_param="${boot_param//%20/+}"
          init_boot_param="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "${img_folder}/init_boot.img")"
          init_boot_param="${init_boot_param//%20/+}"

          boot_link="https://roms.danielspringer.at/download_from_zip.php?zip=${zip_param}&file=${boot_param}"
          init_boot_link="https://roms.danielspringer.at/download_from_zip.php?zip=${zip_param}&file=${init_boot_param}"

          # Special display name for SunOS builds (avoid double "Oneplus 13")
          if [[ "$ftype" == "SuperHybrid SunOS Flasher" ]]; then
            ver="$(date +%Y%m%d)"
            tg_artifact="SunOS SuperHybrid Flasher ${ver}"
          else
            tg_artifact="$artifact"
          fi

          # Variables for Python one-liner
          export TG_DEVICE="$device_disp"
          export TG_ARTIFACT_TG="$tg_artifact"
          export TG_ZIP_LINK="$zip_link"
          export TG_BOOT_LINK="$boot_link"
          export TG_INIT_BOOT_LINK="$init_boot_link"
          payload_path="$RUNNER_TEMP/tg_payload_op13.json"
          export TG_PAYLOAD_PATH="$payload_path"

          # JSON for the Oneplus 13 channel
          python3 -c 'import os,json; dev=os.environ["TG_DEVICE"]; art=os.environ["TG_ARTIFACT_TG"]; p={"chat_id":193732076,"text":f"✨ <b>New Build released</b> ✨\n{dev} <b>{art}</b>","parse_mode":"HTML","disable_web_page_preview":True,"reply_markup":{"inline_keyboard":[[{"text":"⬇️ Download ZIP","url":os.environ["TG_ZIP_LINK"]}],[{"text":"📦 boot.img","url":os.environ["TG_BOOT_LINK"]},{"text":"📦 init_boot.img","url":os.environ["TG_INIT_BOOT_LINK"]}]]}}; open(os.environ["TG_PAYLOAD_PATH"],"w",encoding="utf-8").write(json.dumps(p, ensure_ascii=False, separators=(",",":")))'

          # Send
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
               -H "Content-Type: application/json; charset=utf-8" \
               --data-binary "@${payload_path}"
