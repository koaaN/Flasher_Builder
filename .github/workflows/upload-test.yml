name: Upload Test

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
          - Super Flasher
          - Regional Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - DS_FTP
          - Sourceforge
          - "Both DS_FTP & Sourceforge"
          - Artifact Only
        default: Artifact Only

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1) Prepare dirs; if no URL, create a placeholder OTA.zip
      - name: Prep dirs and placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "download","$env:OUT_DIR" | Out-Null
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            Set-Content -Path "download\PLACEHOLDER.txt" -Value "Placeholder OTA for dry-run"
            if (Test-Path "download\OTA.zip") { Remove-Item "download\OTA.zip" -Force }
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\OTA.zip" -Force
          }

      # 2) Download with aria2 (fallback to curl) only when URL is provided
      - name: Download OTA zip (aria2 → curl fallback)
        if: ${{ inputs.ota_url != '' }}
        shell: cmd
        run: |
          mkdir download
          if exist aria2\aria2c.exe (
            echo Using aria2c for OTA download...
            aria2\aria2c.exe -x 8 -s 8 -c --file-allocation=none --retry-wait=5 --max-tries=10 --timeout=30 -o download\OTA.zip "${{ inputs.ota_url }}"
          ) else (
            echo aria2c.exe not found, falling back to curl...
            curl -L -o download\OTA.zip "${{ inputs.ota_url }}"
          )

      # 3) Export OTA_PATH and OTA_DIR for later steps
      - name: Export OTA env
        shell: pwsh
        run: |
          if (-not (Test-Path "download\OTA.zip")) { throw "OTA.zip not found in download\" }
          $ota = (Resolve-Path 'download\OTA.zip').Path
          $otaDir = Split-Path -Path $ota -Parent
          "OTA_PATH=$ota"    | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTA_DIR=$otaDir"  | Out-File -FilePath $env:GITHUB_ENV -Append

      # 4) Decide which builder .bat to use (based on device/region/type)
      - name: Map device → pick builder
        shell: pwsh
        run: |
          $devDisp = "${{ inputs.device }}"
          $dev = switch ($devDisp) {
            'Oneplus 13'  { '13' }
            'Oneplus 13R' { '13R' }
            'Oneplus 13S' { '13S' }
            'Oneplus 13T' { '13T' }
            default { throw "Unknown device: $devDisp" }
          }

          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"

          $batName = switch ($ftype) {
            'SuperHybrid Flasher' {
              if ($region -eq 'CN') { 'SUPERHYBRID_CN_FULL_SUPERBUILD.bat' }
              else { 'SUPERHYBRID_FULL_SUPERBUILD.bat' }
            }
            'RegionalHybrid Flasher' {
              if ($region -eq 'CN') { 'REGIONALHYBRID_CN_FULL_BUILD.bat' }
              else { 'REGIONALHYBRID_FULL_BUILD.bat' }
            }
            'SuperHybrid SunOS Flasher' { 'SUPERHYBRID_SUNOS_FULL_SUPERBUILD.bat' }
            'Super Flasher' {
              if     ($dev -eq '13R' -and $region -eq 'CN') { 'SUPER_CN_FULL_SUPERBUILD.bat' }
              elseif ($dev -eq '13R')                        { 'SUPER_EUGLO_FULL_SUPERBUILD.bat' }
              elseif ($dev -eq '13S')                        { 'SUPER_IN_FULL_SUPERBUILD.bat' }
              elseif ($dev -eq '13T' -and $region -eq 'CN') { 'SUPER_CN_FULL_SUPERBUILD.bat' }
              elseif ($dev -eq '13T')                        { 'SUPER_IN_FULL_SUPERBUILD.bat' }
              else                                           { 'SUPERHYBRID_FULL_SUPERBUILD.bat' }
            }
            'Regional Flasher' {
              if     ($dev -eq '13R' -and $region -eq 'CN') { 'REGIONAL_CN_FULL_BUILD.bat' }
              elseif ($dev -eq '13R')                        { 'REGIONAL_EUGLO_FULL_BUILD.bat' }
              elseif ($dev -eq '13S')                        { 'REGIONAL_IN_FULL_BUILD.bat' }
              else                                           { 'REGIONALHYBRID_FULL_BUILD.bat' }
            }
            default { throw "Unknown flasher type: $ftype" }
          }

          "DEV=$dev"             | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE=$ftype"         | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION=$region"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILDER_BAT=$batName" | Out-File -FilePath $env:GITHUB_ENV -Append

      # 5) Stage builder + template source folders in OUT_DIR
      - name: Stage files
        shell: pwsh
        run: |
          function Copy-BloatFiles($base, $region, $dest) {
            $map = @{
              'EU'  = 'EUGLO_BLOAT'
              'GLO' = 'EUGLO_BLOAT'
              'IN'  = 'IN_BLOAT'
              'NA'  = 'NA_BLOAT'
              'CN'  = 'CN_BLOAT'
              'A5'  = 'A5_DEBLOAT'
            }
            $needed = @('my_preload.img','my_company.img','odm.img','oplusstanvbk.img','my_region.img')
            $folder = $map[$region]
            if (-not $folder) { return }
            $src = Join-Path $base $folder
            if (-not (Test-Path $src)) { return }
            if (-not (Test-Path $dest)) { New-Item -ItemType Directory -Force -Path $dest | Out-Null }
            foreach ($f in $needed) {
              $imgPath  = Join-Path $src $f
              if (Test-Path $imgPath) { Copy-Item $imgPath -Destination $dest -Force; continue }
              $stubPath = Join-Path $src ([System.IO.Path]::GetFileNameWithoutExtension($f))
              if (Test-Path $stubPath) {
                try {
                  $url = (Get-Content $stubPath -Raw).Trim()
                  if ($url) {
                    $outFile = Join-Path $dest $f
                    Write-Host ("Downloading missing {0} from {1}" -f $f, $url)
                    Invoke-WebRequest -Uri $url -OutFile $outFile
                  }
                } catch {
                  Write-Warning ("Failed to download {0} from stub URL in {1}: {2}" -f $f, $stubPath, $_.Exception.Message)
                }
              }
            }
          }

          $dev     = $env:DEV
          $ftype   = $env:FTYPE
          $region  = $env:REGION

          $root = $env:GITHUB_WORKSPACE
          $builderDir = Join-Path $root ("build_scripts\" + $dev)
          $bloatBase  = Join-Path $root ("bloat\" + $dev)

          # Fresh OUT_DIR
          if (Test-Path $env:OUT_DIR) { Remove-Item $env:OUT_DIR -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $env:OUT_DIR | Out-Null

          # Place otaripper + builder .bat in OUT_DIR (same dir as the folder the .bat references with %~dp0)
          if (Test-Path (Join-Path $root 'otaripper\otaripper.exe')) {
            Copy-Item (Join-Path $root 'otaripper\otaripper.exe') -Destination $env:OUT_DIR -Force
          }
          $builderSrc = Join-Path $builderDir $env:BUILDER_BAT
          if (Test-Path $builderSrc) { Copy-Item $builderSrc -Destination $env:OUT_DIR -Force }

          # IMPORTANT: for SuperHybrid/RegionalHybrid we must name the source folder exactly
          # as the batch expects (no CN suffix), because the batch uses "%~dp0SuperHybrid Flasher".
          $workName = switch ($ftype) {
            'SuperHybrid Flasher'       { 'SuperHybrid Flasher' }
            'RegionalHybrid Flasher'    { 'RegionalHybrid Flasher' }
            'SuperHybrid SunOS Flasher' { 'SuperHybrid SunOS Flasher' }
            'Super Flasher'             { 'Super Flasher' }
            'Regional Flasher'          { 'Regional Flasher' }
          }
          $workDir = Join-Path $env:OUT_DIR $workName
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null

          # Choose template root (content depends on region/type)
          $tplBase = Join-Path $root ("flasher_scripts\" + $dev)
          if ($ftype -like '*Hybrid*') {
            $tplBase = Join-Path $tplBase ($(if ($region -eq 'CN') { 'cos' } else { 'oos' }))
            $tplBase = Join-Path $tplBase ($(if ($ftype -like '*Super*') { 'super' } else { 'regional' }))
          } elseif ($ftype -eq 'Super Flasher') {
            if ($dev -eq '13T' -and $region -eq 'CN') { $tplBase = Join-Path $tplBase 'cos\super' }
            else                                      { $tplBase = Join-Path $tplBase 'oos\super' }
          } elseif ($ftype -eq 'Regional Flasher') {
            if ($dev -eq '13R' -and $region -eq 'CN') { $tplBase = Join-Path $tplBase 'cos\regional' }
            else                                      { $tplBase = Join-Path $tplBase 'oos\regional' }
          }

          # Copy template into the EXACT folder name that the batch expects
          Copy-Item "$tplBase\*" -Destination $workDir -Recurse -Force

          # META-INF only for Hybrid builds
          if ($ftype -like '*Hybrid*') {
            $mi = Join-Path $tplBase 'META-INF'
            if (Test-Path $mi) { Copy-Item $mi -Destination (Join-Path $workDir 'META-INF') -Recurse -Force }
          }

          # Super builds: stage lpmake and bloat
          if ($ftype -match 'Super') {
            $superDir = Join-Path $workDir 'Super'
            New-Item -ItemType Directory -Force -Path $superDir | Out-Null
            Copy-Item (Join-Path $root 'lpmake\lpmake.exe') -Destination $superDir -Force
            Copy-Item (Join-Path $root 'lpmake\cygwin1.dll') -Destination $superDir -Force

            if ($dev -eq '13T') {
              $pdir = Join-Path $root 'super_packers\13T'
              Copy-Item (Join-Path $pdir ($(if ($region -eq 'CN') { 'super_cos.bat' } else { 'super_oos.bat' }))) -Destination $superDir -Force
            } else {
              $p = Join-Path $root ("super_packers\" + $dev + "\super_oos.bat")
              if (Test-Path $p) { Copy-Item $p -Destination $superDir -Force }
            }

            Copy-BloatFiles $bloatBase $region $superDir

            if ($region -eq 'CN') {
              $oosHere = Join-Path $workDir 'OOS_FILES_HERE'
              New-Item -ItemType Directory -Force -Path $oosHere | Out-Null
              if ($dev -eq '13R') { Copy-BloatFiles $bloatBase 'A5' $oosHere }
              else                { Copy-BloatFiles $bloatBase 'GLO' $oosHere }
            }
          }

          "WORK_DIR=$workDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      # 6) TRUE drag&drop: run builder with CWD = OTA_DIR, pass OTA path as %1
      - name: Run builder (Explorer-style drag & drop)
        shell: cmd
        working-directory: ${{ env.OTA_DIR }}
        run: |
          echo CWD is %CD%
          echo Calling builder: "%GITHUB_WORKSPACE%\%OUT_DIR%\%BUILDER_BAT%" "%OTA_PATH%"
          rem Feed a newline so 'pause' in the script doesn't hang CI
          (echo.| call "%GITHUB_WORKSPACE%\%OUT_DIR%\%BUILDER_BAT%" "%OTA_PATH%") || exit /b 1

      # 7) Package ONLY the folder produced next to the ZIP (e.g. "SuperHybrid Flasher")
      - name: Package final output (builder result)
        shell: pwsh
        run: |
          $otaDir = $env:OTA_DIR

          # Candidate folder names (prefer exact based on flasher_type)
          $byFtype = switch ($env:FTYPE) {
            'SuperHybrid Flasher'       { @('SuperHybrid Flasher') }
            'RegionalHybrid Flasher'    { @('RegionalHybrid Flasher') }
            'SuperHybrid SunOS Flasher' { @('SuperHybrid SunOS Flasher') }
            'Super Flasher'             { @('Super Flasher') }
            'Regional Flasher'          { @('Regional Flasher') }
            default { @() }
          }
          $fallback = @('SuperHybrid Flasher','RegionalHybrid Flasher','SuperHybrid SunOS Flasher','Super Flasher','Regional Flasher')

          $candidates = @() + $byFtype + $fallback | Select-Object -Unique
          $resultDir = $null
          foreach ($name in $candidates) {
            $p = Join-Path $otaDir $name
            if (Test-Path $p) { $resultDir = $p; break }
          }
          if (-not $resultDir) {
            throw "Could not find builder output folder next to OTA in '$otaDir'. Expected one of: $($candidates -join ', ')"
          }

          $outRoot   = $env:OUT_DIR
          $devName   = "${{ inputs.device }}".Replace(' ','')
          $ftypeName = "${{ inputs.flasher_type }}".Replace(' ','')
          $regionStr = "${{ inputs.region }}"
          $ts        = Get-Date -Format "yyyyMMdd-HHmmss"
          $artifact  = "$devName-$ftypeName-$regionStr-$ts".Replace(' ','')
          $zipPath   = Join-Path $outRoot "$artifact.zip"

          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$resultDir\*" -DestinationPath $zipPath -Force

          "ARTIFACT_NAME=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_FILE=$zipPath"       | Out-File -FilePath $env:GITHUB_ENV -Append

      # ========= Artifact upload / path computation =========
      - name: Upload artifact (single zip only)
        if: ${{ inputs.upload_to == 'Artifact Only' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Compute upload paths
        shell: pwsh
        run: |
          $device = "${{ inputs.device }}"
          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"

          $category = switch -Regex ($ftype) {
            '^(SuperHybrid Flasher|SuperHybrid SunOS Flasher|Super Flasher)$' { 'Super Flashers'; break }
            default { 'Regional Flashers' }
          }

          $needsRegion = ($device -ne 'Oneplus 13S' -and $device -ne 'Oneplus 13T')
          if ($needsRegion) {
            $regionFolder = switch ($region) {
              'CN'  { 'COS' }
              'GLO' { 'Global' }
              'EU'  { 'EU' }
              'IN'  { 'IN' }
              'NA'  { 'NA' }
              default { $region }
            }
            $rel = Join-Path (Join-Path $device $category) $regionFolder
          } else {
            $rel = Join-Path $device $category
          }

          $rel = ($rel -replace '\\','/')
          if (-not $rel.EndsWith('/')) { $rel += '/' }
          "REL_UPLOAD_DIR=$rel" | Out-File -FilePath $env:GITHUB_ENV -Append

          $ftpBase = "${{ secrets.DS_FTP_PATH }}".Trim('/')
          $ftpAbs  = ($ftpBase.Length -gt 0) ? "$ftpBase/$rel" : $rel
          "FTP_UPLOAD_DIR=$ftpAbs" | Out-File -FilePath $env:GITHUB_ENV -Append

          $sfBaseAbs = "${{ secrets.SF_PROJECT_PATH }}".Trim()
          if ([string]::IsNullOrWhiteSpace($sfBaseAbs) -or -not $sfBaseAbs.StartsWith('/')) {
            throw "SF_PROJECT_PATH must be an absolute path like /home/frs/project/oneplus13flashers"
          }
          $sfBaseAbs = ($sfBaseAbs -replace '\\','/').TrimEnd('/')
          "SF_UPLOAD_DIR=$sfBaseAbs/$rel" | Out-File -FilePath $env:GITHUB_ENV -Append

      # =========================
      # DS_FTP Upload (no mkdirs)
      # =========================
      - name: Upload to DS_FTP
        if: ${{ inputs.upload_to == 'DS_FTP' || inputs.upload_to == 'Both DS_FTP & Sourceforge' }}
        shell: pwsh
        env:
          DS_FTP_HOST: ${{ secrets.DS_FTP_HOST }}
          DS_FTP_USER: ${{ secrets.DS_FTP_USER }}
          DS_FTP_PASS: ${{ secrets.DS_FTP_PASS }}
        run: |
          if (-not $env:DS_FTP_HOST -or -not $env:DS_FTP_USER -or -not $env:DS_FTP_PASS) { throw "Missing DS_FTP secrets." }
          $ftpHost=$env:DS_FTP_HOST
          $cred=New-Object System.Net.NetworkCredential($env:DS_FTP_USER,$env:DS_FTP_PASS)

          $remoteDir  = "$env:FTP_UPLOAD_DIR".Trim('/')
          $fileName   = "$($env:ARTIFACT_NAME).zip"
          $zipPath    = $env:ZIP_FILE

          function New-FtpRequest([string]$uri,[string]$method){
            $r=[System.Net.FtpWebRequest]::Create($uri)
            $r.Credentials=$cred
            $r.Method=$method
            $r.UsePassive=$true
            $r.UseBinary=$true
            $r.KeepAlive=$false
            return $r
          }

          $encodedPath = ($remoteDir.Split('/') | Where-Object { $_ -ne '' } | ForEach-Object { [System.Uri]::EscapeDataString($_) }) -join '/'
          $dirUri = if ($encodedPath) { "ftp://$ftpHost/$encodedPath" } else { "ftp://$ftpHost/" }

          try {
            (New-FtpRequest $dirUri ([System.Net.WebRequestMethods+Ftp]::ListDirectory)).GetResponse().Close()
          } catch {
            $detail = $_.Exception.Response?.StatusDescription
            throw "Target folder missing: $dirUri ($detail)"
          }

          if (-not (Test-Path $zipPath)) { throw "ZIP not found: $zipPath" }
          $uploadUri = if ($encodedPath) { "ftp://$ftpHost/$encodedPath/$([System.Uri]::EscapeDataString($fileName))" } else { "ftp://$ftpHost/$([System.Uri]::EscapeDataString($fileName))" }

          $req = New-FtpRequest $uploadUri ([System.Net.WebRequestMethods+Ftp]::UploadFile)
          $bytes = [System.IO.File]::ReadAllBytes($zipPath)
          $req.ContentLength=$bytes.Length
          $stream = $req.GetRequestStream()
          $stream.Write($bytes,0,$bytes.Length)
          $stream.Close()
          ($resp=$req.GetResponse())
          Write-Host $resp.StatusDescription
          $resp.Close()

      # -------------------------------
      # SourceForge: setup SSH
      # -------------------------------
      - name: Setup SSH for SourceForge
        if: ${{ inputs.upload_to == 'Sourceforge' || inputs.upload_to == 'Both DS_FTP & Sourceforge' }}
        shell: pwsh
        env:
          SF_SSH_PRIVATE_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
        run: |
          if (-not $env:SF_SSH_PRIVATE_KEY) { throw "Missing SF_SSH_PRIVATE_KEY secret." }

          $sshDir  = Join-Path $env:USERPROFILE ".ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyPath = Join-Path $sshDir "id_ed25519"

          $key = ($env:SF_SSH_PRIVATE_KEY -replace "`r","").Trim() + "`n"
          $first = ($key -split "`n")[0]
          if ($first -notmatch "BEGIN OPENSSH PRIVATE KEY|BEGIN RSA PRIVATE KEY") {
            throw "SF_SSH_PRIVATE_KEY doesn't look like an OpenSSH private key (bad header)."
          }

          Set-Content -Path $keyPath -Value $key -Encoding ascii
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null

          $kh = Join-Path $sshDir "known_hosts"
          ssh-keyscan -t rsa frs.sourceforge.net | Out-File -FilePath $kh -Encoding ascii

          $cfgPath  = Join-Path $sshDir "config"
          @(
            "Host frs.sourceforge.net"
            "  UserKnownHostsFile $kh"
            "  IdentitiesOnly yes"
            "  IdentityFile $keyPath"
          ) | Set-Content -Path $cfgPath -Encoding ascii

      # ------------------------------------------------
      # SourceForge: upload
      # ------------------------------------------------
      - name: Upload to SourceForge (SCP)
        if: ${{ inputs.upload_to == 'Sourceforge' || inputs.upload_to == 'Both DS_FTP & Sourceforge' }}
        shell: pwsh
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        run: |
          if (-not $env:SF_USERNAME -or -not $env:SF_UPLOAD_DIR) {
            throw "Missing SourceForge config at runtime. Need SF_USERNAME and computed SF_UPLOAD_DIR."
          }

          $zip = $env:ZIP_FILE
          if (-not (Test-Path $zip)) { throw "ZIP file not found: $zip" }

          $destDir = ($env:SF_UPLOAD_DIR -replace '\\','/').TrimEnd('/')
          $dest    = "$destDir/$($env:ARTIFACT_NAME).zip"
          $key     = "$env:USERPROFILE\.ssh\id_ed25519"

          ssh -i "$key" -o StrictHostKeyChecking=yes "$($env:SF_USERNAME)@frs.sourceforge.net" `
            "test -d `"$destDir`" || { echo 'ERROR: Destination folder does not exist on SourceForge: ' `"$destDir`"; exit 66; }"

          Write-Host "Uploading to SourceForge: $dest"
          scp -i "$key" -o StrictHostKeyChecking=yes "$zip" "$($env:SF_USERNAME)@frs.sourceforge.net:`"$dest`""
