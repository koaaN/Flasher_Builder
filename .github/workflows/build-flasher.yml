name: Build Android Flasher from OTA

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: "Paste the FULL OTA.zip URL here (leave empty to dry-run with a placeholder)"
        type: string
        required: false
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - Super Flasher
          - Regional Flasher
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
      region:
        description: "Region (choose NONE only for 'SuperHybrid SunOS Flasher')"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
          - NONE
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - Artifact on GitHub

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build ${{ inputs.flasher_type }} • ${{ inputs.device }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: .  # No nesting issue

      - name: Prepare and validate input
        shell: pwsh
        run: |
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            "USE_PLACEHOLDER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "USE_PLACEHOLDER=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          if ("${{ inputs.flasher_type }}" -eq "SuperHybrid SunOS Flasher" -and "${{ inputs.region }}" -ne "NONE") {
            throw "Region must be NONE for SuperHybrid SunOS Flasher"
          }

      - name: Install tools
        shell: pwsh
        run: |
          choco install -y aria2 7zip
          New-Item -ItemType Directory -Force -Path "download", "$env:OUT_DIR" | Out-Null

      - name: Download or create placeholder OTA
        shell: pwsh
        run: |
          if ($env:USE_PLACEHOLDER -eq '1') {
            Set-Content -Path "download\PLACEHOLDER.txt" -Value "Placeholder OTA"
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\ota-placeholder.zip" -Force
            "OTAFILE=$PWD\download\ota-placeholder.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            $url = "${{ inputs.ota_url }}"
            $file = "download\OTA.zip"
            aria2c -x16 -s16 -k1M -o "OTA.zip" -d "download" "$url"
            "OTAFILE=$PWD\$file" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Set OTA metadata
        shell: pwsh
        run: |
          $deviceDisp = "${{ inputs.device }}"
          $ftypeDisp = "${{ inputs.flasher_type }}"
          $regionDisp = "${{ inputs.region }}"
          $device = $deviceDisp -replace ' ', ''
          $ftype = $ftypeDisp -replace ' ', ''
          $region = if ($regionDisp -eq 'NONE') { '' } else { $regionDisp }
          $date = Get-Date -Format "yyyyMMdd"
          $version = "$date-$device-$ftype"

          $folderName = if ($region) { "$device-$ftype-$region-$version" } else { "$device-$ftype-$version" }

          "DEVICE_DISPLAY=$deviceDisp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE_DISPLAY=$ftypeDisp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION=$regionDisp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FOLDER_NAME=$folderName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage flasher output
        shell: pwsh
        run: |
          $output = Join-Path $env:OUT_DIR $env:FOLDER_NAME
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          Copy-Item $env:OTAFILE -Destination "$output\OTA.zip"
          $note = if ($env:USE_PLACEHOLDER -eq '1') { "`nNOTE: Placeholder OTA." } else { "" }

          "Device: $env:DEVICE_DISPLAY`nType: $env:FTYPE_DISPLAY`nRegion: $env:REGION$note" |
            Out-File -FilePath "$output\README.txt" -Encoding utf8

          # --- Special case: Oneplus 13 + SuperHybrid Flasher + GLO ---
          if ($env:DEVICE_DISPLAY -eq 'Oneplus 13' -and $env:FTYPE_DISPLAY -eq 'SuperHybrid Flasher' -and $env:REGION -eq 'GLO') {
            $superFs = "flasher_scripts\13\oos\super"
            $superPk = "super_packers\13"
            $lpmake  = "lpmake"

            $destMain  = Join-Path $output 'Super Hybrid Flasher'
            $destSuper = Join-Path $destMain 'Super'
            New-Item -ItemType Directory -Force -Path $destMain, $destSuper | Out-Null

            Copy-Item "$superFs\META-INF" -Destination $destMain -Recurse -Force
            Copy-Item "$superFs\dtbo_patcher.bat", "$superFs\Super_Flasher.bat" -Destination $destMain -Force
            Copy-Item "$superPk\super_oos.bat" -Destination $destSuper -Force
            Copy-Item "$lpmake\cygwin1.dll", "$lpmake\lpmake.exe" -Destination $destSuper -Force

            Write-Host "Staged special content for Oneplus 13 + SuperHybrid Flasher + GLO"
          }

      - name: Upload output folder as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FOLDER_NAME }}
          path: ${{ env.OUT_DIR }}/${{ env.FOLDER_NAME }}
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
