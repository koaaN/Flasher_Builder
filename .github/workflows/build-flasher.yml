name: Build Flasher (with correct bloat file handling)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
          - Super Flasher
          - Regional Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prep OTA (download or placeholder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "download","$env:OUT_DIR" | Out-Null
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            Set-Content -Path "download\PLACEHOLDER.txt" -Value "Placeholder OTA for dry-run"
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\OTA.zip" -Force
          } else {
            $name = Split-Path $url -Leaf
            if ([string]::IsNullOrWhiteSpace($name)) { $name = "OTA.zip" }
            $dst = "download\$name"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            if ($name -ne "OTA.zip") {
              if (Test-Path "download\OTA.zip") { Remove-Item "download\OTA.zip" -Force }
              Rename-Item -Path $dst -NewName "OTA.zip"
            }
          }
          "OTA_PATH=$(Resolve-Path 'download\OTA.zip')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage working dir (layout only, no build run)
        shell: pwsh
        run: |
          function Copy-BloatFiles {
            param(
              [string]$base,        # e.g. bloat\13 or bloat\13R
              [string]$regionCode,  # 'EU','GLO','IN','NA','CN','A5'
              [string]$dest         # destination folder
            )

            $map = @{
              'EU'  = 'EUGLO_BLOAT'
              'GLO' = 'EUGLO_BLOAT'
              'IN'  = 'IN_BLOAT'
              'NA'  = 'NA_BLOAT'
              'CN'  = 'CN_BLOAT'
              'A5'  = 'A5_DEBLOAT'
            }

            if (-not $map.ContainsKey($regionCode)) {
              Write-Warning "Unknown bloat region code: $regionCode"
              return
            }

            $srcDir = Join-Path $base $map[$regionCode]
            if (!(Test-Path $srcDir)) {
              Write-Warning "Bloat folder missing: $srcDir"
              return
            }

            $files = @('my_preload.img','my_company.img')
            foreach ($f in $files) {
              $srcFile = Join-Path $srcDir $f
              if (Test-Path $srcFile) {
                Copy-Item $srcFile -Destination $dest -Force
              } else {
                Write-Warning "Missing $f in $srcDir"
              }
            }
          }

          $devDisp = "${{ inputs.device }}"
          $ftype   = "${{ inputs.flasher_type }}"
          $region  = "${{ inputs.region }}"

          # Device → short code
          $dev = switch ($devDisp) {
            'Oneplus 13'  { '13' }
            'Oneplus 13R' { '13R' }
            'Oneplus 13S' { '13S' }
            'Oneplus 13T' { '13T' }
            default { throw "Unknown device: $devDisp" }
          }

          # Base paths
          $builderDir = Join-Path $env:GITHUB_WORKSPACE ("build_scripts\" + $dev)
          $otaripper  = Join-Path $env:GITHUB_WORKSPACE "otaripper\otaripper.exe"
          $ptSrc      = Join-Path $env:GITHUB_WORKSPACE "platform-tools"
          $lpmakeExe  = Join-Path $env:GITHUB_WORKSPACE "lpmake\lpmake.exe"
          $cygwinDll  = Join-Path $env:GITHUB_WORKSPACE "lpmake\cygwin1.dll"
          $superPacks = Join-Path $env:GITHUB_WORKSPACE ("super_packers\" + $dev)
          $bloatBase  = Join-Path $env:GITHUB_WORKSPACE ("bloat\" + $dev)

          New-Item -ItemType Directory -Force -Path $env:OUT_DIR | Out-Null
          $workRoot = $env:OUT_DIR

          # Device-specific rules
          if ($dev -eq '13') {
            if ($region -eq 'CN') {
              if ($ftype -eq 'SuperHybrid Flasher') {
                $flasherDir = Join-Path $workRoot "SuperHybrid Flasher CN"
                Copy-Item (Join-Path $env:GITHUB_WORKSPACE "flasher_scripts\13\cos\super\*") $flasherDir -Recurse -Force
                Copy-Item $otaripper $flasherDir -Force
                Copy-Item $ptSrc $flasherDir -Recurse -Force
                $superDir = Join-Path $flasherDir "Super"
                New-Item -ItemType Directory -Force -Path $superDir | Out-Null
                Copy-Item $lpmakeExe $superDir -Force
                Copy-Item $cygwinDll $superDir -Force
                Copy-Item (Join-Path $superPacks "super_cos.bat") $superDir -Force
                Copy-BloatFiles -base $bloatBase -regionCode 'CN' -dest $superDir
                $oosDir = Join-Path $flasherDir "OOS_FILES_HERE"
                New-Item -ItemType Directory -Force -Path $oosDir | Out-Null
                Copy-BloatFiles -base $bloatBase -regionCode 'EU' -dest $oosDir
                Copy-Item (Join-Path $builderDir "SUPERHYBRID_CN_FULL_SUPERBUILD.bat") $workRoot -Force
              }
              elseif ($ftype -eq 'RegionalHybrid Flasher') {
                $flasherDir = Join-Path $workRoot "RegionalHybrid Flasher CN"
                Copy-Item (Join-Path $env:GITHUB_WORKSPACE "flasher_scripts\13\cos\regional\*") $flasherDir -Recurse -Force
                Copy-Item $otaripper $flasherDir -Force
                Copy-Item $ptSrc $flasherDir -Recurse -Force
                $cosDir = Join-Path $flasherDir "COS_FILES_HERE"
                New-Item -ItemType Directory -Force -Path $cosDir | Out-Null
                Copy-BloatFiles -base $bloatBase -regionCode 'CN' -dest $cosDir
                $oosDir = Join-Path $flasherDir "OOS_FILES_HERE"
                New-Item -ItemType Directory -Force -Path $oosDir | Out-Null
                Copy-BloatFiles -base $bloatBase -regionCode 'EU' -dest $oosDir
                Copy-Item (Join-Path $builderDir "REGIONALHYBRID_CN_FULL_BUILD.bat") $workRoot -Force
              }
            }
            # TODO: handle normal (EU/GLO/IN/NA) SuperHybrid + RegionalHybrid + SunOS here
          }

          # Similar blocks would handle 13R CN (with A5_DEBLOAT), 13R global, etc.

      - name: Zip working dir
        shell: pwsh
        run: |
          $artifact = "LayoutOnly-${{ inputs.device }}-${{ inputs.flasher_type }}-${{ inputs.region }}-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          $zip = "$artifact.zip"
          Compress-Archive -Path "$env:OUT_DIR\*" -DestinationPath $zip -Force
          "ARTIFACT_NAME=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_FILE=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
