name: Build Flasher (layout-only; correct META-INF + otaripper + bloat)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
          - Super Flasher          # 13R
          - Regional Flasher       # 13R
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Stage Layout • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prep OTA (download or placeholder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "download","$env:OUT_DIR" | Out-Null
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            Set-Content -Path "download\PLACEHOLDER.txt" -Value "Placeholder OTA for dry-run"
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\OTA.zip" -Force
          } else {
            $name = Split-Path $url -Leaf
            if ([string]::IsNullOrWhiteSpace($name)) { $name = "OTA.zip" }
            $dst = "download\$name"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            if ($name -ne "OTA.zip") {
              if (Test-Path "download\OTA.zip") { Remove-Item "download\OTA.zip" -Force }
              Rename-Item -Path $dst -NewName "OTA.zip"
            }
          }
          "OTA_PATH=$(Resolve-Path 'download\OTA.zip')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage working dir (layout only, no build run)
        shell: pwsh
        run: |
          function Copy-BloatFiles {
            param(
              [string]$base,
              [string]$regionCode,
              [string]$dest
            )

            $map = @{
              'EU'  = 'EUGLO_BLOAT'
              'GLO' = 'EUGLO_BLOAT'
              'IN'  = 'IN_BLOAT'
              'NA'  = 'NA_BLOAT'
              'CN'  = 'CN_BLOAT'
              'A5'  = 'A5_DEBLOAT'
            }

            if (-not $map.ContainsKey($regionCode)) { return }
            $srcDir = Join-Path $base $map[$regionCode]
            if (!(Test-Path $srcDir)) { return }

            $files = @('my_preload.img','my_company.img')
            foreach ($f in $files) {
              $srcFile = Join-Path $srcDir $f
              if (Test-Path $srcFile) {
                Copy-Item $srcFile -Destination $dest -Force
              }
            }
          }

          function Copy-Template {
            param(
              [string]$templateDir,
              [string]$destDir
            )
            if (!(Test-Path $templateDir)) { throw "Template not found: $templateDir" }
            Copy-Item (Join-Path $templateDir '*') -Destination $destDir -Recurse -Force
            if (Test-Path (Join-Path $templateDir 'META-INF')) {
              Copy-Item (Join-Path $templateDir 'META-INF') -Destination (Join-Path $destDir 'META-INF') -Recurse -Force
            }
          }

          $devDisp = "${{ inputs.device }}"
          $ftype   = "${{ inputs.flasher_type }}"
          $region  = "${{ inputs.region }}"

          $dev = switch ($devDisp) {
            'Oneplus 13'  { '13' }
            'Oneplus 13R' { '13R' }
            'Oneplus 13S' { '13S' }
            'Oneplus 13T' { '13T' }
            default { throw "Unknown device: $devDisp" }
          }

          $root       = $env:GITHUB_WORKSPACE
          $builderDir = Join-Path $root ("build_scripts\" + $dev)
          $otaripper  = Join-Path $root "otaripper\otaripper.exe"
          $ptSrc      = Join-Path $root "platform-tools"
          $lpmakeExe  = Join-Path $root "lpmake\lpmake.exe"
          $cygwinDll  = Join-Path $root "lpmake\cygwin1.dll"
          $superPacks = Join-Path $root ("super_packers\" + $dev)
          $bloatBase  = Join-Path $root ("bloat\" + $dev)

          $tplOOSSuper    = Join-Path $root ("flasher_scripts\" + $dev + "\oos\super")
          $tplOOSRegional = Join-Path $root ("flasher_scripts\" + $dev + "\oos\regional")
          $tplCOSSuper    = Join-Path $root ("flasher_scripts\" + $dev + "\cos\super")
          $tplCOSRegional = Join-Path $root ("flasher_scripts\" + $dev + "\cos\regional")

          if (Test-Path $env:OUT_DIR) { Remove-Item $env:OUT_DIR -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $env:OUT_DIR | Out-Null
          $workRoot = $env:OUT_DIR

          # Put otaripper next to builders (outside flasher folders)
          if (Test-Path $otaripper) { Copy-Item $otaripper $workRoot -Force }

          # --- Flasher type branching ---
          if ($ftype -in @('SuperHybrid Flasher','SuperHybrid SunOS Flasher','Super Flasher')) {
            if ($dev -eq '13R' -and $region -eq 'CN') {
              $flasherFolderName = 'Super Flasher CN'
              $templateDir = $tplCOSSuper
              $packerName = 'super_cos.bat'
            } elseif ($dev -eq '13' -and $region -eq 'CN') {
              $flasherFolderName = 'SuperHybrid Flasher CN'
              $templateDir = $tplCOSSuper
              $packerName = 'super_cos.bat'
            } else {
              $flasherFolderName = if ($ftype -eq 'Super Flasher') { 'Super Flasher' } else { 'SuperHybrid Flasher' }
              $templateDir = $tplOOSSuper
              $packerName = 'super_oos.bat'
            }

            $destDir = Join-Path $workRoot $flasherFolderName
            Copy-Template $templateDir $destDir
            if (Test-Path $ptSrc) { Copy-Item $ptSrc -Destination $destDir -Recurse -Force }

            $superDir = Join-Path $destDir 'Super'
            New-Item -ItemType Directory -Force -Path $superDir | Out-Null
            Copy-Item $lpmakeExe $superDir -Force
            Copy-Item $cygwinDll $superDir -Force
            Copy-Item (Join-Path $superPacks $packerName) $superDir -Force

            if ($region -eq 'CN') {
              Copy-BloatFiles $bloatBase 'CN' $superDir
              $oosHere = Join-Path $destDir 'OOS_FILES_HERE'
              New-Item -ItemType Directory -Force -Path $oosHere | Out-Null
              if ($dev -eq '13R') {
                Copy-BloatFiles $bloatBase 'A5' $oosHere
              } else {
                Copy-BloatFiles $bloatBase 'EUGLO' $oosHere
              }
            } else {
              Copy-BloatFiles $bloatBase $region $superDir
            }

          } elseif ($ftype -in @('RegionalHybrid Flasher','Regional Flasher')) {
            if ($dev -eq '13R' -and $region -eq 'CN') {
              $flasherFolderName = 'Regional Flasher CN'
              $templateDir = $tplCOSRegional
            } elseif ($dev -eq '13' -and $region -eq 'CN') {
              $flasherFolderName = 'RegionalHybrid Flasher CN'
              $templateDir = $tplCOSRegional
            } else {
              $flasherFolderName = if ($ftype -eq 'Regional Flasher') { 'Regional Flasher' } else { 'RegionalHybrid Flasher' }
              $templateDir = $tplOOSRegional
            }

            $destDir = Join-Path $workRoot $flasherFolderName
            Copy-Template $templateDir $destDir
            if (Test-Path $ptSrc) { Copy-Item $ptSrc -Destination $destDir -Recurse -Force }

            $oosHere = Join-Path $destDir 'OOS_FILES_HERE'
            New-Item -ItemType Directory -Force -Path $oosHere | Out-Null
            if ($region -eq 'CN') {
              if ($dev -eq '13R') {
                Copy-BloatFiles $bloatBase 'A5' $oosHere
              } else {
                Copy-BloatFiles $bloatBase 'EUGLO' $oosHere
              }
              $cosHere = Join-Path $destDir 'COS_FILES_HERE'
              New-Item -ItemType Directory -Force -Path $cosHere | Out-Null
              Copy-BloatFiles $bloatBase 'CN' $cosHere
            } else {
              Copy-BloatFiles $bloatBase $region $oosHere
            }
          }

      - name: Zip staged flasher
        shell: pwsh
        run: |
          $devName   = "${{ inputs.device }}".Replace(' ','')
          $ftypeName = "${{ inputs.flasher_type }}".Replace(' ','')
          $region    = "${{ inputs.region }}"
          $ts        = Get-Date -Format "yyyyMMdd-HHmmss"
          $artifact  = "$devName-$ftypeName-$region-$ts"
          "ARTIFACT_NAME=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append

          $zip = "$artifact.zip"
          Compress-Archive -Path "$env:OUT_DIR\*" -DestinationPath $zip -Force
          "ZIP_FILE=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
