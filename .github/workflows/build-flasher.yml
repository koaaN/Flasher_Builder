name: Build Flasher (layout-only, no build)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Stage Layout • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prep OTA (download or placeholder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "download","$env:OUT_DIR" | Out-Null
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            Set-Content -Path "download\PLACEHOLDER.txt" -Value "Placeholder OTA for dry-run"
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\OTA.zip" -Force
          } else {
            $name = Split-Path $url -Leaf
            if ([string]::IsNullOrWhiteSpace($name)) { $name = "OTA.zip" }
            $dst = "download\$name"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            if ($name -ne "OTA.zip") {
              if (Test-Path "download\OTA.zip") { Remove-Item "download\OTA.zip" -Force }
              Rename-Item -Path $dst -NewName "OTA.zip"
            }
          }
          "OTA_PATH=$(Resolve-Path 'download\OTA.zip')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Map device and repo paths
        shell: pwsh
        run: |
          $devDisp = "${{ inputs.device }}"
          $dev = switch ($devDisp) {
            'Oneplus 13'  { '13'  }
            'Oneplus 13R' { '13R' }
            'Oneplus 13S' { '13S' }
            'Oneplus 13T' { '13T' }
            default { throw "Unknown device: $devDisp" }
          }

          $root = $env:GITHUB_WORKSPACE

          $flasherSrc   = Join-Path $root ("flasher_scripts\" + $dev + "\oos\super")
          $superPackers = Join-Path $root ("super_packers\" + $dev)
          $buildScripts = Join-Path $root ("build_scripts\" + $dev)
          $lpmakeDir    = Join-Path $root "lpmake"
          $platTools    = Join-Path $root "platform-tools"
          $otaripper    = Join-Path $root "otaripper\otaripper.exe"
          $bloatEuGlo   = Join-Path $root ("bloat\" + $dev + "\EUGLO_BLOAT")

          if (!(Test-Path $flasherSrc))   { throw "Missing flasher source: $flasherSrc" }
          if (!(Test-Path $superPackers)) { throw "Missing super_packers: $superPackers" }
          if (!(Test-Path $buildScripts)) { throw "Missing build_scripts: $buildScripts" }

          "DEV_FOLDER=$dev"             | Out-File -FilePath $env:GITHUB_ENV -Append
          "FLASHER_SRC=$flasherSrc"     | Out-File -FilePath $env:GITHUB_ENV -Append
          "SUPER_PACKERS=$superPackers" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILD_SCRIPTS=$buildScripts" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LPMAKE_DIR=$lpmakeDir"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "PLATFORM_TOOLS=$platTools"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTARIPPER_EXE=$otaripper"    | Out-File -FilePath $env:GITHUB_ENV -Append
          "BLOAT_EUGLO=$bloatEuGlo"     | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage working dir + SuperHybrid Flasher contents (no build)
        shell: pwsh
        run: |
          # Create parent working dir
          $workDir = Join-Path $env:OUT_DIR "work"
          if (Test-Path $workDir) { Remove-Item $workDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null

          # Create "SuperHybrid Flasher" folder inside working dir
          $flasherDir = Join-Path $workDir "SuperHybrid Flasher"
          New-Item -ItemType Directory -Force -Path $flasherDir | Out-Null

          # Copy ALL from flasher_scripts/<dev>/oos/super/* (includes 16DTBO, META-INF, Super_Flasher.bat, dtbo_patcher.bat)
          Copy-Item (Join-Path $env:FLASHER_SRC '*') -Destination $flasherDir -Recurse -Force

          # Copy platform-tools into "SuperHybrid Flasher" if present
          if (Test-Path $env:PLATFORM_TOOLS) {
            Copy-Item $env:PLATFORM_TOOLS -Destination $flasherDir -Recurse -Force
          }

          # Create "Super" subfolder and place lpmake.exe + cygwin1.dll there
          $superSub = Join-Path $flasherDir "Super"
          New-Item -ItemType Directory -Force -Path $superSub | Out-Null

          function Copy-Lpmake-Bits {
            param([string]$base)
            $lm = Get-ChildItem -Path $base -Recurse -Filter "lpmake.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            $cy = Get-ChildItem -Path $base -Recurse -Filter "cygwin1.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($lm) { Copy-Item $lm.FullName -Destination $superSub -Force }
            if ($cy) { Copy-Item $cy.FullName -Destination $superSub -Force }
          }

          if (Test-Path $env:LPMAKE_DIR) { Copy-Lpmake-Bits -base $env:LPMAKE_DIR }
          if (!(Test-Path (Join-Path $superSub "lpmake.exe"))) {
            # Fallback: search whole repo
            Copy-Lpmake-Bits -base $env:GITHUB_WORKSPACE
          }

          if (!(Test-Path (Join-Path $superSub "lpmake.exe"))) { throw "lpmake.exe not found anywhere in repo" }
          if (!(Test-Path (Join-Path $superSub "cygwin1.dll"))) { throw "cygwin1.dll not found anywhere in repo" }

          # Copy super_oos.bat into Super/
          $superOos = Join-Path $env:SUPER_PACKERS "super_oos.bat"
          if (!(Test-Path $superOos)) { throw "Missing super_oos.bat at $superOos" }
          Copy-Item $superOos -Destination $superSub -Force

          # Region bloat for GLO/EU → copy into Super/
          $region = "${{ inputs.region }}"
          if ($region -eq "GLO" -or $region -eq "EU") {
            if (!(Test-Path $env:BLOAT_EUGLO)) { throw "Missing EUGLO_BLOAT dir: $env:BLOAT_EUGLO" }
            $preload = Join-Path $env:BLOAT_EUGLO "my_preload.img"
            $company = Join-Path $env:BLOAT_EUGLO "my_company.img"
            if (!(Test-Path $preload)) { throw "Missing file: $preload" }
            if (!(Test-Path $company)) { throw "Missing file: $company" }
            Copy-Item $preload -Destination $superSub -Force
            Copy-Item $company -Destination $superSub -Force
          }

          # Place the builder BAT OUTSIDE the "SuperHybrid Flasher" folder (into parent work dir)
          $builder = Join-Path $env:BUILD_SCRIPTS "SUPERHYBRID_FULL_SUPERBUILD.bat"
          if (!(Test-Path $builder)) { throw "Missing builder BAT: $builder" }
          Copy-Item $builder -Destination $workDir -Force

          # Also place otaripper.exe next to the builder (outside flasher folder)
          if (Test-Path $env:OTARIPPER_EXE) {
            Copy-Item $env:OTARIPPER_EXE -Destination $workDir -Force
          } else {
            Write-Host "otaripper.exe not found (optional)."
          }

          "WORK_DIR=$workDir"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "FLASHER_DIR=$flasherDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Intentionally skip running any builder .bat — layout-only run

      - name: Zip working directory (includes SuperHybrid Flasher + outer files)
        shell: pwsh
        run: |
          $workDir = $env:WORK_DIR
          if (!(Test-Path $workDir)) { throw "Working dir not found: $workDir" }
          Write-Host "Contents of working dir:"
          Get-ChildItem -LiteralPath $workDir -Recurse | ForEach-Object { $_.FullName }

          $devName   = "${{ inputs.device }}".Replace(' ','')
          $ftypeName = "${{ inputs.flasher_type }}".Replace(' ','')
          $region    = "${{ inputs.region }}"
          $ts        = Get-Date -Format "yyyyMMdd-HHmmss"
          $artifact  = "$devName-$ftypeName-$region-LAYOUT-$ts"
          "ARTIFACT_NAME=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append

          $zip = "$artifact.zip"
          Compress-Archive -Path "$workDir\*" -DestinationPath $zip -Force
          "ZIP_FILE=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
