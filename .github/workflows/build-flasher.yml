name: Build Android Flasher from OTA

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: "Paste the FULL OTA.zip URL here (leave empty to dry-run with a placeholder)"
        type: string
        required: false
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - Super Flasher
          - Regional Flasher
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
      region:
        description: "Region (choose NONE only for 'SuperHybrid SunOS Flasher')"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
          - NONE
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - Sourceforge
          - Daniels Server
          - Both Sourceforge & Daniels Server
          - Artifact on GitHub

permissions:
  contents: read

concurrency:
  group: flasher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build ${{ inputs.flasher_type }} • ${{ inputs.device }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Validate inputs
        shell: pwsh
        run: |
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            "USE_PLACEHOLDER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            if ($url -notmatch '^https?://') { throw "OTA URL must start with http(s)://"; }
            "USE_PLACEHOLDER=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          $ftype = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"
          if ($ftype -eq 'SuperHybrid SunOS Flasher' -and $region -ne 'NONE') {
            throw "For 'SuperHybrid SunOS Flasher' you must set Region to 'NONE'."
          }
          if ($ftype -ne 'SuperHybrid SunOS Flasher' -and $region -eq 'NONE') {
            throw "Region 'NONE' is only valid with 'SuperHybrid SunOS Flasher'."
          }

      - name: Install tools
        shell: pwsh
        run: |
          choco install -y aria2 7zip
          New-Item -ItemType Directory -Path "download" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:OUT_DIR" -Force | Out-Null

      - name: Download or create OTA.zip
        shell: pwsh
        run: |
          if ($env:USE_PLACEHOLDER -eq '1') {
            Set-Content -Path "download\PLACEHOLDER.txt" -Encoding ascii -Value "This is a placeholder OTA payload."
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\ota-placeholder.zip" -Force
            $zipPath = "download\ota-placeholder.zip"
          } else {
            $url = "${{ inputs.ota_url }}"
            $fileName = Split-Path $url -Leaf
            $zipPath = "download\$fileName"
            aria2c -x16 -s16 -k1M --console-log-level=warn -o "$fileName" -d "download" "$url"
          }

          "DOWNLOADED_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Extract metadata
        shell: pwsh
        run: |
          $device = "${{ inputs.device }}"
          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"
          $file = Get-Item $env:DOWNLOADED_ZIP
          $ver = [System.IO.Path]::GetFileNameWithoutExtension($file.Name)
          if (-not $ver) { $ver = "build-" + (Get-Date -Format "yyyyMMddHHmm") }

          $regionName = if ($region -eq 'NONE') { '' } else { $region }

          "DEVICE=$($device.Replace(' ',''))"            | Out-File -FilePath $env:GITHUB_ENV -Append
          "DEVICE_DISPLAY=$device"                       | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE=$($ftype.Replace(' ',''))"              | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE_DISPLAY=$ftype"                         | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION=$region"                               | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION_FOR_NAME=$regionName"                  | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$ver"                                 | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTAFILE=$($file.FullName)"                    | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage flasher files
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\src"
          $outBaseName = if ($env:REGION_FOR_NAME) { "$env:DEVICE-$env:FTYPE-$env:REGION_FOR_NAME-$env:VERSION" } else { "$env:DEVICE-$env:FTYPE-$env:VERSION" }
          "ARTIFACT_NAME=$outBaseName" | Out-File -FilePath $env:GITHUB_ENV -Append
          $outBase = Join-Path $env:OUT_DIR $outBaseName
          New-Item -ItemType Directory -Path $outBase -Force | Out-Null
          Copy-Item $env:OTAFILE -Destination "$outBase\OTA.zip"

          "Device: $env:DEVICE_DISPLAY`nType: $env:FTYPE_DISPLAY`nRegion: $env:REGION`nVersion: $env:VERSION" |
            Out-File -FilePath "$outBase\README.txt" -Encoding utf8

          if ($env:DEVICE_DISPLAY -eq 'Oneplus 13' -and $env:FTYPE_DISPLAY -eq 'SuperHybrid Flasher' -and $env:REGION -eq 'GLO') {
            $srcFs = Join-Path $root 'flasher_scripts\13\oos\super'
            $srcPk = Join-Path $root 'super_packers\13'
            $srcLp = Join-Path $root 'lpmake'

            $destHybrid = Join-Path $outBase 'Super Hybrid Flasher'
            $destSuper  = Join-Path $destHybrid 'Super'
            New-Item -ItemType Directory -Path $destHybrid -Force | Out-Null
            New-Item -ItemType Directory -Path $destSuper  -Force | Out-Null

            Copy-Item -Path "$srcFs\META-INF" -Destination $destHybrid -Recurse -Force
            Copy-Item -Path "$srcFs\dtbo_patcher.bat", "$srcFs\Super.Flasher.bat" -Destination $destHybrid -Force
            Copy-Item -Path "$srcPk\super_oos.bat" -Destination $destSuper -Force
            Copy-Item -Path "$srcLp\cygwin1.dll", "$srcLp\lpmake.exe" -Destination $destSuper -Force
          }

          7z a -tzip "$outBaseName.zip" "$outBase\*" | Out-Null
          "ZIP_NAME=$outBaseName.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            *.zip
            out/**/*.txt
          if-no-files-found: error
          retention-days: ${{ env:ARTIFACT_RETENTION_DAYS }}
