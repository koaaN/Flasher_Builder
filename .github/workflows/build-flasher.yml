# .github/workflows/build-flasher.yml
name: Build Android Flasher from OTA

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: "Paste the FULL OTA.zip URL here (leave empty to dry-run with a placeholder)"
        type: string
        required: false
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - Super Flasher
          - Regional Flasher
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
      region:
        description: "Region (choose NONE only for 'SuperHybrid SunOS Flasher')"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
          - NONE
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - Sourceforge
          - Daniels Server
          - Both Sourceforge & Daniels Server
          - Artifact on GitHub

permissions:
  contents: read

concurrency:
  group: flasher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build ${{ inputs.flasher_type }} • ${{ inputs.device }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs (and decide placeholder mode)
        shell: pwsh
        run: |
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            "USE_PLACEHOLDER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "No OTA URL provided -> using placeholder ZIP."
          } else {
            if ($url -notmatch '^https?://') { throw "OTA URL must start with http(s)://"; }
            if ($url -notmatch '\.zip(\?|$)') { Write-Warning "URL does not end with .zip — continuing anyway."; }
            "USE_PLACEHOLDER=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"
          if ($ftype -eq 'SuperHybrid SunOS Flasher' -and $region -ne 'NONE') {
            throw "For 'SuperHybrid SunOS Flasher' you must set Region to 'NONE'."
          }
          if ($ftype -ne 'SuperHybrid SunOS Flasher' -and $region -eq 'NONE') {
            throw "Region 'NONE' is only valid with 'SuperHybrid SunOS Flasher'."
          }

      - name: Prepare tools
        shell: pwsh
        run: |
          choco install -y aria2 7zip
          New-Item -ItemType Directory -Path "$env:OUT_DIR" -Force | Out-Null
          New-Item -ItemType Directory -Path "download" -Force | Out-Null

      - name: Get OTA.zip (download or create placeholder)
        shell: pwsh
        run: |
          if ($env:USE_PLACEHOLDER -eq '1') {
            $tmp = "download\PLACEHOLDER.txt"
            Set-Content -Path $tmp -Encoding ascii -Value "This is a placeholder OTA payload used for dry-runs."
            $dst = "download\ota-placeholder.zip"
            if (Test-Path $dst) { Remove-Item $dst -Force }
            Compress-Archive -Path $tmp -DestinationPath $dst -Force
            $fileName = Split-Path $dst -Leaf
          } else {
            $url = "${{ inputs.ota_url }}"
            $fileName = Split-Path $url -Leaf
            if ([string]::IsNullOrWhiteSpace($fileName)) { $fileName = "ota.zip" }
            $dst = "download\$fileName"
            aria2c -x16 -s16 -k1M --console-log-level=warn --allow-overwrite=true -o "$fileName" -d "download" "$url"
            if (!(Test-Path $dst)) { throw "Failed to download OTA." }
          }
          $sha = (Get-FileHash -Path $dst -Algorithm SHA256).Hash
          $sha | Out-File -FilePath "download\${fileName}.sha256.txt" -Encoding ascii
          "DOWNLOADED_ZIP=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Derive version & metadata
        shell: pwsh
        run: |
          $deviceIn = "${{ inputs.device }}"
          $ftypeIn  = "${{ inputs.flasher_type }}"
          $regionIn = "${{ inputs.region }}"
          $file   = Get-Item -Path $env:DOWNLOADED_ZIP
          $base   = [System.IO.Path]::GetFileNameWithoutExtension($file.Name)
          $ver    = $base -replace '[^0-9A-Za-z._-]',''
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver.Length -lt 4) {
            $short = ((Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash).Substring(0,8)
            $ver = (Get-Date -Format "yyyyMMdd") + "-${short}"
          }

          $deviceNorm = $deviceIn.Replace(' ','')
          $ftypeNorm  = $ftypeIn.Replace(' ','')
          $regionNorm = if ($regionIn -eq 'NONE') { '' } else { $regionIn }

          "DEVICE=$deviceNorm"            | Out-File -FilePath $env:GITHUB_ENV -Append
          "DEVICE_DISPLAY=$deviceIn"      | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE=$ftypeNorm"              | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE_DISPLAY=$ftypeIn"        | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION=$regionIn"              | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION_FOR_NAME=$regionNorm"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$ver"                  | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTAFILE=$($file.FullName)"     | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build flasher (staging + Oneplus 13 SuperHybrid extras)
        shell: pwsh
        run: |
          $deviceDisp  = $env:DEVICE_DISPLAY
          $ftypeDisp   = $env:FTYPE_DISPLAY
          $regionDisp  = $env:REGION
          $deviceName  = $env:DEVICE
          $ftypeName   = $env:FTYPE
          $regionName  = $env:REGION_FOR_NAME
          $version     = $env:VERSION

          $outBaseName = if ($regionName) { "$deviceName-$ftypeName-$regionName-$version" } else { "$deviceName-$ftypeName-$version" }
          "ARTIFACT_NAME=$outBaseName" | Out-File -FilePath $env:GITHUB_ENV -Append
          $outBase = Join-Path "$env:OUT_DIR" $outBaseName
          New-Item -ItemType Directory -Path $outBase -Force | Out-Null

          Copy-Item $env:OTAFILE -Destination (Join-Path $outBase "OTA.zip")
          $placeholderNote = if ($env:USE_PLACEHOLDER -eq '1') { "`nNOTE: Placeholder OTA used for this run." } else { "" }
          "Device: $deviceDisp`nType: $ftypeDisp`nRegion: $regionDisp`nVersion: $version$placeholderNote" |
            Out-File -FilePath (Join-Path $outBase "README.txt") -Encoding utf8

          $root = $env:GITHUB_WORKSPACE
          function Find-Dir([string]$pattern) {
            Get-ChildItem -Path $root -Directory -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like $pattern } |
              Select-Object -First 1 | ForEach-Object { $_.FullName }
          }
          $baseSuperFs = Find-Dir("*\flasher_scripts\13\oos\super")
          $basePack13  = Find-Dir("*\super_packers\13")
          $baseLpmake  = Find-Dir("*\lpmake")

          if ($deviceDisp -eq 'Oneplus 13' -and $ftypeDisp -eq 'SuperHybrid Flasher' -and $regionDisp -eq 'GLO') {
            $srcMeta          = Join-Path $baseSuperFs 'META-INF'
            $srcDtbo          = Join-Path $baseSuperFs 'dtbo_patcher.bat'
            $srcSuperFlasher  = Join-Path $baseSuperFs 'Super.Flasher.bat'
            $srcSuperOOSBat   = Join-Path $basePack13  'super_oos.bat'
            $srcCygwinDll     = Join-Path $baseLpmake  'cygwin1.dll'
            $srcLpmakeExe     = Join-Path $baseLpmake  'lpmake.exe'

            $destHybrid = Join-Path $outBase 'Super Hybrid Flasher'
            $destSuper  = Join-Path $destHybrid 'Super'
            New-Item -ItemType Directory -Path $destHybrid -Force | Out-Null
            New-Item -ItemType Directory -Path $destSuper -Force | Out-Null

            Copy-Item -Path $srcMeta -Destination $destHybrid -Recurse -Force
            Copy-Item -Path $srcDtbo, $srcSuperFlasher -Destination $destHybrid -Force
            Copy-Item -Path $srcSuperOOSBat -Destination $destSuper -Force
            Copy-Item -Path $srcCygwinDll, $srcLpmakeExe -Destination $destSuper -Force
          }

          7z a -tzip "$outBaseName.zip" "$outBase\*" | Out-Null
          "ZIP_NAME=$outBaseName.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Attach SHA256 and metadata
        shell: pwsh
        run: |
          $zipName = $env:ZIP_NAME
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          $hash | Out-File -FilePath "$zipName.sha256" -Encoding ascii
          echo "device=$env:DEVICE_DISPLAY`nflasher_type=$env:FTYPE_DISPLAY`nregion=$env:REGION`nversion=$env:VERSION`nota_url=${{ inputs.ota_url }}`nsha256=$hash" |
            Out-File -FilePath "BUILD_INFO.txt" -Encoding utf8

      - name: Upload artifact to GitHub
        if: ${{ inputs.upload_to == 'Artifact on GitHub' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            *.zip
            *.sha256
            BUILD_INFO.txt
            download/*.sha256.txt
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
