name: Build Android Flasher from OTA

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: "Paste the FULL OTA.zip URL here (leave empty to test with placeholder)"
        required: false
        type: string
      device:
        description: "Device"
        required: true
        type: choice
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
      flasher_type:
        description: "Flasher type"
        required: true
        type: choice
        options:
          - Super Flasher
          - Regional Flasher
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
      region:
        description: "Region (set to NONE for SunOS flasher)"
        required: true
        type: choice
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
          - NONE
      upload_to:
        description: "Upload To"
        required: true
        type: choice
        options:
          - Artifact on GitHub
          - Sourceforge
          - Daniels Server
          - Both Sourceforge & Daniels Server

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build ${{ inputs.flasher_type }} • ${{ inputs.device }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate + select OTA mode
        shell: pwsh
        run: |
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            "USE_PLACEHOLDER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Using placeholder ZIP."
          } else {
            if ($url -notmatch '^https?://') { throw "OTA URL must start with http:// or https://" }
            if ($url -notmatch '\.zip(\?|$)') { Write-Warning "URL does not end in .zip" }
            "USE_PLACEHOLDER=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          # Validate flasher type + region
          $ftype = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"
          if ($ftype -eq "SuperHybrid SunOS Flasher" -and $region -ne "NONE") {
            throw "'SuperHybrid SunOS Flasher' must have region set to NONE."
          }
          if ($ftype -ne "SuperHybrid SunOS Flasher" -and $region -eq "NONE") {
            throw "Region NONE is only valid for 'SuperHybrid SunOS Flasher'."
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          choco install -y aria2 7zip
          New-Item -ItemType Directory -Force -Path "$env:OUT_DIR", "download" | Out-Null

      - name: Download or create OTA.zip
        shell: pwsh
        run: |
          if ($env:USE_PLACEHOLDER -eq '1') {
            $p = "download\PLACEHOLDER.txt"
            "Placeholder OTA payload" | Out-File -FilePath $p
            Compress-Archive -Path $p -DestinationPath "download\ota-placeholder.zip"
            $fileName = "ota-placeholder.zip"
          } else {
            $url = "${{ inputs.ota_url }}"
            $fileName = Split-Path $url -Leaf
            aria2c -x16 -s16 -k1M -d download -o $fileName $url
          }

          $zipPath = "download\$fileName"
          "DOWNLOADED_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          $hash | Out-File -FilePath "$zipPath.sha256.txt" -Encoding ascii

      - name: Derive metadata
        shell: pwsh
        run: |
          $device = "${{ inputs.device }}"
          $ftype = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"
          $file = Get-Item "$env:DOWNLOADED_ZIP"
          $ver = [System.IO.Path]::GetFileNameWithoutExtension($file.Name) -replace '[^0-9A-Za-z._-]', ''
          if ($ver.Length -lt 4) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.Substring(0, 8)
            $ver = (Get-Date -Format "yyyyMMdd") + "-$hash"
          }

          $deviceNorm = $device.Replace(' ', '')
          $ftypeNorm = $ftype.Replace(' ', '')
          $regionNorm = if ($region -eq 'NONE') { '' } else { $region }

          "DEVICE=$deviceNorm" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DEVICE_DISPLAY=$device" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE=$ftypeNorm" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE_DISPLAY=$ftype" | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION=$region" | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION_FOR_NAME=$regionNorm" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTAFILE=$($file.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build flasher
        shell: pwsh
        run: |
          $device = $env:DEVICE_DISPLAY
          $ftype  = $env:FTYPE_DISPLAY
          $region = $env:REGION
          $ver    = $env:VERSION

          $outBaseName = if ($env:REGION_FOR_NAME) { "$env:DEVICE-$env:FTYPE-$env:REGION_FOR_NAME-$ver" } else { "$env:DEVICE-$env:FTYPE-$ver" }
          $outDir = Join-Path "$env:OUT_DIR" $outBaseName
          "ARTIFACT_NAME=$outBaseName" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          Copy-Item $env:OTAFILE -Destination (Join-Path $outDir "OTA.zip")
          $note = if ($env:USE_PLACEHOLDER -eq '1') { "`nNOTE: Placeholder OTA used." } else { "" }
          "Device: $device`nFlasher: $ftype`nRegion: $region`nVersion: $ver$note" |
            Out-File -FilePath (Join-Path $outDir "README.txt") -Encoding utf8

          function Find-Dir([string]$pattern) {
            $m = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Directory -Recurse -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -like "*$pattern" } | Select-Object -First 1
            if ($m) { return $m.FullName } else { return $null }
          }

          # === SPECIAL CASE: Oneplus 13 + SuperHybrid Flasher + GLO ===
          if ($device -eq 'Oneplus 13' -and $ftype -eq 'SuperHybrid Flasher' -and $region -eq 'GLO') {
            $baseSuperFs = Find-Dir("flasher_scripts\13\oos\super")
            $basePack13  = Find-Dir("super_packers\13")
            $baseLpmake  = Find-Dir("lpmake")

            if (!$baseSuperFs -or !$basePack13 -or !$baseLpmake) {
              throw "Required directories not found."
            }

            $srcMeta   = Join-Path $baseSuperFs "META-INF"
            $srcDtbo   = Join-Path $baseSuperFs "dtbo_patcher.bat"
            $srcFlasher= Join-Path $baseSuperFs "Super.Flasher.bat"
            $srcOOSBat = Join-Path $basePack13 "super_oos.bat"
            $srcCygwin = Join-Path $baseLpmake "cygwin1.dll"
            $srcLpmake = Join-Path $baseLpmake "lpmake.exe"

            foreach ($f in @($srcMeta, $srcDtbo, $srcFlasher, $srcOOSBat, $srcCygwin, $srcLpmake)) {
              if (!(Test-Path $f)) { throw "Required path not found: $f" }
            }

            $destHybrid = Join-Path $outDir "Super Hybrid Flasher"
            $destSuper  = Join-Path $destHybrid "Super"
            New-Item -ItemType Directory -Path $destHybrid, $destSuper -Force | Out-Null

            Copy-Item -Path $srcMeta -Destination $destHybrid -Recurse -Force
            Copy-Item -Path $srcDtbo, $srcFlasher -Destination $destHybrid -Force
            Copy-Item -Path $srcOOSBat, $srcCygwin, $srcLpmake -Destination $destSuper -Force
          }

          7z a -tzip "$outBaseName.zip" "$outDir\*" | Out-Null
          "ZIP_NAME=$outBaseName.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Write SHA256 and metadata
        shell: pwsh
        run: |
          $zip = $env:ZIP_NAME
          $sha = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          $sha | Out-File -FilePath "$zip.sha256" -Encoding ascii
          @"
device=$env:DEVICE_DISPLAY
flasher_type=$env:FTYPE_DISPLAY
region=$env:REGION
version=$env:VERSION
ota_url=${{ inputs.ota_url }}
artifact=$zip
sha256=$sha
"@ | Out-File -FilePath "BUILD_INFO.txt" -Encoding utf8

      - name: Upload GitHub artifact
        if: ${{ inputs.upload_to == 'Artifact on GitHub' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            *.zip
            *.sha256
            BUILD_INFO.txt
            download/*.sha256.txt
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
