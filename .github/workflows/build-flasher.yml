name: Build Flasher Package

on:
  workflow_dispatch:
    inputs:
      DEVICE:
        description: "Device (e.g., Oneplus13, Oneplus13R, Oneplus13S, Oneplus13T)"
        required: true
        default: Oneplus13
      DEVICE_DISPLAY:
        description: "Display name (e.g., Oneplus 13)"
        required: true
        default: Oneplus 13
      FTYPE:
        description: "Flasher type (e.g., SuperHybridFlasher)"
        required: true
        default: SuperHybridFlasher
      FTYPE_DISPLAY:
        description: "Flasher display name"
        required: true
        default: SuperHybrid Flasher
      REGION:
        description: "Region (e.g., EU, GLO, IN, NA)"
        required: true
        default: GLO
      REGION_FOR_NAME:
        description: "Region suffix in folder name (blank for NONE)"
        required: false
        default: GLO
      VERSION:
        description: "Version label"
        required: true
        default: ota-placeholder
      USE_PLACEHOLDER:
        description: "Use placeholder OTA (1 = yes, 0 = no)"
        required: true
        default: "1"

jobs:
  build-flasher:
    runs-on: windows-latest

    env:
      ARTIFACT_RETENTION_DAYS: 14
      OUT_DIR: out

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: choco install -y aria2 7zip

      - name: Define environment variables
        run: |
          $env:OTAFILE = if ($env:USE_PLACEHOLDER -eq '1') {
            "download/ota-placeholder.zip"
          } else {
            "download/real-ota.zip"
          }
          echo "OTAFILE=$($env:OTAFILE)" >> $env:GITHUB_ENV

      - name: Prepare output folder
        run: |
          $deviceDisp  = "${{ github.event.inputs.DEVICE_DISPLAY }}"
          $ftypeDisp   = "${{ github.event.inputs.FTYPE_DISPLAY }}"
          $regionDisp  = "${{ github.event.inputs.REGION }}"
          $deviceName  = "${{ github.event.inputs.DEVICE }}"
          $ftypeName   = "${{ github.event.inputs.FTYPE }}"
          $regionName  = "${{ github.event.inputs.REGION_FOR_NAME }}"
          $version     = "${{ github.event.inputs.VERSION }}"
          $outName = if ($regionName) { "$deviceName-$ftypeName-$regionName-$version" } else { "$deviceName-$ftypeName-$version" }
          echo "ARTIFACT_NAME=$outName" >> $env:GITHUB_ENV

          $outPath = Join-Path $env:OUT_DIR $outName
          echo "OUT_PATH=$outPath" >> $env:GITHUB_ENV

          New-Item -ItemType Directory -Path $outPath -Force | Out-Null

          Copy-Item $env:OTAFILE -Destination (Join-Path $outPath "OTA.zip")

          $note = if ("${{ github.event.inputs.USE_PLACEHOLDER }}" -eq '1') { "`nNOTE: Placeholder OTA used." } else { "" }
          "Device: $deviceDisp`nType: $ftypeDisp`nRegion: $regionDisp`nVersion: $version$note" |
            Out-File -FilePath (Join-Path $outPath "README.txt") -Encoding utf8

      - name: Run build script based on device/region
        shell: cmd
        run: |
          SETLOCAL ENABLEDELAYEDEXPANSION
          SET DEVICE=${{ github.event.inputs.DEVICE }}
          SET REGION=${{ github.event.inputs.REGION }}
          SET REGION_SUFFIX=${{ github.event.inputs.REGION_FOR_NAME }}
          SET VERSION=${{ github.event.inputs.VERSION }}
          SET OUT_NAME=%DEVICE%-%FTYPE%-%REGION_SUFFIX%-%VERSION%
          SET OUT_DIR=out
          SET OUT_PATH=%OUT_DIR%\%OUT_NAME%
          SET ZIP_PATH=%OUT_NAME%.zip

          IF "%REGION%"=="EU"  SET BLOAT_DIR=bloat\13\EUGLO_BLOAT
          IF "%REGION%"=="GLO" SET BLOAT_DIR=bloat\13\EUGLO_BLOAT
          IF "%REGION%"=="IN"  SET BLOAT_DIR=bloat\13\IN_BLOAT
          IF "%REGION%"=="NA"  SET BLOAT_DIR=bloat\13\NA_BLOAT

          :: Copy bloat files to Super folder if present
          IF EXIST "%BLOAT_DIR%\my_preload.img" (
            COPY /Y "%BLOAT_DIR%\my_preload.img" "%OUT_PATH%\SuperHybrid Flasher\super\"
          )
          IF EXIST "%BLOAT_DIR%\my_company.img" (
            COPY /Y "%BLOAT_DIR%\my_company.img" "%OUT_PATH%\SuperHybrid Flasher\super\"
          )

          :: Run the correct .bat script
          IF "%DEVICE%"=="Oneplus13"  CALL build_scripts\13\SUPERHYBRID_FULL_SUPERBUILD.bat
          IF "%DEVICE%"=="Oneplus13R" CALL build_scripts\13R\SUPERHYBRID_FULL_SUPERBUILD.bat
          IF "%DEVICE%"=="Oneplus13S" CALL build_scripts\13S\SUPERHYBRID_FULL_SUPERBUILD.bat
          IF "%DEVICE%"=="Oneplus13T" CALL build_scripts\13T\SUPERHYBRID_FULL_SUPERBUILD.bat

      - name: Zip output
        run: |
          7z a -tzip "${{ env.ARTIFACT_NAME }}.zip" "${{ env.OUT_PATH }}\SuperHybrid Flasher\*"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: "${{ env.ARTIFACT_NAME }}.zip"
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
