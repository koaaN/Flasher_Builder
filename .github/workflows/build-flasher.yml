name: Build Flasher (with region bloat inside SuperHybrid)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
          - Super Flasher
          - Regional Flasher
          - Super Flasher CN
          - Regional Flasher CN
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prep OTA (download or placeholder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "download","$env:OUT_DIR" | Out-Null
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            Set-Content -Path "download\PLACEHOLDER.txt" -Value "Placeholder OTA for dry-run"
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\OTA.zip" -Force
          } else {
            $name = Split-Path $url -Leaf
            if ([string]::IsNullOrWhiteSpace($name)) { $name = "OTA.zip" }
            $dst = "download\$name"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            if ($name -ne "OTA.zip") {
              if (Test-Path "download\OTA.zip") { Remove-Item "download\OTA.zip" -Force }
              Rename-Item -Path $dst -NewName "OTA.zip"
            }
          }
          "OTA_PATH=$(Resolve-Path 'download\OTA.zip')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Map device → folder & pick builder
        shell: pwsh
        run: |
          $devDisp = "${{ inputs.device }}"
          $dev = switch ($devDisp) {
            'Oneplus 13'  { '13' }
            'Oneplus 13R' { '13R' }
            'Oneplus 13S' { '13S' }
            'Oneplus 13T' { '13T' }
            default { throw "Unknown device: $devDisp" }
          }

          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"

          # pick correct builder script
          $batName = switch ($dev) {
            '13' {
              switch ($ftype) {
                'SuperHybrid Flasher' { if ($region -eq 'CN') { 'SUPERHYBRID_CN_FULL_SUPERBUILD.bat' } else { 'SUPERHYBRID_FULL_SUPERBUILD.bat' } }
                'RegionalHybrid Flasher' { if ($region -eq 'CN') { 'REGIONALHYBRID_CN_FULL_BUILD.bat' } else { 'REGIONALHYBRID_FULL_BUILD.bat' } }
                'SuperHybrid SunOS Flasher' { 'SUPERHYBRID_SUNOS_FULL_SUPERBUILD.bat' }
                default { '' }
              }
            }
            '13R' {
              switch ($ftype) {
                'Super Flasher' { if ($region -eq 'CN') { 'SUPER_CN_FULL_SUPERBUILD.bat' } else { 'Super_Flasher13R.bat' } }
                'Regional Flasher' { if ($region -eq 'CN') { 'REGIONAL_CN_FULL_BUILD.bat' } else { 'Regional_Flasher13R.bat' } }
                default { '' }
              }
            }
            '13S' {
              switch ($ftype) {
                'Super Flasher' { 'Super_Flasher.bat' }
                'Regional Flasher' { 'Regional_Flasher.bat' }
                default { '' }
              }
            }
            '13T' {
              switch ($ftype) {
                'Super Flasher' { if ($region -eq 'CN') { 'SUPER_CN_FULL_SUPERBUILD.bat' } else { 'SUPER_IN_FULL_SUPERBUILD.bat' } }
                default { '' }
              }
            }
          }

          "DEV_FOLDER=$dev"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILDER_BAT=$batName"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE=$ftype"          | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION=$region"        | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage files
        shell: pwsh
        run: |
          function Copy-BloatFiles($base, $region, $dest) {
            $map = @{
              'EU'  = 'EUGLO_BLOAT'
              'GLO' = 'EUGLO_BLOAT'
              'IN'  = 'IN_BLOAT'
              'NA'  = 'NA_BLOAT'
              'CN'  = 'CN_BLOAT'
              'A5'  = 'A5_DEBLOAT'
            }
            $folder = $map[$region]
            if (-not $folder) { return }
            $src = Join-Path $base $folder
            if (!(Test-Path $src)) { throw "Missing bloat source: $src" }
            foreach ($f in @('my_preload.img','my_company.img')) {
              $file = Join-Path $src $f
              if (Test-Path $file) {
                Copy-Item $file -Destination $dest -Force
              }
            }
          }

          $dev     = $env:DEV_FOLDER
          $ftype   = $env:FTYPE
          $region  = $env:REGION
          $builder = $env:BUILDER_BAT
          $builderDir = Join-Path $env:GITHUB_WORKSPACE ("build_scripts\" + $dev)

          $destRoot = $env:OUT_DIR
          New-Item -ItemType Directory -Force -Path $destRoot | Out-Null

          # stage otaripper + builder script into OUT_DIR
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'otaripper\otaripper.exe') -Destination $destRoot -Force
          if ($builder) {
            $srcBuilder = Join-Path $builderDir $builder
            if (Test-Path $srcBuilder) {
              Copy-Item $srcBuilder -Destination $destRoot -Force
            }
          }

          # stage flasher working folder depending on type/device
          $flasherDest = ""
          if ($dev -eq '13T') {
            if ($region -eq 'CN') { $flasherDest = Join-Path $destRoot 'Super Flasher CN' }
            else { $flasherDest = Join-Path $destRoot 'Super Flasher' }
          } else {
            $flasherDest = Join-Path $destRoot $ftype
          }

          if (Test-Path $flasherDest) { Remove-Item $flasherDest -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $flasherDest | Out-Null

          # common platform-tools
          $ptSrc = Join-Path $env:GITHUB_WORKSPACE 'platform-tools'
          if (Test-Path $ptSrc) { Copy-Item $ptSrc -Destination $flasherDest -Recurse -Force }

          # Super builds
          if ($ftype -like '*Super*') {
            $superDir = Join-Path $flasherDest 'Super'
            New-Item -ItemType Directory -Force -Path $superDir | Out-Null
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'lpmake\lpmake.exe') -Destination $superDir -Force
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'lpmake\cygwin1.dll') -Destination $superDir -Force

            # 13T packer script
            if ($dev -eq '13T') {
              $packerDir = Join-Path $env:GITHUB_WORKSPACE "super_packers\$dev"
              if ($region -eq 'CN') {
                Copy-Item (Join-Path $packerDir 'super_cos.bat') -Destination $superDir -Force
              } else {
                Copy-Item (Join-Path $packerDir 'super_oos.bat') -Destination $superDir -Force
              }
            }

            # copy flasher script + META-INF
            if ($dev -eq '13T') {
              if ($region -eq 'CN') {
                Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'flasher_scripts\13T\cos\super\Super_Flasher_COS.bat') -Destination $flasherDest -Force
                Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'flasher_scripts\13T\cos\super\META-INF') -Destination $flasherDest -Recurse -Force
              } else {
                Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'flasher_scripts\13T\oos\super\Super_Flasher.bat') -Destination $flasherDest -Force
                Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'flasher_scripts\13T\oos\super\META-INF') -Destination $flasherDest -Recurse -Force
              }
            }

            # bloat for Super
            $bloatBase = Join-Path $env:GITHUB_WORKSPACE ("bloat\" + $dev)
            Copy-BloatFiles $bloatBase $region $superDir

            if ($region -eq 'CN') {
              # CN Super also copies EUGLO_BLOAT into OOS_FILES_HERE
              $oosHere = Join-Path $flasherDest 'OOS_FILES_HERE'
              New-Item -ItemType Directory -Force -Path $oosHere | Out-Null
              if ($dev -eq '13R') {
                Copy-BloatFiles $bloatBase 'A5' $oosHere
              } else {
                Copy-BloatFiles $bloatBase 'GLO' $oosHere
              }
            }
          }

          # Regional builds
          if ($ftype -like '*Regional*') {
            $oosHere = Join-Path $flasherDest 'OOS_FILES_HERE'
            New-Item -ItemType Directory -Force -Path $oosHere | Out-Null
            $bloatBase = Join-Path $env:GITHUB_WORKSPACE ("bloat\" + $dev)
            Copy-BloatFiles $bloatBase $region $oosHere

            if ($region -eq 'CN') {
              $cosHere = Join-Path $flasherDest 'COS_FILES_HERE'
              New-Item -ItemType Directory -Force -Path $cosHere | Out-Null
              Copy-BloatFiles $bloatBase 'CN' $cosHere
              if ($dev -eq '13R') {
                Copy-BloatFiles $bloatBase 'A5' $oosHere
              } else {
                Copy-BloatFiles $bloatBase 'GLO' $oosHere
              }
            }
          }

      - name: Zip built Flasher
        shell: pwsh
        run: |
          $artifactName = ("${{ inputs.device }}-${{ inputs.flasher_type }}-${{ inputs.region }}-" + (Get-Date -Format "yyyyMMdd-HHmmss")).Replace(' ','')
          $zip = "$artifactName.zip"
          Compress-Archive -Path "$env:OUT_DIR\*" -DestinationPath $zip -Force
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_FILE=$zip"              | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
