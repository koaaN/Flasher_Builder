name: Build Flasher (staging only, no run)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
          - Super Flasher
          - Regional Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prep OTA (download or placeholder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "download","$env:OUT_DIR" | Out-Null
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            Set-Content -Path "download\PLACEHOLDER.txt" -Value "Placeholder OTA for dry-run"
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\OTA.zip" -Force
          } else {
            $name = Split-Path $url -Leaf
            if ([string]::IsNullOrWhiteSpace($name)) { $name = "OTA.zip" }
            $dst = "download\$name"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            if ($name -ne "OTA.zip") {
              if (Test-Path "download\OTA.zip") { Remove-Item "download\OTA.zip" -Force }
              Rename-Item -Path $dst -NewName "OTA.zip"
            }
          }
          "OTA_PATH=$(Resolve-Path 'download\OTA.zip')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Map device → folder & pick builder
        shell: pwsh
        run: |
          $devDisp = "${{ inputs.device }}"
          $ftype   = "${{ inputs.flasher_type }}"
          $region  = "${{ inputs.region }}"

          $dev = switch ($devDisp) {
            'Oneplus 13'  { '13' }
            'Oneplus 13R' { '13R' }
            'Oneplus 13S' { '13S' }
            'Oneplus 13T' { '13T' }
            default { throw "Unknown device: $devDisp" }
          }

          $batName = ""
          switch ("$dev|$ftype|$region") {
            {$_ -match '13\|SuperHybrid Flasher\|CN'} { $batName = 'SUPERHYBRID_CN_FULL_SUPERBUILD.bat' }
            {$_ -match '13\|SuperHybrid Flasher'}     { $batName = 'SUPERHYBRID_FULL_SUPERBUILD.bat' }
            {$_ -match '13\|RegionalHybrid Flasher\|CN'} { $batName = 'REGIONALHYBRID_CN_FULL_BUILD.bat' }
            {$_ -match '13\|RegionalHybrid Flasher'}     { $batName = 'REGIONALHYBRID_FULL_BUILD.bat' }
            {$_ -match '13\|SuperHybrid SunOS Flasher'}  { $batName = 'SUPERHYBRID_SUNOS_FULL_SUPERBUILD.bat' }

            {$_ -match '13R\|Super Flasher\|CN'} { $batName = 'SUPER_CN_FULL_SUPERBUILD.bat' }
            {$_ -match '13R\|Super Flasher'}     { $batName = 'Super_Flasher13R.bat' }
            {$_ -match '13R\|Regional Flasher\|CN'} { $batName = 'REGIONAL_CN_FULL_BUILD.bat' }
            {$_ -match '13R\|Regional Flasher'}     { $batName = 'Regional_Flasher13R.bat' }

            {$_ -match '13S\|Super Flasher'}     { $batName = 'Super_Flasher.bat' }
            {$_ -match '13S\|Regional Flasher'}  { $batName = 'Regional_Flasher.bat' }

            {$_ -match '13T\|Super Flasher\|CN'} { $batName = 'SUPER_CN_FULL_SUPERBUILD.bat' }
            {$_ -match '13T\|Super Flasher'}     { $batName = 'SUPER_IN_FULL_SUPERBUILD.bat' }

            default { throw "Unsupported combo: $_" }
          }

          "DEV_FOLDER=$dev"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILDER_BAT=$batName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage files
        shell: pwsh
        run: |
          function Copy-BloatFiles($srcBase, $regionKey, $dest) {
            $map = @{
              'EU'  = 'EUGLO_BLOAT'
              'GLO' = 'EUGLO_BLOAT'
              'IN'  = 'IN_BLOAT'
              'NA'  = 'NA_BLOAT'
              'CN'  = 'CN_BLOAT'
              'A5'  = 'A5_DEBLOAT'
            }
            if (-not $map.ContainsKey($regionKey)) { return }
            $folder = $map[$regionKey]
            $src = Join-Path $srcBase $folder
            if (Test-Path $src) {
              $files = @('my_preload.img','my_company.img')
              foreach ($f in $files) {
                $fpath = Join-Path $src $f
                if (Test-Path $fpath) {
                  Copy-Item $fpath -Destination $dest -Force
                }
              }
            }
          }

          $dev    = $env:DEV_FOLDER
          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"

          $builderDir = Join-Path $env:GITHUB_WORKSPACE ("build_scripts\" + $dev)
          if (!(Test-Path $builderDir)) { throw "Missing builder dir: $builderDir" }

          # Workdir name
          $workName = switch ("$dev|$ftype|$region") {
            {$_ -match '13\|SuperHybrid Flasher\|CN'} { 'SuperHybrid Flasher CN' }
            {$_ -match '13\|SuperHybrid Flasher'}     { 'SuperHybrid Flasher' }
            {$_ -match '13\|RegionalHybrid Flasher\|CN'} { 'RegionalHybrid Flasher CN' }
            {$_ -match '13\|RegionalHybrid Flasher'}     { 'RegionalHybrid Flasher' }
            {$_ -match '13\|SuperHybrid SunOS Flasher'}  { 'SuperHybrid SunOS Flasher' }

            {$_ -match '13R\|Super Flasher\|CN'} { 'Super Flasher CN' }
            {$_ -match '13R\|Super Flasher'}     { 'Super Flasher' }
            {$_ -match '13R\|Regional Flasher\|CN'} { 'Regional Flasher CN' }
            {$_ -match '13R\|Regional Flasher'}     { 'Regional Flasher' }

            {$_ -match '13S\|Super Flasher'}     { 'Super Flasher' }
            {$_ -match '13S\|Regional Flasher'}  { 'Regional Flasher' }

            {$_ -match '13T\|Super Flasher\|CN'} { 'Super Flasher CN' }
            {$_ -match '13T\|Super Flasher'}     { 'Super Flasher' }

            default { throw "Unknown folder mapping: $_" }
          }

          $destDir = Join-Path $env:OUT_DIR $workName
          if (Test-Path $destDir) { Remove-Item $destDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null

          # Copy flasher scripts + META-INF
          $flasherBase = Join-Path $env:GITHUB_WORKSPACE ("flasher_scripts\" + $dev)
          if ($ftype -match 'SuperHybrid') {
            $src = if ($ftype -match 'SunOS') { Join-Path $flasherBase "oos\super" } else { Join-Path $flasherBase "oos\super" }
            Copy-Item (Join-Path $src '*') -Destination $destDir -Recurse -Force
            if (Test-Path (Join-Path $src 'META-INF')) {
              Copy-Item (Join-Path $src 'META-INF') -Destination $destDir -Recurse -Force
            }
          }
          elseif ($ftype -match 'RegionalHybrid') {
            $src = Join-Path $flasherBase "oos\regional"
            Copy-Item (Join-Path $src '*') -Destination $destDir -Recurse -Force
            if (Test-Path (Join-Path $src 'META-INF')) {
              Copy-Item (Join-Path $src 'META-INF') -Destination $destDir -Recurse -Force
            }
          }
          elseif ($ftype -eq 'Super Flasher' -or $ftype -eq 'Regional Flasher') {
            $sub = if ($region -eq 'CN') { 'cos' } else { 'oos' }
            $stype = if ($ftype -eq 'Super Flasher') { 'super' } else { 'regional' }
            $src = Join-Path $flasherBase ($sub + "\" + $stype)
            Copy-Item (Join-Path $src '*') -Destination $destDir -Recurse -Force
            if (Test-Path (Join-Path $src 'META-INF')) {
              Copy-Item (Join-Path $src 'META-INF') -Destination $destDir -Recurse -Force
            }
          }

          # Super folder setup
          if ($ftype -match 'Super') {
            $superDir = Join-Path $destDir 'Super'
            New-Item -ItemType Directory -Force -Path $superDir | Out-Null
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'lpmake\lpmake.exe') -Destination $superDir -Force
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'lpmake\cygwin1.dll') -Destination $superDir -Force

            # 13T special: add packer
            if ($dev -eq '13T') {
              $packerBase = Join-Path $env:GITHUB_WORKSPACE "super_packers\13T"
              $packer = if ($region -eq 'CN') { 'super_cos.bat' } else { 'super_oos.bat' }
              Copy-Item (Join-Path $packerBase $packer) -Destination $superDir -Force
            }
          }

          # Bloat logic
          $bloatBase = Join-Path $env:GITHUB_WORKSPACE ("bloat\" + $dev)
          if ($ftype -match 'Super') {
            Copy-BloatFiles $bloatBase $region $superDir
            if ($region -eq 'CN') {
              $oosHere = Join-Path $destDir 'OOS_FILES_HERE'
              New-Item -ItemType Directory -Force -Path $oosHere | Out-Null
              if ($dev -eq '13R') {
                Copy-BloatFiles $bloatBase 'A5' $oosHere
              } else {
                Copy-BloatFiles $bloatBase 'GLO' $oosHere
              }
            }
          }
          elseif ($ftype -match 'Regional') {
            $oosHere = Join-Path $destDir 'OOS_FILES_HERE'
            New-Item -ItemType Directory -Force -Path $oosHere | Out-Null
            Copy-BloatFiles $bloatBase $region $oosHere
            if ($region -eq 'CN') {
              $cosHere = Join-Path $destDir 'COS_FILES_HERE'
              New-Item -ItemType Directory -Force -Path $cosHere | Out-Null
              Copy-BloatFiles $bloatBase 'CN' $cosHere
              if ($dev -eq '13R') {
                Copy-BloatFiles $bloatBase 'A5' $oosHere
              } else {
                Copy-BloatFiles $bloatBase 'GLO' $oosHere
              }
            }
          }

          # Stage otaripper + builder script outside
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'otaripper\otaripper.exe') -Destination $builderDir -Force
          Copy-Item (Join-Path $builderDir $env:BUILDER_BAT) -Destination $builderDir -Force

          "BUILDER_DIR=$builderDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WORK_DIR=$destDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Zip staged flasher
        shell: pwsh
        run: |
          $built = $env:WORK_DIR
          if (!(Test-Path $built)) { throw "Expected built folder not found: $built" }

          $devName   = "${{ inputs.device }}".Replace(' ','')
          $ftypeName = "${{ inputs.flasher_type }}".Replace(' ','')
          $region    = "${{ inputs.region }}"
          $ts        = Get-Date -Format "yyyyMMdd-HHmmss"
          $artifact  = "$devName-$ftypeName-$region-$ts"
          "ARTIFACT_NAME=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append

          $zip = "$artifact.zip"
          Compress-Archive -Path "$built\*" -DestinationPath $zip -Force
          "ZIP_FILE=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
