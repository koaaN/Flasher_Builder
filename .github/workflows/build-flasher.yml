# .github/workflows/build-flasher.yml
name: Build Android Flasher from OTA

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: "Paste the FULL OTA.zip URL here (leave empty to dry-run with a placeholder)"
        type: string
        required: false
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - Super Flasher
          - Regional Flasher
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
      region:
        description: "Region (choose NONE only for 'SuperHybrid SunOS Flasher')"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
          - NONE
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - Sourceforge
          - Daniels Server
          - Both Sourceforge & Daniels Server
          - Artifact on GitHub

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build ${{ inputs.flasher_type }} • ${{ inputs.device }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        shell: pwsh
        run: |
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            "USE_PLACEHOLDER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            if ($url -notmatch '^https?://') { throw "OTA URL must start with http(s)://"; }
            "USE_PLACEHOLDER=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"
          if ($ftype -eq 'SuperHybrid SunOS Flasher' -and $region -ne 'NONE') {
            throw "For 'SuperHybrid SunOS Flasher' you must set Region to 'NONE'."
          }
          if ($ftype -ne 'SuperHybrid SunOS Flasher' -and $region -eq 'NONE') {
            throw "Region 'NONE' is only valid with 'SuperHybrid SunOS Flasher'."
          }

      - name: Prepare tools
        shell: pwsh
        run: |
          choco install -y aria2 7zip
          New-Item -ItemType Directory -Path "$env:OUT_DIR" -Force | Out-Null
          New-Item -ItemType Directory -Path "download" -Force | Out-Null

      - name: Get OTA.zip (or use placeholder)
        shell: pwsh
        run: |
          if ($env:USE_PLACEHOLDER -eq '1') {
            $tmp = "download\PLACEHOLDER.txt"
            Set-Content -Path $tmp -Value "Placeholder OTA"
            Compress-Archive -Path $tmp -DestinationPath "download\ota-placeholder.zip" -Force
            $file = "download\ota-placeholder.zip"
          } else {
            $url = "${{ inputs.ota_url }}"
            $fileName = Split-Path $url -Leaf
            $file = "download\$fileName"
            aria2c -x16 -s16 -k1M -d "download" -o "$fileName" "$url"
          }
          "DOWNLOADED_ZIP=$file" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Derive metadata
        shell: pwsh
        run: |
          $device = "${{ inputs.device }}"
          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"
          $zip    = Get-Item $env:DOWNLOADED_ZIP
          $version = (Get-Date -Format yyyyMMdd) + "-placeholder"

          $deviceNorm = $device -replace '\s',''
          $ftypeNorm  = $ftype -replace '\s',''
          $regionNorm = if ($region -eq 'NONE') { '' } else { $region }

          "DEVICE=$deviceNorm" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DEVICE_DISPLAY=$device" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE=$ftypeNorm" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE_DISPLAY=$ftype" | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION=$region" | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION_FOR_NAME=$regionNorm" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTAFILE=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage flasher files
        shell: pwsh
        run: |
          $outBase = Join-Path $env:OUT_DIR "$env:DEVICE-$env:FTYPE-$env:REGION_FOR_NAME-$env:VERSION"
          "ARTIFACT_NAME=$($outBase -replace '.*\\', '')" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Path $outBase -Force | Out-Null

          # Include OTA.zip and README
          Copy-Item $env:OTAFILE -Destination "$outBase\OTA.zip"
          "Device: $env:DEVICE_DISPLAY`nType: $env:FTYPE_DISPLAY`nRegion: $env:REGION`nVersion: $env:VERSION" |
            Out-File -FilePath "$outBase\README.txt" -Encoding utf8

          # Special case: Oneplus 13 + SuperHybrid Flasher + GLO
          if ($env:DEVICE_DISPLAY -eq 'Oneplus 13' -and $env:FTYPE_DISPLAY -eq 'SuperHybrid Flasher' -and $env:REGION -eq 'GLO') {
            $baseSuper = "flasher_scripts\13\oos\super"
            $basePack  = "super_packers\13"
            $baseLpm   = "lpmake"

            $srcMeta = Join-Path $baseSuper 'META-INF'
            $srcDtbo = Join-Path $baseSuper 'dtbo_patcher.bat'
            $srcFlash = Join-Path $baseSuper 'Super.Flasher.bat'
            $srcBat = Join-Path $basePack 'super_oos.bat'
            $cyg = Join-Path $baseLpm 'cygwin1.dll'
            $exe = Join-Path $baseLpm 'lpmake.exe'

            $destMain = Join-Path $outBase 'Super Hybrid Flasher'
            $destSub  = Join-Path $destMain 'Super'
            New-Item -ItemType Directory -Path $destMain -Force | Out-Null
            New-Item -ItemType Directory -Path $destSub -Force | Out-Null

            Copy-Item $srcMeta -Destination $destMain -Recurse -Force
            Copy-Item $srcDtbo, $srcFlash -Destination $destMain -Force
            Copy-Item $srcBat, $cyg, $exe -Destination $destSub -Force

            Write-Host "✅ Staged Super Hybrid Flasher files"
          }

      - name: Zip flasher
        shell: pwsh
        run: |
          $zipName = "$env:ARTIFACT_NAME.zip"
          7z a -tzip "$zipName" "$env:OUT_DIR\$env:ARTIFACT_NAME\*" | Out-Null
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            *.zip
            ${{ env.OUT_DIR }}/${{ env.ARTIFACT_NAME }}/README.txt
            ${{ env.OUT_DIR }}/${{ env.ARTIFACT_NAME }}/OTA.zip
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
