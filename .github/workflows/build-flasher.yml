# .github/workflows/build-flasher.yml
name: Build Android Flasher from OTA

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: "Paste the FULL OTA.zip URL here"
        type: string
        required: true
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - Super Flasher
          - Regional Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN

permissions:
  contents: read

concurrency:
  group: flasher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build ${{ inputs.flasher_type }} • ${{ inputs.device }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sanity check inputs
        shell: pwsh
        run: |
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) { throw "OTA URL is empty." }
          if ($url -notmatch '^https?://') { throw "OTA URL must start with http(s)://"; }
          if ($url -notmatch '\.zip(\?|$)') { Write-Warning "URL does not end in .zip — continuing anyway."; }

      - name: Prepare tools
        shell: pwsh
        run: |
          choco install -y aria2 7zip
          New-Item -ItemType Directory -Path "$env:OUT_DIR" -Force | Out-Null
          New-Item -ItemType Directory -Path "download" -Force | Out-Null

      - name: Download OTA.zip
        shell: pwsh
        run: |
          $url = "${{ inputs.ota_url }}"
          $fileName = Split-Path $url -Leaf
          if ([string]::IsNullOrWhiteSpace($fileName)) { $fileName = "ota.zip" }
          $dst = "download\$fileName"
          aria2c -x16 -s16 -k1M --console-log-level=warn --allow-overwrite=true -o "$fileName" -d "download" "$url"
          if (!(Test-Path $dst)) { throw "Failed to download OTA." }
          $sha = (Get-FileHash -Path $dst -Algorithm SHA256).Hash
          $sha | Out-File -FilePath "download\${fileName}.sha256.txt" -Encoding ascii

      - name: Derive version & metadata
        shell: pwsh
        run: |
          $device = "${{ inputs.device }}".Replace(' ','')
          $ftype  = "${{ inputs.flasher_type }}".Replace(' ','')
          $region = "${{ inputs.region }}"
          $file   = Get-ChildItem -Path "download" -Filter *.zip | Select-Object -First 1
          $base   = [System.IO.Path]::GetFileNameWithoutExtension($file.Name)
          $ver    = $base -replace '[^0-9A-Za-z._-]',''
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver.Length -lt 4) {
            $short = ((Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash).Substring(0,8)
            $ver = (Get-Date -Format "yyyyMMdd") + "-${short}"
          }
          "DEVICE=$device"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE=$ftype"    | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION=$region"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$ver"    | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTAFILE=$($file.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build flasher
        shell: pwsh
        run: |
          $device  = $env:DEVICE
          $ftype   = $env:FTYPE
          $region  = $env:REGION
          $version = $env:VERSION
          $outBase = Join-Path "$env:OUT_DIR" "$device-$ftype-$region-$version"
          New-Item -ItemType Directory -Path $outBase -Force | Out-Null

          Copy-Item $env:OTAFILE -Destination (Join-Path $outBase "OTA.zip")
          "Device: $device`nType: $ftype`nRegion: $region`nVersion: $version" |
            Out-File -FilePath (Join-Path $outBase "README.txt") -Encoding utf8

          $zipName = "$device-$ftype-$region-$version.zip"
          7z a -tzip "$zipName" "$outBase\*" | Out-Null
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Attach SHA256 and metadata
        shell: pwsh
        run: |
          $zipName = $env:ZIP_NAME
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          $hash | Out-File -FilePath "$zipName.sha256" -Encoding ascii
          echo "device=$env:DEVICE`nflasher_type=$env:FTYPE`nregion=$env:REGION`nversion=$env:VERSION`nota_url=${{ inputs.ota_url }}`nartifact=$zipName`nsha256=$hash" |
            Out-File -FilePath "BUILD_INFO.txt" -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE }}-${{ env.FTYPE }}-${{ env.REGION }}-${{ env.VERSION }}
          path: |
            *.zip
            *.sha256
            BUILD_INFO.txt
            download/*.sha256.txt
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
