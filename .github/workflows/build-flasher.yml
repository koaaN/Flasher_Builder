name: Build Android Flasher from OTA

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: "Paste the FULL OTA.zip URL here (leave empty to dry-run with a placeholder)"
        type: string
        required: false
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - Super Flasher
          - Regional Flasher
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
      region:
        description: "Region (choose NONE only for 'SuperHybrid SunOS Flasher')"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
          - NONE
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - Sourceforge
          - Daniels Server
          - Both Sourceforge & Daniels Server
          - Artifact on GitHub

permissions:
  contents: read

concurrency:
  group: flasher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build ${{ inputs.flasher_type }} • ${{ inputs.device }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: .  # prevent Build_Tools/Build_Tools issue

      - name: Validate inputs
        shell: pwsh
        run: |
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            "USE_PLACEHOLDER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            if ($url -notmatch '^https?://') { throw "OTA URL must start with http(s)://" }
            "USE_PLACEHOLDER=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"
          if ($ftype -eq 'SuperHybrid SunOS Flasher' -and $region -ne 'NONE') {
            throw "Region must be NONE for SuperHybrid SunOS Flasher"
          }
          if ($ftype -ne 'SuperHybrid SunOS Flasher' -and $region -eq 'NONE') {
            throw "Region NONE is only valid with SuperHybrid SunOS Flasher"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          choco install -y aria2 7zip
          New-Item -ItemType Directory -Force -Path "$env:OUT_DIR", "download" | Out-Null

      - name: Download or create placeholder OTA
        shell: pwsh
        run: |
          if ($env:USE_PLACEHOLDER -eq '1') {
            $tmp = "download\PLACEHOLDER.txt"
            Set-Content -Path $tmp -Value "This is a placeholder OTA."
            Compress-Archive -Path $tmp -DestinationPath "download\ota-placeholder.zip"
            $path = "download\ota-placeholder.zip"
          } else {
            $url = "${{ inputs.ota_url }}"
            $file = Split-Path $url -Leaf
            $path = "download\$file"
            aria2c -x16 -s16 -k1M -o $file -d download $url
          }

          $sha = (Get-FileHash $path -Algorithm SHA256).Hash
          $sha | Out-File -Encoding ascii "$path.sha256.txt"
          "DOWNLOADED_ZIP=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set metadata
        shell: pwsh
        run: |
          $d = "${{ inputs.device }}"
          $f = "${{ inputs.flasher_type }}"
          $r = "${{ inputs.region }}"
          $file = Get-Item -Path "$env:DOWNLOADED_ZIP"
          $base = [IO.Path]::GetFileNameWithoutExtension($file.Name)
          $ver = $base -replace '[^0-9A-Za-z._-]',''
          if ($ver.Length -lt 4) { $ver = (Get-Date -f yyyyMMdd) + "-" + ((Get-FileHash $file.FullName -Algorithm SHA256).Hash.Substring(0,8)) }

          "DEVICE=$($d -replace ' ', '')" | Out-File $env:GITHUB_ENV -Append
          "DEVICE_DISPLAY=$d" | Out-File $env:GITHUB_ENV -Append
          "FTYPE=$($f -replace ' ', '')" | Out-File $env:GITHUB_ENV -Append
          "FTYPE_DISPLAY=$f" | Out-File $env:GITHUB_ENV -Append
          "REGION=$r" | Out-File $env:GITHUB_ENV -Append
          "REGION_FOR_NAME=$(if ($r -eq 'NONE') { '' } else { $r })" | Out-File $env:GITHUB_ENV -Append
          "VERSION=$ver" | Out-File $env:GITHUB_ENV -Append
          "OTAFILE=$($file.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Build flasher
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $device = $env:DEVICE_DISPLAY
          $ftype = $env:FTYPE_DISPLAY
          $region = $env:REGION
          $ver = $env:VERSION
          $regionName = $env:REGION_FOR_NAME

          $outBase = if ($regionName) { "$env:OUT_DIR\$env:DEVICE-$env:FTYPE-$regionName-$ver" } else { "$env:OUT_DIR\$env:DEVICE-$env:FTYPE-$ver" }
          New-Item -ItemType Directory -Force -Path $outBase | Out-Null
          Copy-Item $env:OTAFILE -Destination "$outBase\OTA.zip"
          "Device: $device`nType: $ftype`nRegion: $region`nVersion: $ver" | Out-File -Encoding utf8 "$outBase\README.txt"

          # Special staging
          if ($device -eq 'Oneplus 13' -and $ftype -eq 'SuperHybrid Flasher' -and $region -eq 'GLO') {
            $superFs = Join-Path $root 'flasher_scripts\13\oos\super'
            $superPack = Join-Path $root 'super_packers\13'
            $lpmake = Join-Path $root 'lpmake'

            $dest = Join-Path $outBase 'Super Hybrid Flasher'
            $superDest = Join-Path $dest 'Super'
            New-Item -ItemType Directory -Force -Path $dest, $superDest | Out-Null

            Copy-Item "$superFs\META-INF" -Destination $dest -Recurse -Force
            Copy-Item "$superFs\dtbo_patcher.bat", "$superFs\Super.Flasher.bat" -Destination $dest -Force
            Copy-Item "$superPack\super_oos.bat" -Destination $superDest -Force
            Copy-Item "$lpmake\cygwin1.dll", "$lpmake\lpmake.exe" -Destination $superDest -Force
          }

          $zip = "$outBase.zip"
          7z a -tzip "$zip" "$outBase\*" | Out-Null
          "ZIP_NAME=$zip" | Out-File $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: ${{ inputs.upload_to == 'Artifact on GitHub' }}
        with:
          name: ${{ env.DEVICE }}-${{ env.FTYPE }}-${{ env.REGION_FOR_NAME }}-${{ env.VERSION }}
          path: |
            *.zip
            *.sha256
            download/*.sha256.txt
            BUILD_INFO.txt
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
