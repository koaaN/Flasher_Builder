# .github/workflows/build-flasher.yml
name: Build Android Flasher from OTA

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: "Paste the FULL OTA.zip URL here"
        type: string
        required: true
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - Super Flasher
          - Regional Flasher
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
      region:
        description: "Region (choose NONE only for 'SuperHybrid SunOS Flasher')"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
          - NONE
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - Sourceforge
          - Daniels Server
          - Both Sourceforge & Daniels Server
          - Artifact on GitHub

permissions:
  contents: read

concurrency:
  group: flasher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build ${{ inputs.flasher_type }} • ${{ inputs.device }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        shell: pwsh
        run: |
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) { throw "OTA URL is empty." }
          if ($url -notmatch '^https?://') { throw "OTA URL must start with http(s)://". }
          if ($url -notmatch '\.zip(\?|$)') { Write-Warning "URL does not end in .zip — continuing anyway." }

          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"
          if ($ftype -eq 'SuperHybrid SunOS Flasher' -and $region -ne 'NONE') {
            throw "For 'SuperHybrid SunOS Flasher' you must set Region to 'NONE'."
          }
          if ($ftype -ne 'SuperHybrid SunOS Flasher' -and $region -eq 'NONE') {
            throw "Region 'NONE' is only valid with 'SuperHybrid SunOS Flasher'."
          }

      - name: Prepare tools
        shell: pwsh
        run: |
          choco install -y aria2 7zip
          New-Item -ItemType Directory -Path "$env:OUT_DIR" -Force | Out-Null
          New-Item -ItemType Directory -Path "download" -Force | Out-Null

      - name: Download OTA.zip
        shell: pwsh
        run: |
          $url = "${{ inputs.ota_url }}"
          $fileName = Split-Path $url -Leaf
          if ([string]::IsNullOrWhiteSpace($fileName)) { $fileName = "ota.zip" }
          $dst = "download\$fileName"
          aria2c -x16 -s16 -k1M --console-log-level=warn --allow-overwrite=true -o "$fileName" -d "download" "$url"
          if (!(Test-Path $dst)) { throw "Failed to download OTA." }
          $sha = (Get-FileHash -Path $dst -Algorithm SHA256).Hash
          $sha | Out-File -FilePath "download\${fileName}.sha256.txt" -Encoding ascii

      - name: Derive version & metadata
        shell: pwsh
        run: |
          $deviceIn = "${{ inputs.device }}"
          $ftypeIn  = "${{ inputs.flasher_type }}"
          $regionIn = "${{ inputs.region }}"
          $file   = Get-ChildItem -Path "download" -Filter *.zip | Select-Object -First 1
          $base   = [System.IO.Path]::GetFileNameWithoutExtension($file.Name)
          $ver    = $base -replace '[^0-9A-Za-z._-]',''
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver.Length -lt 4) {
            $short = ((Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash).Substring(0,8)
            $ver = (Get-Date -Format "yyyyMMdd") + "-${short}"
          }

          # Normalize for filenames (remove spaces); omit region token when NONE
          $deviceNorm = $deviceIn.Replace(' ','')
          $ftypeNorm  = $ftypeIn.Replace(' ','')
          $regionNorm = if ($regionIn -eq 'NONE') { '' } else { $regionIn }

          "DEVICE=$deviceNorm"            | Out-File -FilePath $env:GITHUB_ENV -Append
          "DEVICE_DISPLAY=$deviceIn"      | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE=$ftypeNorm"              | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE_DISPLAY=$ftypeIn"        | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION=$regionIn"              | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION_FOR_NAME=$regionNorm"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$ver"                  | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTAFILE=$($file.FullName)"     | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build flasher (+ Oneplus 13 SuperHybrid GLO file staging)
        shell: pwsh
        run: |
          $deviceDisp  = $env:DEVICE_DISPLAY
          $ftypeDisp   = $env:FTYPE_DISPLAY
          $regionDisp  = $env:REGION
          $deviceName  = $env:DEVICE
          $ftypeName   = $env:FTYPE
          $regionName  = $env:REGION_FOR_NAME
          $version     = $env:VERSION

          # Output base folder name (omit region token for NONE)
          $outBaseName = if ($regionName) { "$deviceName-$ftypeName-$regionName-$version" } else { "$deviceName-$ftypeName-$version" }
          $outBase     = Join-Path "$env:OUT_DIR" $outBaseName
          New-Item -ItemType Directory -Path $outBase -Force | Out-Null

          # Always include OTA + README (you can replace with your real builder)
          Copy-Item $env:OTAFILE -Destination (Join-Path $outBase "OTA.zip")
          "Device: $deviceDisp`nType: $ftypeDisp`nRegion: $regionDisp`nVersion: $version" |
            Out-File -FilePath (Join-Path $outBase "README.txt") -Encoding utf8

          # === Special staging for Oneplus 13 + SuperHybrid Flasher + GLO region ===
          if ($deviceDisp -eq 'Oneplus 13' -and $ftypeDisp -eq 'SuperHybrid Flasher' -and $regionDisp -eq 'GLO') {
            $repoRoot = (Get-Location).Path
            $srcBase  = Join-Path $repoRoot 'Build_Tools\flasher_scripts\13\oos\super'
            $srcMeta  = Join-Path $srcBase 'META-INF'
            $srcDtbo  = Join-Path $srcBase 'dtbo_patcher.bat'
            $srcBat   = Join-Path $srcBase 'Super.Flasher.bat'

            if (!(Test-Path $srcMeta)) { throw "Required folder not found: $srcMeta" }
            if (!(Test-Path $srcDtbo)) { throw "Required file not found: $srcDtbo" }
            if (!(Test-Path $srcBat))  { throw "Required file not found: $srcBat"  }

            $destDir = Join-Path $outBase 'Super Hybrid Flasher'
            New-Item -ItemType Directory -Path $destDir -Force | Out-Null

            Copy-Item -Path $srcMeta -Destination $destDir -Recurse -Force
            Copy-Item -Path $srcDtbo, $srcBat -Destination $destDir -Force
            Write-Host "Staged 'Super Hybrid Flasher' folder with META-INF, dtbo_patcher.bat, Super.Flasher.bat"
          }

          # Package
          $zipName = "$outBaseName.zip"
          7z a -tzip "$zipName" "$outBase\*" | Out-Null
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Attach SHA256 and metadata
        shell: pwsh
        run: |
          $zipName = $env:ZIP_NAME
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          $hash | Out-File -FilePath "$zipName.sha256" -Encoding ascii
          echo "device=$env:DEVICE_DISPLAY`nflasher_type=$env:FTYPE_DISPLAY`nregion=$env:REGION`nversion=$env:VERSION`nota_url=${{ inputs.ota_url }}`nartifact=$zipName`nsha256=$hash" |
            Out-File -FilePath "BUILD_INFO.txt" -Encoding utf8

      # ---------- Optional uploads ----------
      - name: Prepare SSH keys (if needed)
        if: ${{ inputs.upload_to == 'Sourceforge' || inputs.upload_to == 'Daniels Server' || inputs.upload_to == 'Both Sourceforge & Daniels Server' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.ssh" | Out-Null
          if ("${{ secrets.SF_SSH_KEY }}") {
            $sfKeyPath = "$env:USERPROFILE\.ssh\sf_key"
            Set-Content -Path $sfKeyPath -Value "${{ secrets.SF_SSH_KEY }}"
          }
          if ("${{ secrets.DAN_SSH_KEY }}") {
            $danKeyPath = "$env:USERPROFILE\.ssh\dan_key"
            Set-Content -Path $danKeyPath -Value "${{ secrets.DAN_SSH_KEY }}"
          }

      - name: Upload to SourceForge
        if: ${{ inputs.upload_to == 'Sourceforge' || inputs.upload_to == 'Both Sourceforge & Daniels Server' }}
        shell: pwsh
        env:
          SF_USER: ${{ secrets.SF_USERNAME }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          SF_PATH: ${{ secrets.SF_PATH }}
        run: |
          $zip = $env:ZIP_NAME
          $dstBase = "/home/frs/project/$env:SF_PROJECT"
          if ($env:SF_PATH) { $dstBase = "$dstBase/$env:SF_PATH" }
          $host = "frs.sourceforge.net"
          $key  = "$env:USERPROFILE\.ssh\sf_key"
          ssh -i "$key" -o StrictHostKeyChecking=no "$env:SF_USER@$host" "mkdir -p '$dstBase'"
          scp -i "$key" -o StrictHostKeyChecking=no "$zip" "$zip.sha256" "BUILD_INFO.txt" "$env:SF_USER@$host:`"$dstBase/`""

      - name: Upload to Daniel's server
        if: ${{ inputs.upload_to == 'Daniels Server' || inputs.upload_to == 'Both Sourceforge & Daniels Server' }}
        shell: pwsh
        env:
          DAN_USER: ${{ secrets.DAN_USER }}
          DAN_HOST: ${{ secrets.DAN_HOST }}
          DAN_PATH: ${{ secrets.DAN_PATH }}
        run: |
          $zip = $env:ZIP_NAME
          $key = "$env:USERPROFILE\.ssh\dan_key"
          ssh -i "$key" -o StrictHostKeyChecking=no "$env:DAN_USER@$env:DAN_HOST" "mkdir -p '$env:DAN_PATH'"
          scp -i "$key" -o StrictHostKeyChecking=no "$zip" "$zip.sha256" "BUILD_INFO.txt" "$env:DAN_USER@$env:DAN_HOST:`"$env:DAN_PATH/`""

      - name: Upload artifact to GitHub
        if: ${{ inputs.upload_to == 'Artifact on GitHub' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE }}${{ env.REGION_FOR_NAME && format('-{0}', env.REGION_FOR_NAME) || '' }}-${{ env.FTYPE }}-${{ env.VERSION }}
          path: |
            *.zip
            *.sha256
            BUILD_INFO.txt
            download/*.sha256.txt
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
