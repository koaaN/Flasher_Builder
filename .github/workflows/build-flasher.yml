name: Build Android Flasher from OTA

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: "Paste the FULL OTA.zip URL here (leave empty to dry-run with a placeholder)"
        type: string
        required: false
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - Super Flasher
          - Regional Flasher
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
      region:
        description: "Region (choose NONE only for 'SuperHybrid SunOS Flasher')"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
          - NONE
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - Sourceforge
          - Daniels Server
          - Both Sourceforge & Daniels Server
          - Artifact on GitHub

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build ${{ inputs.flasher_type }} • ${{ inputs.device }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: pwsh
        run: |
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            "USE_PLACEHOLDER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            if ($url -notmatch '^https?://') { throw "OTA URL must start with http(s)://" }
            "USE_PLACEHOLDER=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          if ("${{ inputs.flasher_type }}" -eq 'SuperHybrid SunOS Flasher' -and "${{ inputs.region }}" -ne 'NONE') {
            throw "Region must be NONE for SuperHybrid SunOS Flasher"
          }

      - name: Install tools
        shell: pwsh
        run: |
          choco install -y aria2 7zip
          New-Item -ItemType Directory -Force -Path download, $env:OUT_DIR | Out-Null

      - name: Download or create placeholder OTA
        shell: pwsh
        run: |
          if ($env:USE_PLACEHOLDER -eq '1') {
            $tmp = "download\PLACEHOLDER.txt"
            Set-Content -Path $tmp -Value "Placeholder OTA"
            Compress-Archive -Path $tmp -DestinationPath "download\ota-placeholder.zip" -Force
            "OTAFILE=$pwd\download\ota-placeholder.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            $url = "${{ inputs.ota_url }}"
            $filename = Split-Path $url -Leaf
            aria2c -x16 -s16 -d download -o $filename $url
            "OTAFILE=$pwd\download\$filename" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Derive metadata
        shell: pwsh
        run: |
          $device  = "${{ inputs.device }}"
          $ftype   = "${{ inputs.flasher_type }}"
          $region  = "${{ inputs.region }}"
          $regionN = if ($region -eq 'NONE') { '' } else { $region }
          $ver     = "ota-placeholder"

          "DEVICE=$($device -replace ' ', '')" | Out-File -Append -FilePath $env:GITHUB_ENV
          "DEVICE_DISPLAY=$device"            | Out-File -Append -FilePath $env:GITHUB_ENV
          "FTYPE=$($ftype -replace ' ', '')"  | Out-File -Append -FilePath $env:GITHUB_ENV
          "FTYPE_DISPLAY=$ftype"              | Out-File -Append -FilePath $env:GITHUB_ENV
          "REGION=$region"                    | Out-File -Append -FilePath $env:GITHUB_ENV
          "REGION_FOR_NAME=$regionN"          | Out-File -Append -FilePath $env:GITHUB_ENV
          "VERSION=$ver"                      | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Stage flasher
        shell: pwsh
        run: |
          $deviceDisp  = $env:DEVICE_DISPLAY
          $ftypeDisp   = $env:FTYPE_DISPLAY
          $regionDisp  = $env:REGION
          $deviceName  = $env:DEVICE
          $ftypeName   = $env:FTYPE
          $regionName  = $env:REGION_FOR_NAME
          $version     = $env:VERSION
          $outBaseName = if ($regionName) { "$deviceName-$ftypeName-$regionName-$version" } else { "$deviceName-$ftypeName-$version" }
          "ARTIFACT_NAME=$outBaseName" | Out-File -FilePath $env:GITHUB_ENV -Append

          $out = Join-Path $env:OUT_DIR $outBaseName
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Always include OTA.zip and README
          Copy-Item $env:OTAFILE -Destination "$out\OTA.zip"
          "Device: $deviceDisp`nType: $ftypeDisp`nRegion: $regionDisp`nVersion: $version" |
            Out-File -FilePath "$out\README.txt" -Encoding utf8

          # === Special Case: OnePlus 13 + SuperHybrid Flasher + GLO ===
          if ($deviceDisp -eq 'Oneplus 13' -and $ftypeDisp -eq 'SuperHybrid Flasher' -and $regionDisp -eq 'GLO') {
            $root = $env:GITHUB_WORKSPACE
            $superFs   = Join-Path $root 'flasher_scripts\13\oos\super'
            $superPack = Join-Path $root 'super_packers\13'
            $lpmake    = Join-Path $root 'lpmake'

            $destMain  = Join-Path $out "Super Hybrid Flasher"
            $destSuper = Join-Path $destMain "Super"
            New-Item -ItemType Directory -Force -Path $destMain, $destSuper | Out-Null

            Copy-Item "$superFs\META-INF" -Destination $destMain -Recurse -Force
            Copy-Item "$superFs\dtbo_patcher.bat", "$superFs\Super.Flasher.bat" -Destination $destMain -Force
            Copy-Item "$superPack\super_oos.bat" -Destination $destSuper -Force
            Copy-Item "$lpmake\cygwin1.dll", "$lpmake\lpmake.exe" -Destination $destSuper -Force

            Write-Host "SuperHybrid Flasher staged."
          }

          # Package
          7z a -tzip "$outBaseName.zip" "$out\*" | Out-Null
          "ZIP_NAME=$outBaseName.zip" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Upload artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.OUT_DIR }}/${{ env.ARTIFACT_NAME }}/README.txt
            ${{ env.OUT_DIR }}/${{ env.ARTIFACT_NAME }}/OTA.zip
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
