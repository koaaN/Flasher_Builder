name: Build Flasher (with region bloat inside Super/Regional/CN)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
          - Super Flasher
          - Regional Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prep OTA (download or placeholder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "download","$env:OUT_DIR" | Out-Null
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            Set-Content -Path "download\PLACEHOLDER.txt" -Value "Placeholder OTA for dry-run"
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\OTA.zip" -Force
          } else {
            $name = Split-Path $url -Leaf
            if ([string]::IsNullOrWhiteSpace($name)) { $name = "OTA.zip" }
            $dst = "download\$name"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            if ($name -ne "OTA.zip") {
              if (Test-Path "download\OTA.zip") { Remove-Item "download\OTA.zip" -Force }
              Rename-Item -Path $dst -NewName "OTA.zip"
            }
          }
          "OTA_PATH=$(Resolve-Path 'download\OTA.zip')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage working dir (no build run)
        shell: pwsh
        run: |
          function Copy-Bloat {
            param([string]$base,[string]$regionCode,[string]$dest)
            $map = @{
              'EU'  = 'EUGLO_BLOAT'
              'GLO' = 'EUGLO_BLOAT'
              'IN'  = 'IN_BLOAT'
              'NA'  = 'NA_BLOAT'
              'CN'  = 'CN_BLOAT'
              'A5'  = 'A5_DEBLOAT'
            }
            if ($map.ContainsKey($regionCode)) {
              $folder = $map[$regionCode]
              $src = Join-Path $base $folder
              if (Test-Path $src) {
                Copy-Item $src -Destination $dest -Recurse -Force
              } else {
                Write-Warning "Bloat folder missing: $src"
              }
            }
          }

          $devDisp = "${{ inputs.device }}"
          $ftype   = "${{ inputs.flasher_type }}"
          $region  = "${{ inputs.region }}"

          $dev = switch ($devDisp) {
            'Oneplus 13'  { '13' }
            'Oneplus 13R' { '13R' }
            'Oneplus 13S' { '13S' }
            'Oneplus 13T' { '13T' }
          }

          $workDir = Join-Path $env:GITHUB_WORKSPACE "workdir"
          if (Test-Path $workDir) { Remove-Item $workDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null

          # Common paths
          $tplSuper    = Join-Path $env:GITHUB_WORKSPACE ("flasher_scripts\" + $dev + "\oos\super")
          $tplRegional = Join-Path $env:GITHUB_WORKSPACE ("flasher_scripts\" + $dev + "\oos\regional")
          $tplCosSuper = Join-Path $env:GITHUB_WORKSPACE ("flasher_scripts\" + $dev + "\cos\super")
          $tplCosReg   = Join-Path $env:GITHUB_WORKSPACE ("flasher_scripts\" + $dev + "\cos\regional")

          $superPacker = Join-Path $env:GITHUB_WORKSPACE ("super_packers\" + $dev)
          $bloatBase   = Join-Path $env:GITHUB_WORKSPACE ("bloat\" + $dev)
          $buildScripts= Join-Path $env:GITHUB_WORKSPACE ("build_scripts\" + $dev)
          $otaripper   = Join-Path $env:GITHUB_WORKSPACE "otaripper\otaripper.exe"
          $platform    = Join-Path $env:GITHUB_WORKSPACE "platform-tools"

          # FIXED: lpmake.exe and cygwin1.dll always from top-level lpmake/
          $lpmakeExe   = Join-Path $env:GITHUB_WORKSPACE "lpmake\lpmake.exe"
          $cygwinDll   = Join-Path $env:GITHUB_WORKSPACE "lpmake\cygwin1.dll"

          # ---------------- SUPER ----------------
          if ($ftype -in @('SuperHybrid Flasher','SuperHybrid SunOS Flasher','Super Flasher')) {
            if ($region -eq 'CN' -and $dev -eq '13') {
              $flasherFolderName = 'SuperHybrid Flasher CN'
              $flasherDir = Join-Path $workDir $flasherFolderName
              Copy-Item $tplCosSuper -Destination $flasherDir -Recurse -Force
              if (Test-Path $platform) { Copy-Item $platform -Destination $flasherDir -Recurse -Force }

              $superDir = Join-Path $flasherDir "Super"
              New-Item -ItemType Directory -Force -Path $superDir | Out-Null
              Copy-Item $lpmakeExe -Destination $superDir -Force
              Copy-Item $cygwinDll -Destination $superDir -Force
              Copy-Item (Join-Path $superPacker "super_cos.bat") -Destination $superDir -Force
              Copy-Bloat -base $bloatBase -regionCode 'CN' -dest $superDir

              $oosDir = Join-Path $flasherDir "OOS_FILES_HERE"
              New-Item -ItemType Directory -Force -Path $oosDir | Out-Null
              Copy-Bloat -base $bloatBase -regionCode 'GLO' -dest $oosDir

              Copy-Item (Join-Path $buildScripts 'SUPERHYBRID_CN_FULL_SUPERBUILD.bat') -Destination $workDir -Force
              Copy-Item $otaripper -Destination $workDir -Force
            }
            elseif ($dev -eq '13R' -and $region -eq 'CN') {
              $flasherFolderName = 'Super Flasher CN'
              $flasherDir = Join-Path $workDir $flasherFolderName
              Copy-Item $tplSuper -Destination $flasherDir -Recurse -Force
              if (Test-Path $platform) { Copy-Item $platform -Destination $flasherDir -Recurse -Force }

              $superDir = Join-Path $flasherDir "Super"
              New-Item -ItemType Directory -Force -Path $superDir | Out-Null
              Copy-Item $lpmakeExe -Destination $superDir -Force
              Copy-Item $cygwinDll -Destination $superDir -Force
              Copy-Item (Join-Path $superPacker "super_cos.bat") -Destination $superDir -Force
              Copy-Bloat -base $bloatBase -regionCode 'CN' -dest $superDir

              $oosDir = Join-Path $flasherDir "OOS_FILES_HERE"
              New-Item -ItemType Directory -Force -Path $oosDir | Out-Null
              Copy-Bloat -base $bloatBase -regionCode 'A5' -dest $oosDir

              Copy-Item (Join-Path $buildScripts 'SUPER_CN_FULL_SUPERBUILD.bat') -Destination $workDir -Force
              Copy-Item $otaripper -Destination $workDir -Force
            }
            else {
              $flasherFolderName = if ($ftype -eq 'Super Flasher') { 'Super Flasher' } else { 'SuperHybrid Flasher' }
              $flasherDir = Join-Path $workDir $flasherFolderName
              Copy-Item $tplSuper -Destination $flasherDir -Recurse -Force
              if (Test-Path $platform) { Copy-Item $platform -Destination $flasherDir -Recurse -Force }

              $superDir = Join-Path $flasherDir "Super"
              New-Item -ItemType Directory -Force -Path $superDir | Out-Null
              Copy-Item $lpmakeExe -Destination $superDir -Force
              Copy-Item $cygwinDll -Destination $superDir -Force
              Copy-Item (Join-Path $superPacker "super_oos.bat") -Destination $superDir -Force
              Copy-Bloat -base $bloatBase -regionCode $region -dest $superDir

              Copy-Item (Join-Path $buildScripts 'SUPERHYBRID_FULL_SUPERBUILD.bat') -Destination $workDir -Force
              Copy-Item $otaripper -Destination $workDir -Force
            }
          }

          # ---------------- REGIONAL ----------------
          elseif ($ftype -in @('RegionalHybrid Flasher','Regional Flasher')) {
            if ($region -eq 'CN' -and $dev -eq '13') {
              $flasherFolderName = 'RegionalHybrid Flasher CN'
              $flasherDir = Join-Path $workDir $flasherFolderName
              Copy-Item $tplCosReg -Destination $flasherDir -Recurse -Force
              if (Test-Path $platform) { Copy-Item $platform -Destination $flasherDir -Recurse -Force }

              $cosDir = Join-Path $flasherDir "COS_FILES_HERE"
              New-Item -ItemType Directory -Force -Path $cosDir | Out-Null
              Copy-Bloat -base $bloatBase -regionCode 'CN' -dest $cosDir

              $oosDir = Join-Path $flasherDir "OOS_FILES_HERE"
              New-Item -ItemType Directory -Force -Path $oosDir | Out-Null
              Copy-Bloat -base $bloatBase -regionCode 'GLO' -dest $oosDir

              Copy-Item (Join-Path $buildScripts 'REGIONALHYBRID_CN_FULL_BUILD.bat') -Destination $workDir -Force
              Copy-Item $otaripper -Destination $workDir -Force
            }
            elseif ($dev -eq '13R' -and $region -eq 'CN') {
              $flasherFolderName = 'Regional Flasher CN'
              $flasherDir = Join-Path $workDir $flasherFolderName
              Copy-Item $tplRegional -Destination $flasherDir -Recurse -Force
              if (Test-Path $platform) { Copy-Item $platform -Destination $flasherDir -Recurse -Force }

              $cosDir = Join-Path $flasherDir "COS_FILES_HERE"
              New-Item -ItemType Directory -Force -Path $cosDir | Out-Null
              Copy-Bloat -base $bloatBase -regionCode 'CN' -dest $cosDir

              $oosDir = Join-Path $flasherDir "OOS_FILES_HERE"
              New-Item -ItemType Directory -Force -Path $oosDir | Out-Null
              Copy-Bloat -base $bloatBase -regionCode 'A5' -dest $oosDir

              Copy-Item (Join-Path $buildScripts 'REGIONAL_CN_FULL_BUILD.bat') -Destination $workDir -Force
              Copy-Item $otaripper -Destination $workDir -Force
            }
            else {
              $flasherFolderName = if ($ftype -eq 'Regional Flasher') { 'Regional Flasher' } else { 'RegionalHybrid Flasher' }
              $flasherDir = Join-Path $workDir $flasherFolderName
              Copy-Item $tplRegional -Destination $flasherDir -Recurse -Force
              if (Test-Path $platform) { Copy-Item $platform -Destination $flasherDir -Recurse -Force }

              $oosDir = Join-Path $flasherDir "OOS_FILES_HERE"
              New-Item -ItemType Directory -Force -Path $oosDir | Out-Null
              Copy-Bloat -base $bloatBase -regionCode $region -dest $oosDir

              Copy-Item (Join-Path $buildScripts 'REGIONALHYBRID_FULL_BUILD.bat') -Destination $workDir -Force
              Copy-Item $otaripper -Destination $workDir -Force
            }
          }

      - name: Zip staged flasher
        shell: pwsh
        run: |
          $devName   = "${{ inputs.device }}".Replace(' ','')
          $ftypeName = "${{ inputs.flasher_type }}".Replace(' ','')
          $region    = "${{ inputs.region }}"
          $ts        = Get-Date -Format "yyyyMMdd-HHmmss"
          $artifact  = "$devName-$ftypeName-$region-$ts"
          $zip = "$artifact.zip"
          Compress-Archive -Path "workdir\*" -DestinationPath $zip -Force
          "ARTIFACT_NAME=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_FILE=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
