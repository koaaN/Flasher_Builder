name: Build Flasher (layout-only, SuperHybrid + RegionalHybrid)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Stage Layout • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prep OTA (download or placeholder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "download","$env:OUT_DIR" | Out-Null
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            Set-Content -Path "download\PLACEHOLDER.txt" -Value "Placeholder OTA for dry-run"
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\OTA.zip" -Force
          } else {
            $name = Split-Path $url -Leaf
            if ([string]::IsNullOrWhiteSpace($name)) { $name = "OTA.zip" }
            $dst = "download\$name"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            if ($name -ne "OTA.zip") {
              if (Test-Path "download\OTA.zip") { Remove-Item "download\OTA.zip" -Force }
              Rename-Item -Path $dst -NewName "OTA.zip"
            }
          }
          "OTA_PATH=$(Resolve-Path 'download\OTA.zip')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Map device and repo paths
        shell: pwsh
        run: |
          $devDisp = "${{ inputs.device }}"
          $dev = switch ($devDisp) {
            'Oneplus 13'  { '13'  }
            'Oneplus 13R' { '13R' }
            'Oneplus 13S' { '13S' }
            'Oneplus 13T' { '13T' }
            default { throw "Unknown device: $devDisp" }
          }

          $root = $env:GITHUB_WORKSPACE

          # Templates
          $tplSuper    = Join-Path $root ("flasher_scripts\" + $dev + "\oos\super")
          $tplRegional = Join-Path $root ("flasher_scripts\" + $dev + "\oos\regional")

          # Pack/Build & tools
          $superPackers = Join-Path $root ("super_packers\" + $dev)  # super_oos.bat, super_cos.bat, super_sunos.bat
          $buildScripts = Join-Path $root ("build_scripts\" + $dev)  # *_FULL_*.bat
          $lpmakeDir    = Join-Path $root "lpmake"
          $platTools    = Join-Path $root "platform-tools"
          $otaripperExe = Join-Path $root "otaripper\otaripper.exe"

          # Bloat dirs
          $bloatEUGLO = Join-Path $root ("bloat\" + $dev + "\EUGLO_BLOAT")
          $bloatIN    = Join-Path $root ("bloat\" + $dev + "\IN_BLOAT")
          $bloatNA    = Join-Path $root ("bloat\" + $dev + "\NA_BLOAT")
          $bloatCN    = Join-Path $root ("bloat\" + $dev + "\CN_BLOAT") # optional

          if (!(Test-Path $tplSuper))    { Write-Host "Note: Super template not found at $tplSuper (only needed for SuperHybrid)." }
          if (!(Test-Path $tplRegional)) { Write-Host "Note: Regional template not found at $tplRegional (only needed for RegionalHybrid)." }
          if (!(Test-Path $buildScripts)) { throw "Missing build_scripts: $buildScripts" }

          "DEV_FOLDER=$dev"                 | Out-File -FilePath $env:GITHUB_ENV -Append
          "TPL_SUPER=$tplSuper"             | Out-File -FilePath $env:GITHUB_ENV -Append
          "TPL_REGIONAL=$tplRegional"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "SUPER_PACKERS=$superPackers"     | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILD_SCRIPTS=$buildScripts"     | Out-File -FilePath $env:GITHUB_ENV -Append
          "LPMAKE_DIR=$lpmakeDir"           | Out-File -FilePath $env:GITHUB_ENV -Append
          "PLATFORM_TOOLS=$platTools"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTARIPPER_EXE=$otaripperExe"     | Out-File -FilePath $env:GITHUB_ENV -Append
          "BLOAT_EUGLO=$bloatEUGLO"         | Out-File -FilePath $env:GITHUB_ENV -Append
          "BLOAT_IN=$bloatIN"               | Out-File -FilePath $env:GITHUB_ENV -Append
          "BLOAT_NA=$bloatNA"               | Out-File -FilePath $env:GITHUB_ENV -Append
          "BLOAT_CN=$bloatCN"               | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage working dir (layout only)
        shell: pwsh
        run: |
          $workDir = Join-Path $env:OUT_DIR "work"
          if (Test-Path $workDir) { Remove-Item $workDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null

          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"

          if ($ftype -eq 'SuperHybrid Flasher' -or $ftype -eq 'SuperHybrid SunOS Flasher') {
            # ---------- SuperHybrid ----------
            if (!(Test-Path $env:TPL_SUPER)) { throw "SuperHybrid template missing: $env:TPL_SUPER" }

            $flasherDir = Join-Path $workDir "SuperHybrid Flasher"
            New-Item -ItemType Directory -Force -Path $flasherDir | Out-Null

            # Copy template contents (16DTBO, META-INF, Super_Flasher.bat, dtbo_patcher.bat)
            Copy-Item (Join-Path $env:TPL_SUPER '*') -Destination $flasherDir -Recurse -Force

            # platform-tools (optional)
            if (Test-Path $env:PLATFORM_TOOLS) {
              Copy-Item $env:PLATFORM_TOOLS -Destination $flasherDir -Recurse -Force
            }

            # Super/ folder with lpmake + cygwin1 + packer
            $superSub = Join-Path $flasherDir "Super"
            New-Item -ItemType Directory -Force -Path $superSub | Out-Null

            function Copy-Lpmake-Bits {
              param([string]$base)
              $lm = Get-ChildItem -Path $base -Recurse -Filter "lpmake.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              $cy = Get-ChildItem -Path $base -Recurse -Filter "cygwin1.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($lm) { Copy-Item $lm.FullName -Destination $superSub -Force }
              if ($cy) { Copy-Item $cy.FullName -Destination $superSub -Force }
            }

            if (Test-Path $env:LPMAKE_DIR) { Copy-Lpmake-Bits -base $env:LPMAKE_DIR }
            if (!(Test-Path (Join-Path $superSub "lpmake.exe"))) { Copy-Lpmake-Bits -base $env:GITHUB_WORKSPACE }
            if (!(Test-Path (Join-Path $superSub "lpmake.exe"))) { throw "lpmake.exe not found" }
            if (!(Test-Path (Join-Path $superSub "cygwin1.dll"))) { throw "cygwin1.dll not found" }

            # Choose packer
            if ($ftype -eq 'SuperHybrid SunOS Flasher') {
              $packer = 'super_sunos.bat'
            } elseif ($region -eq 'CN') {
              $packer = 'super_cos.bat'
            } else {
              $packer = 'super_oos.bat'
            }
            $packerPath = Join-Path $env:SUPER_PACKERS $packer
            if (!(Test-Path $packerPath)) { throw "Missing packer: $packerPath" }
            Copy-Item $packerPath -Destination $superSub -Force

            # EU/GLO bloat goes into Super/
            if ($region -in @('EU','GLO')) {
              if (!(Test-Path $env:BLOAT_EUGLO)) { throw "Missing EUGLO_BLOAT: $env:BLOAT_EUGLO" }
              Copy-Item (Join-Path $env:BLOAT_EUGLO 'my_preload.img') -Destination $superSub -Force
              Copy-Item (Join-Path $env:BLOAT_EUGLO 'my_company.img') -Destination $superSub -Force
            } elseif ($region -eq 'IN' -and (Test-Path $env:BLOAT_IN)) {
              Copy-Item (Join-Path $env:BLOAT_IN 'my_preload.img') -Destination $superSub -Force -ErrorAction SilentlyContinue
              Copy-Item (Join-Path $env:BLOAT_IN 'my_company.img') -Destination $superSub -Force -ErrorAction SilentlyContinue
            } elseif ($region -eq 'NA' -and (Test-Path $env:BLOAT_NA)) {
              Copy-Item (Join-Path $env:BLOAT_NA 'my_preload.img') -Destination $superSub -Force -ErrorAction SilentlyContinue
              Copy-Item (Join-Path $env:BLOAT_NA 'my_company.img') -Destination $superSub -Force -ErrorAction SilentlyContinue
            } elseif ($region -eq 'CN' -and (Test-Path $env:BLOAT_CN)) {
              Copy-Item (Join-Path $env:BLOAT_CN 'my_preload.img') -Destination $superSub -Force -ErrorAction SilentlyContinue
              Copy-Item (Join-Path $env:BLOAT_CN 'my_company.img') -Destination $superSub -Force -ErrorAction SilentlyContinue
            }

            # Builder outside folder
            $builder = if ($ftype -eq 'SuperHybrid SunOS Flasher') {
              'SUPERHYBRID_SUNOS_FULL_SUPERBUILD.bat'
            } elseif ($region -eq 'CN') {
              'SUPERHYBRID_CN_FULL_SUPERBUILD.bat'
            } else {
              'SUPERHYBRID_FULL_SUPERBUILD.bat'
            }
            $builderPath = Join-Path $env:BUILD_SCRIPTS $builder
            if (!(Test-Path $builderPath)) { throw "Missing builder: $builderPath" }
            Copy-Item $builderPath -Destination $workDir -Force

            # optional tools next to builder
            if (Test-Path $env:OTARIPPER_EXE) { Copy-Item $env:OTARIPPER_EXE -Destination $workDir -Force }

            "FLASHER_DIR=$flasherDir" | Out-File -FilePath $env:GITHUB_ENV -Append

          } elseif ($ftype -eq 'RegionalHybrid Flasher') {
            # ---------- RegionalHybrid ----------
            if (!(Test-Path $env:TPL_REGIONAL)) { throw "Regional template missing: $env:TPL_REGIONAL" }

            $flasherDir = Join-Path $workDir "RegionalHybrid Flasher"
            New-Item -ItemType Directory -Force -Path $flasherDir | Out-Null

            # Copy template contents (contains META-INF/com/google/android + Regional_Flasher.bat)
            Copy-Item (Join-Path $env:TPL_REGIONAL '*') -Destination $flasherDir -Recurse -Force

            # platform-tools into flasher folder (optional)
            if (Test-Path $env:PLATFORM_TOOLS) {
              Copy-Item $env:PLATFORM_TOOLS -Destination $flasherDir -Recurse -Force
            }

            # Create OOS_FILES_HERE and place region bloat there (NOT in Super)
            $oosDir = Join-Path $flasherDir "OOS_FILES_HERE"
            New-Item -ItemType Directory -Force -Path $oosDir | Out-Null

            if ($region -in @('EU','GLO')) {
              if (!(Test-Path $env:BLOAT_EUGLO)) { throw "Missing EUGLO_BLOAT: $env:BLOAT_EUGLO" }
              Copy-Item (Join-Path $env:BLOAT_EUGLO 'my_preload.img') -Destination $oosDir -Force
              Copy-Item (Join-Path $env:BLOAT_EUGLO 'my_company.img') -Destination $oosDir -Force
            } elseif ($region -eq 'IN' -and (Test-Path $env:BLOAT_IN)) {
              Copy-Item (Join-Path $env:BLOAT_IN 'my_preload.img') -Destination $oosDir -Force -ErrorAction SilentlyContinue
              Copy-Item (Join-Path $env:BLOAT_IN 'my_company.img') -Destination $oosDir -Force -ErrorAction SilentlyContinue
            } elseif ($region -eq 'NA' -and (Test-Path $env:BLOAT_NA)) {
              Copy-Item (Join-Path $env:BLOAT_NA 'my_preload.img') -Destination $oosDir -Force -ErrorAction SilentlyContinue
              Copy-Item (Join-Path $env:BLOAT_NA 'my_company.img') -Destination $oosDir -Force -ErrorAction SilentlyContinue
            } elseif ($region -eq 'CN' -and (Test-Path $env:BLOAT_CN)) {
              Copy-Item (Join-Path $env:BLOAT_CN 'my_preload.img') -Destination $oosDir -Force -ErrorAction SilentlyContinue
              Copy-Item (Join-Path $env:BLOAT_CN 'my_company.img') -Destination $oosDir -Force -ErrorAction SilentlyContinue
            }

            # Builder outside folder (one name per your instruction)
            $builderName = 'REGIONALHYBRID_FULL_BUILD.bat'
            # If you later add a CN-specific builder, uncomment the next two lines:
            # if ($region -eq 'CN' -and (Test-Path (Join-Path $env:BUILD_SCRIPTS 'REGIONALHYBRID_CN_FULL_BUILD.bat'))) {
            #   $builderName = 'REGIONALHYBRID_CN_FULL_BUILD.bat'
            # }
            $builderPath = Join-Path $env:BUILD_SCRIPTS $builderName
            if (!(Test-Path $builderPath)) { throw "Missing builder: $builderPath" }
            Copy-Item $builderPath -Destination $workDir -Force

            if (Test-Path $env:OTARIPPER_EXE) { Copy-Item $env:OTARIPPER_EXE -Destination $workDir -Force }

            "FLASHER_DIR=$flasherDir" | Out-File -FilePath $env:GITHUB_ENV -Append

          } else {
            throw "Unknown flasher type: $ftype"
          }

          "WORK_DIR=$workDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Layout-only: do not run any .bat scripts

      - name: Zip working directory (includes flasher folder + outer files)
        shell: pwsh
        run: |
          $workDir = $env:WORK_DIR
          if (!(Test-Path $workDir)) { throw "Working dir not found: $workDir" }
          Write-Host "Staged structure:"
          Get-ChildItem -LiteralPath $workDir -Recurse | ForEach-Object { $_.FullName }

          $devName   = "${{ inputs.device }}".Replace(' ','')
          $ftypeName = "${{ inputs.flasher_type }}".Replace(' ','')
          $region    = "${{ inputs.region }}"
          $ts        = Get-Date -Format "yyyyMMdd-HHmmss"
          $artifact  = "$devName-$ftypeName-$region-LAYOUT-$ts"
          "ARTIFACT_NAME=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append

          $zip = "$artifact.zip"
          Compress-Archive -Path "$workDir\*" -DestinationPath $zip -Force
          "ZIP_FILE=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
