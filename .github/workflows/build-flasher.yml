name: Build Android Flasher from OTA

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: "Paste the FULL OTA.zip URL here (leave empty to dry-run)"
        type: string
        required: false
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
          - Super Flasher
          - Regional Flasher
      region:
        description: "Region (choose NONE only for 'SuperHybrid SunOS Flasher')"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
          - NONE
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - Artifact on GitHub

jobs:
  build:
    name: Build Flasher
    runs-on: windows-latest

    steps:
      - name: Checkout repository into src/
        uses: actions/checkout@v4
        with:
          path: src

      - name: Setup environment
        shell: pwsh
        run: |
          choco install -y aria2 7zip
          mkdir download,out | Out-Null
          $url = "${{ inputs.ota_url }}"
          if ([string]::IsNullOrWhiteSpace($url)) {
            "USE_PLACEHOLDER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "USE_PLACEHOLDER=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Download or use placeholder OTA.zip
        shell: pwsh
        run: |
          if ($env:USE_PLACEHOLDER -eq '1') {
            $note = "Placeholder OTA for dry-run"
            Set-Content -Path "download\PLACEHOLDER.txt" -Value $note
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\ota-placeholder.zip" -Force
            "OTAFILE=download\ota-placeholder.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            $url = "${{ inputs.ota_url }}"
            $filename = Split-Path $url -Leaf
            aria2c -x16 -s16 -k1M -o "$filename" -d "download" "$url"
            "OTAFILE=download\$filename" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Derive build metadata
        shell: pwsh
        run: |
          $device = "${{ inputs.device }}"
          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"
          $ver = Get-Date -Format "yyyyMMdd-HHmmss"
          $regionTag = if ($region -eq 'NONE') { "" } else { "-$region" }

          $name = "$($device.Replace(' ','')).$($ftype.Replace(' ',''))$regionTag-$ver"
          "DEVICE=$device"             | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE=$ftype"               | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION=$region"             | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$ver"               | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILD_NAME=$name"           | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILD_DIR=out\$name"        | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage flasher files (Oneplus 13 + SuperHybrid Flasher + GLO)
        shell: pwsh
        run: |
          $d = "$env:DEVICE"
          $t = "$env:FTYPE"
          $r = "$env:REGION"
          $out = "$env:BUILD_DIR"
          mkdir $out -Force | Out-Null
          Copy-Item $env:OTAFILE -Destination "$out\OTA.zip"

          if ($d -eq 'Oneplus 13' -and $t -eq 'SuperHybrid Flasher' -and $r -eq 'GLO') {
            $src = "$env:GITHUB_WORKSPACE\src"
            $superFs = "$src\flasher_scripts\13\oos\super"
            $superPack = "$src\super_packers\13"
            $lpmake = "$src\lpmake"

            $destMain = Join-Path $out "Super Hybrid Flasher"
            $destSuper = Join-Path $destMain "Super"
            mkdir $destMain, $destSuper -Force | Out-Null

            Copy-Item "$superFs\META-INF" -Destination $destMain -Recurse -Force
            Copy-Item "$superFs\dtbo_patcher.bat", "$superFs\Super.Flasher.bat" -Destination $destMain -Force
            Copy-Item "$superPack\super_oos.bat" -Destination $destSuper -Force
            Copy-Item "$lpmake\cygwin1.dll", "$lpmake\lpmake.exe" -Destination $destSuper -Force
          }

      - name: Archive flasher ZIP
        shell: pwsh
        run: |
          7z a -tzip "$env:BUILD_NAME.zip" "$env:BUILD_DIR\*" | Out-Null
          "ZIP_NAME=$env:BUILD_NAME.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to GitHub artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: ${{ env.ZIP_NAME }}
