name: Build Flasher (layout-only; 13 + 13R with CN rules)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
          - Super Flasher
          - Regional Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Stage Layout • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prep OTA (download or placeholder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "download","$env:OUT_DIR" | Out-Null
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            Set-Content -Path "download\PLACEHOLDER.txt" -Value "Placeholder OTA for dry-run"
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\OTA.zip" -Force
          } else {
            $name = Split-Path $url -Leaf
            if ([string]::IsNullOrWhiteSpace($name)) { $name = "OTA.zip" }
            $dst = "download\$name"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            if ($name -ne "OTA.zip") {
              if (Test-Path "download\OTA.zip") { Remove-Item "download\OTA.zip" -Force }
              Rename-Item -Path $dst -NewName "OTA.zip"
            }
          }
          "OTA_PATH=$(Resolve-Path 'download\OTA.zip')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Map device and repo paths
        shell: pwsh
        run: |
          $devDisp = "${{ inputs.device }}"
          $dev = switch ($devDisp) {
            'Oneplus 13'  { '13'  }
            'Oneplus 13R' { '13R' }
            'Oneplus 13S' { '13S' }
            'Oneplus 13T' { '13T' }
            default { throw "Unknown device: $devDisp" }
          }

          $root = $env:GITHUB_WORKSPACE

          # templates
          $tpl13Super    = Join-Path $root ("flasher_scripts\13\oos\super")
          $tpl13Regional = Join-Path $root ("flasher_scripts\13\oos\regional")
          $tpl13RSuperOOS    = Join-Path $root ("flasher_scripts\13R\oos\super")
          $tpl13RRegionalOOS = Join-Path $root ("flasher_scripts\13R\oos\regional")
          $tpl13RSuperCOS    = Join-Path $root ("flasher_scripts\13R\cos\super")
          $tpl13RRegionalCOS = Join-Path $root ("flasher_scripts\13R\cos\regional")

          # packers, build scripts, bloat
          $superPackers13  = Join-Path $root "super_packers\13"
          $superPackers13R = Join-Path $root "super_packers\13R"
          $build13   = Join-Path $root "build_scripts\13"
          $build13R  = Join-Path $root "build_scripts\13R"
          $bloatBase13  = Join-Path $root "bloat\13"
          $bloatBase13R = Join-Path $root "bloat\13R"

          # shared
          $lpmakeDir    = Join-Path $root "lpmake"
          $platTools    = Join-Path $root "platform-tools"
          $otaripperExe = Join-Path $root "otaripper\otaripper.exe"

          "DEV_FOLDER=$dev"              | Out-File -FilePath $env:GITHUB_ENV -Append
          "LPMAKE_DIR=$lpmakeDir"        | Out-File -FilePath $env:GITHUB_ENV -Append
          "PLATFORM_TOOLS=$platTools"    | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTARIPPER_EXE=$otaripperExe"  | Out-File -FilePath $env:GITHUB_ENV -Append

          if ($dev -eq '13R') {
            "TPL_SUPER_OOS=$tpl13RSuperOOS"       | Out-File -FilePath $env:GITHUB_ENV -Append
            "TPL_REGIONAL_OOS=$tpl13RRegionalOOS" | Out-File -FilePath $env:GITHUB_ENV -Append
            "TPL_SUPER_COS=$tpl13RSuperCOS"       | Out-File -FilePath $env:GITHUB_ENV -Append
            "TPL_REGIONAL_COS=$tpl13RRegionalCOS" | Out-File -FilePath $env:GITHUB_ENV -Append
            "SUPER_PACKERS=$superPackers13R"      | Out-File -FilePath $env:GITHUB_ENV -Append
            "BUILD_SCRIPTS=$build13R"             | Out-File -FilePath $env:GITHUB_ENV -Append
            "BLOAT_BASE=$bloatBase13R"            | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "TPL_SUPER_OOS=$tpl13Super"           | Out-File -FilePath $env:GITHUB_ENV -Append
            "TPL_REGIONAL_OOS=$tpl13Regional"     | Out-File -FilePath $env:GITHUB_ENV -Append
            "TPL_SUPER_COS=$tpl13Super"           | Out-File -FilePath $env:GITHUB_ENV -Append
            "TPL_REGIONAL_COS=$tpl13Regional"     | Out-File -FilePath $env:GITHUB_ENV -Append
            "SUPER_PACKERS=$superPackers13"       | Out-File -FilePath $env:GITHUB_ENV -Append
            "BUILD_SCRIPTS=$build13"              | Out-File -FilePath $env:GITHUB_ENV -Append
            "BLOAT_BASE=$bloatBase13"             | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Stage working dir (layout only)
        shell: pwsh
        run: |
          $workDir = Join-Path $env:OUT_DIR "work"
          if (Test-Path $workDir) { Remove-Item $workDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null

          $dev    = $env:DEV_FOLDER
          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"

          function Copy-Lpmake-Bits {
            param([string]$dest)
            $lm = Get-ChildItem -Path $env:LPMAKE_DIR -Recurse -Filter "lpmake.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            $cy = Get-ChildItem -Path $env:LPMAKE_DIR -Recurse -Filter "cygwin1.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $lm) { $lm = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "lpmake.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
            if (-not $cy) { $cy = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "cygwin1.dll" -ErrorAction SilentlyContinue | Select-Object -First 1 }
            if (-not $lm) { throw "lpmake.exe not found anywhere in repo" }
            if (-not $cy) { throw "cygwin1.dll not found anywhere in repo" }
            Copy-Item $lm.FullName -Destination $dest -Force
            Copy-Item $cy.FullName -Destination $dest -Force
          }

          function Copy-Bloat {
            param([string]$base, [string]$regionCode, [string]$dest)
            $map = @{
              'GLO' = 'EUGLO_BLOAT'
              'EU'  = 'EUGLO_BLOAT'
              'IN'  = 'IN_BLOAT'
              'NA'  = 'NA_BLOAT'
              'CN'  = 'CN_BLOAT'
            }
            if (-not $map.ContainsKey($regionCode)) { return }
            $dir = Join-Path $base $map[$regionCode]
            if (!(Test-Path $dir)) {
              if ($regionCode -in @('IN','NA','CN')) { Write-Host "Bloat dir missing (skipping): $dir"; return }
              throw "Missing bloat dir: $dir"
            }
            $pre = Join-Path $dir "my_preload.img"
            $com = Join-Path $dir "my_company.img"
            if (Test-Path $pre) { Copy-Item $pre -Destination $dest -Force }
            if (Test-Path $com) { Copy-Item $com -Destination $dest -Force }
          }

          $tplSuper    = if ($region -eq 'CN') { $env:TPL_SUPER_COS } else { $env:TPL_SUPER_OOS }
          $tplRegional = if ($region -eq 'CN') { $env:TPL_REGIONAL_COS } else { $env:TPL_REGIONAL_OOS }

          # ---------------- SUPER ----------------
          if ($ftype -in @('SuperHybrid Flasher','SuperHybrid SunOS Flasher','Super Flasher')) {
            if (!(Test-Path $tplSuper)) { throw "Super template missing: $tplSuper" }

            # folder name logic
            if ($region -eq 'CN') {
              $flasherFolderName = 'Super Flasher CN'
            } elseif ($ftype -eq 'Super Flasher') {
              $flasherFolderName = 'Super Flasher'
            } else {
              $flasherFolderName = 'SuperHybrid Flasher'
            }

            $flasherDir = Join-Path $workDir $flasherFolderName
            New-Item -ItemType Directory -Force -Path $flasherDir | Out-Null
            Copy-Item (Join-Path $tplSuper '*') -Destination $flasherDir -Recurse -Force
            if (Test-Path $env:PLATFORM_TOOLS) { Copy-Item $env:PLATFORM_TOOLS -Destination $flasherDir -Recurse -Force }

            $superSub = Join-Path $flasherDir "Super"
            New-Item -ItemType Directory -Force -Path $superSub | Out-Null
            Copy-Lpmake-Bits -dest $superSub

            # pick packer
            if ($dev -eq '13R' -and $region -eq 'CN') {
              $packerName = 'super_cos.bat'
            } elseif ($dev -eq '13R') {
              $packerName = 'super_oos.bat'
            } elseif ($ftype -eq 'SuperHybrid SunOS Flasher') {
              $packerName = 'super_sunos.bat'
            } elseif ($region -eq 'CN') {
              $packerName = 'super_cos.bat'
            } else {
              $packerName = 'super_oos.bat'
            }
            $packerPath = Join-Path $env:SUPER_PACKERS $packerName
            Copy-Item $packerPath -Destination $superSub -Force

            Copy-Bloat -base $env:BLOAT_BASE -regionCode $region -dest $superSub

            # builders
            if ($dev -eq '13R' -and $region -eq 'CN') {
              $builderList = @('SUPER_CN_FULL_SUPERBUILD.bat')
            } else {
              $builderList = @('SUPERHYBRID_FULL_SUPERBUILD.bat','SUPERHYBRID_CN_FULL_SUPERBUILD.bat','SUPERHYBRID_SUNOS_FULL_SUPERBUILD.bat')
            }
            foreach ($b in $builderList) {
              $bp = Join-Path $env:BUILD_SCRIPTS $b
              if (Test-Path $bp) { Copy-Item $bp -Destination $workDir -Force }
            }

            if (Test-Path $env:OTARIPPER_EXE) { Copy-Item $env:OTARIPPER_EXE -Destination $workDir -Force }
          }

          # ---------------- REGIONAL ----------------
          elseif ($ftype -in @('RegionalHybrid Flasher','Regional Flasher')) {
            if (!(Test-Path $tplRegional)) { throw "Regional template missing: $tplRegional" }

            if ($region -eq 'CN') {
              $flasherFolderName = 'Regional Flasher CN'
            } elseif ($ftype -eq 'Regional Flasher') {
              $flasherFolderName = 'Regional Flasher'
            } else {
              $flasherFolderName = 'RegionalHybrid Flasher'
            }

            $flasherDir = Join-Path $workDir $flasherFolderName
            New-Item -ItemType Directory -Force -Path $flasherDir | Out-Null
            Copy-Item (Join-Path $tplRegional '*') -Destination $flasherDir -Recurse -Force
            if (Test-Path $env:PLATFORM_TOOLS) { Copy-Item $env:PLATFORM_TOOLS -Destination $flasherDir -Recurse -Force }

            $oosDir = Join-Path $flasherDir "OOS_FILES_HERE"
            New-Item -ItemType Directory -Force -Path $oosDir | Out-Null
            Copy-Bloat -base $env:BLOAT_BASE -regionCode $region -dest $oosDir

            if ($dev -eq '13R' -and $region -eq 'CN') {
              $builderList = @('REGIONAL_CN_FULL_BUILD.bat')
            } else {
              $builderList = @('REGIONALHYBRID_FULL_BUILD.bat','REGIONALHYBRID_CN_FULL_BUILD.bat')
            }
            foreach ($b in $builderList) {
              $bp = Join-Path $env:BUILD_SCRIPTS $b
              if (Test-Path $bp) { Copy-Item $bp -Destination $workDir -Force }
            }

            if (Test-Path $env:OTARIPPER_EXE) { Copy-Item $env:OTARIPPER_EXE -Destination $workDir -Force }
          }
          else {
            throw "Unknown flasher type: $ftype"
          }

          "WORK_DIR=$workDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Zip working directory (layout only)
        shell: pwsh
        run: |
          $workDir = $env:WORK_DIR
          Write-Host "Staged structure:"
          Get-ChildItem -LiteralPath $workDir -Recurse | ForEach-Object { $_.FullName }
          $devName   = "${{ inputs.device }}".Replace(' ','')
          $ftypeName = "${{ inputs.flasher_type }}".Replace(' ','')
          $region    = "${{ inputs.region }}"
          $ts        = Get-Date -Format "yyyyMMdd-HHmmss"
          $artifact  = "$devName-$ftypeName-$region-LAYOUT-$ts"
          "ARTIFACT_NAME=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append
          $zip = "$artifact.zip"
          Compress-Archive -Path "$workDir\*" -DestinationPath $zip -Force
          "ZIP_FILE=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
