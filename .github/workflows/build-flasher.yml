name: Build Flasher (layout-only; 13 + 13R)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
          - Super Flasher
          - Regional Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Stage Layout • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prep OTA (download or placeholder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "download","$env:OUT_DIR" | Out-Null
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            Set-Content -Path "download\PLACEHOLDER.txt" -Value "Placeholder OTA for dry-run"
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\OTA.zip" -Force
          } else {
            $name = Split-Path $url -Leaf
            if ([string]::IsNullOrWhiteSpace($name)) { $name = "OTA.zip" }
            $dst = "download\$name"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            if ($name -ne "OTA.zip") {
              if (Test-Path "download\OTA.zip") { Remove-Item "download\OTA.zip" -Force }
              Rename-Item -Path $dst -NewName "OTA.zip"
            }
          }
          "OTA_PATH=$(Resolve-Path 'download\OTA.zip')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Map device and repo paths
        shell: pwsh
        run: |
          $devDisp = "${{ inputs.device }}"
          $dev = switch ($devDisp) {
            'Oneplus 13'  { '13'  }
            'Oneplus 13R' { '13R' }
            'Oneplus 13S' { '13S' }
            'Oneplus 13T' { '13T' }
            default { throw "Unknown device: $devDisp" }
          }

          $root = $env:GITHUB_WORKSPACE

          # Device-scoped templates
          $tplSuper    = Join-Path $root ("flasher_scripts\" + $dev + "\oos\super")
          $tplRegional = Join-Path $root ("flasher_scripts\" + $dev + "\oos\regional")

          # Device-scoped packers / builders / bloat
          $superPackers = Join-Path $root ("super_packers\" + $dev)   # super_oos.bat, super_cos.bat, super_sunos.bat (13R: super_oos.bat)
          $buildScripts = Join-Path $root ("build_scripts\" + $dev)   # *_FULL_*.bat
          $bloatEUGLO   = Join-Path $root ("bloat\" + $dev + "\EUGLO_BLOAT")
          $bloatIN      = Join-Path $root ("bloat\" + $dev + "\IN_BLOAT")
          $bloatNA      = Join-Path $root ("bloat\" + $dev + "\NA_BLOAT")
          $bloatCN      = Join-Path $root ("bloat\" + $dev + "\CN_BLOAT") # optional

          # Shared tools
          $lpmakeDir    = Join-Path $root "lpmake"          # holds lpmake.exe + cygwin1.dll (or we fallback search)
          $platTools    = Join-Path $root "platform-tools"
          $otaripperExe = Join-Path $root "otaripper\otaripper.exe"

          if (!(Test-Path $buildScripts)) { throw "Missing build_scripts: $buildScripts" }

          "DEV_FOLDER=$dev"                 | Out-File -FilePath $env:GITHUB_ENV -Append
          "TPL_SUPER=$tplSuper"             | Out-File -FilePath $env:GITHUB_ENV -Append
          "TPL_REGIONAL=$tplRegional"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "SUPER_PACKERS=$superPackers"     | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILD_SCRIPTS=$buildScripts"     | Out-File -FilePath $env:GITHUB_ENV -Append
          "LPMAKE_DIR=$lpmakeDir"           | Out-File -FilePath $env:GITHUB_ENV -Append
          "PLATFORM_TOOLS=$platTools"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "OTARIPPER_EXE=$otaripperExe"     | Out-File -FilePath $env:GITHUB_ENV -Append
          "BLOAT_EUGLO=$bloatEUGLO"         | Out-File -FilePath $env:GITHUB_ENV -Append
          "BLOAT_IN=$bloatIN"               | Out-File -FilePath $env:GITHUB_ENV -Append
          "BLOAT_NA=$bloatNA"               | Out-File -FilePath $env:GITHUB_ENV -Append
          "BLOAT_CN=$bloatCN"               | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage working dir (layout only)
        shell: pwsh
        run: |
          $workDir = Join-Path $env:OUT_DIR "work"
          if (Test-Path $workDir) { Remove-Item $workDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null

          $dev    = $env:DEV_FOLDER
          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"

          function Copy-Lpmake-Bits {
            param([string]$dest)
            $lm = Get-ChildItem -Path $env:LPMAKE_DIR -Recurse -Filter "lpmake.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            $cy = Get-ChildItem -Path $env:LPMAKE_DIR -Recurse -Filter "cygwin1.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $lm) { $lm = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "lpmake.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
            if (-not $cy) { $cy = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "cygwin1.dll" -ErrorAction SilentlyContinue | Select-Object -First 1 }
            if (-not $lm) { throw "lpmake.exe not found anywhere in repo" }
            if (-not $cy) { throw "cygwin1.dll not found anywhere in repo" }
            Copy-Item $lm.FullName -Destination $dest -Force
            Copy-Item $cy.FullName -Destination $dest -Force
          }

          function Copy-Bloat {
            param([string]$bloatDir, [string]$dest)
            if (!(Test-Path $bloatDir)) { throw "Missing bloat dir: $bloatDir" }
            Copy-Item (Join-Path $bloatDir "my_preload.img") -Destination $dest -Force
            Copy-Item (Join-Path $bloatDir "my_company.img") -Destination $dest -Force
          }

          # ---------------- SUPER layouts ----------------
          if ($ftype -in @('SuperHybrid Flasher','SuperHybrid SunOS Flasher','Super Flasher')) {
            if (!(Test-Path $env:TPL_SUPER)) { throw "Super template missing: $env:TPL_SUPER" }

            # Folder name by type: 13R wants "Super Flasher"
            $flasherFolderName = if ($ftype -eq 'Super Flasher') { 'Super Flasher' } else { 'SuperHybrid Flasher' }
            $flasherDir = Join-Path $workDir $flasherFolderName
            New-Item -ItemType Directory -Force -Path $flasherDir | Out-Null

            # Copy template contents (contains Super_Flasher*.bat, META-INF, 16DTBO etc.)
            Copy-Item (Join-Path $env:TPL_SUPER '*') -Destination $flasherDir -Recurse -Force

            # Optional platform-tools inside flasher folder
            if (Test-Path $env:PLATFORM_TOOLS) {
              Copy-Item $env:PLATFORM_TOOLS -Destination $flasherDir -Recurse -Force
            }

            # Super/ subtree with lpmake/cygwin + packer
            $superSub = Join-Path $flasherDir "Super"
            New-Item -ItemType Directory -Force -Path $superSub | Out-Null
            Copy-Lpmake-Bits -dest $superSub

            # Packer selection:
            # - 13R Super Flasher uses super_oos.bat from super_packers/13R/
            # - SunOS uses super_sunos.bat (non-13R flow)
            # - CN (hybrid path) uses super_cos.bat
            if ($ftype -eq 'Super Flasher' -and $dev -eq '13R') {
              $packerName = 'super_oos.bat'
            } elseif ($ftype -eq 'SuperHybrid SunOS Flasher') {
              $packerName = 'super_sunos.bat'
            } elseif ($region -eq 'CN') {
              $packerName = 'super_cos.bat'
            } else {
              $packerName = 'super_oos.bat'
            }
            $packerPath = Join-Path $env:SUPER_PACKERS $packerName
            if (!(Test-Path $packerPath)) { throw "Missing packer: $packerPath" }
            Copy-Item $packerPath -Destination $superSub -Force

            # Bloat for SUPER → goes into Super/
            if ($region -in @('EU','GLO')) {
              Copy-Bloat -bloatDir $env:BLOAT_EUGLO -dest $superSub
            } elseif ($region -eq 'IN' -and (Test-Path $env:BLOAT_IN)) {
              Copy-Bloat -bloatDir $env:BLOAT_IN -dest $superSub
            } elseif ($region -eq 'NA' -and (Test-Path $env:BLOAT_NA)) {
              Copy-Bloat -bloatDir $env:BLOAT_NA -dest $superSub
            } elseif ($region -eq 'CN' -and (Test-Path $env:BLOAT_CN)) {
              Copy-Bloat -bloatDir $env:BLOAT_CN -dest $superSub
            }

            # Optional: place a builder outside the flasher folder if present
            # (layout-only run, so the builder is not executed)
            $builderCandidates = @(
              'SUPERHYBRID_FULL_SUPERBUILD.bat',      # common
              'SUPERHYBRID_CN_FULL_SUPERBUILD.bat',   # CN variant
              'SUPERHYBRID_SUNOS_FULL_SUPERBUILD.bat' # SunOS variant
            )
            foreach ($cand in $builderCandidates) {
              $p = Join-Path $env:BUILD_SCRIPTS $cand
              if (Test-Path $p) { Copy-Item $p -Destination $workDir -Force }
            }

            if (Test-Path $env:OTARIPPER_EXE) { Copy-Item $env:OTARIPPER_EXE -Destination $workDir -Force }

            "FLASHER_DIR=$flasherDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          # ---------------- REGIONAL layouts ----------------
          elseif ($ftype -in @('RegionalHybrid Flasher','Regional Flasher')) {
            if (!(Test-Path $env:TPL_REGIONAL)) { throw "Regional template missing: $env:TPL_REGIONAL" }

            # Folder name by type: 13R wants "Regional Flasher"
            $flasherFolderName = if ($ftype -eq 'Regional Flasher') { 'Regional Flasher' } else { 'RegionalHybrid Flasher' }
            $flasherDir = Join-Path $workDir $flasherFolderName
            New-Item -ItemType Directory -Force -Path $flasherDir | Out-Null

            # Copy template contents (contains Regional_Flasher*.bat + META-INF)
            Copy-Item (Join-Path $env:TPL_REGIONAL '*') -Destination $flasherDir -Recurse -Force

            # Optional platform-tools inside flasher folder
            if (Test-Path $env:PLATFORM_TOOLS) {
              Copy-Item $env:PLATFORM_TOOLS -Destination $flasherDir -Recurse -Force
            }

            # No Super/ here. Bloat → OOS_FILES_HERE/
            $oosDir = Join-Path $flasherDir "OOS_FILES_HERE"
            New-Item -ItemType Directory -Force -Path $oosDir | Out-Null

            if ($region -in @('EU','GLO')) {
              Copy-Bloat -bloatDir $env:BLOAT_EUGLO -dest $oosDir
            } elseif ($region -eq 'IN' -and (Test-Path $env:BLOAT_IN)) {
              Copy-Bloat -bloatDir $env:BLOAT_IN -dest $oosDir
            } elseif ($region -eq 'NA' -and (Test-Path $env:BLOAT_NA)) {
              Copy-Bloat -bloatDir $env:BLOAT_NA -dest $oosDir
            } elseif ($region -eq 'CN' -and (Test-Path $env:BLOAT_CN)) {
              Copy-Bloat -bloatDir $env:BLOAT_CN -dest $oosDir
            }

            # Optional: place a builder outside the flasher folder if present
            $builderCandidates = @(
              'REGIONALHYBRID_FULL_BUILD.bat',
              'REGIONALHYBRID_CN_FULL_BUILD.bat'
            )
            foreach ($cand in $builderCandidates) {
              $p = Join-Path $env:BUILD_SCRIPTS $cand
              if (Test-Path $p) { Copy-Item $p -Destination $workDir -Force }
            }

            if (Test-Path $env:OTARIPPER_EXE) { Copy-Item $env:OTARIPPER_EXE -Destination $workDir -Force }

            "FLASHER_DIR=$flasherDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          else {
            throw "Unknown flasher type: $ftype"
          }

          "WORK_DIR=$workDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Layout-only: do NOT execute any .bat scripts

      - name: Zip working directory (includes flasher folder + outer files)
        shell: pwsh
        run: |
          $workDir = $env:WORK_DIR
          if (!(Test-Path $workDir)) { throw "Working dir not found: $workDir" }
          Write-Host "Staged structure:"
          Get-ChildItem -LiteralPath $workDir -Recurse | ForEach-Object { $_.FullName }

          $devName   = "${{ inputs.device }}".Replace(' ','')
          $ftypeName = "${{ inputs.flasher_type }}".Replace(' ','')
          $region    = "${{ inputs.region }}"
          $ts        = Get-Date -Format "yyyyMMdd-HHmmss"
          $artifact  = "$devName-$ftypeName-$region-LAYOUT-$ts"
          "ARTIFACT_NAME=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append

          $zip = "$artifact.zip"
          Compress-Archive -Path "$workDir\*" -DestinationPath $zip -Force
          "ZIP_FILE=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
