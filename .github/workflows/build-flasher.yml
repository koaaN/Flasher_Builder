name: Build Flasher (with region bloat inside SuperHybrid)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prep OTA (download or placeholder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "download","$env:OUT_DIR" | Out-Null
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            Set-Content -Path "download\PLACEHOLDER.txt" -Value "Placeholder OTA for dry-run"
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\OTA.zip" -Force
          } else {
            $name = Split-Path $url -Leaf
            if ([string]::IsNullOrWhiteSpace($name)) { $name = "OTA.zip" }
            $dst = "download\$name"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            if ($name -ne "OTA.zip") {
              if (Test-Path "download\OTA.zip") { Remove-Item "download\OTA.zip" -Force }
              Rename-Item -Path $dst -NewName "OTA.zip"
            }
          }
          "OTA_PATH=$(Resolve-Path 'download\OTA.zip')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Map device → folder & pick builder
        shell: pwsh
        run: |
          $devDisp = "${{ inputs.device }}"
          $dev = switch ($devDisp) {
            'Oneplus 13'  { '13'  }
            'Oneplus 13R' { '13R' }
            'Oneplus 13S' { '13S' }
            'Oneplus 13T' { '13T' }
            default { throw "Unknown device: $devDisp" }
          }

          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"

          $batName = switch ($ftype) {
            'SuperHybrid Flasher' {
              if ($region -eq 'CN') { 'SUPERHYBRID_CN_FULL_SUPERBUILD.bat' }
              else { 'SUPERHYBRID_FULL_SUPERBUILD.bat' }
            }
            'RegionalHybrid Flasher' {
              if ($region -eq 'CN') { 'REGIONALHYBRID_CN_FULL_BUILD.bat' }
              else { 'REGIONALHYBRID_FULL_BUILD.bat' }
            }
            'SuperHybrid SunOS Flasher' { 'SUPERHYBRID_SUNOS_FULL_SUPERBUILD.bat' }
            default { throw "Unknown flasher type: $ftype" }
          }

          "DEV_FOLDER=$dev"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILDER_BAT=$batName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage files (template, otaripper, bloat inside SuperHybrid)
        shell: pwsh
        run: |
          $dev = $env:DEV_FOLDER
          $builderDir = Join-Path $env:GITHUB_WORKSPACE ("build_scripts\" + $dev)
          if (!(Test-Path $builderDir)) { throw "Missing builder dir: $builderDir" }

          # otaripper.exe next to builder
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'otaripper\otaripper.exe') -Destination $builderDir -Force

          # SuperHybrid Flasher template
          $templateSrc  = Join-Path $env:GITHUB_WORKSPACE ("flasher_scripts\" + $dev + "\oos\super")
          $templateDest = Join-Path $builderDir 'SuperHybrid Flasher'
          if (Test-Path $templateDest) { Remove-Item $templateDest -Recurse -Force }
          Copy-Item $templateSrc -Destination $templateDest -Recurse -Force

          # platform-tools inside SuperHybrid Flasher if requested
          if ("${{ inputs.flasher_type }}" -eq "SuperHybrid Flasher") {
            $ptSrc = Join-Path $env:GITHUB_WORKSPACE 'platform-tools'
            if (Test-Path $ptSrc) {
              Copy-Item $ptSrc -Destination $templateDest -Recurse -Force
            }
          }

          # 16DTBO next to builder (bat expects %~dp016DTBO)
          $src16 = Join-Path $templateSrc '16DTBO'
          if (Test-Path $src16) {
            Copy-Item $src16 -Destination (Join-Path $builderDir '16DTBO') -Recurse -Force
          }

          # Region bloat inside SuperHybrid Flasher
          $region = "${{ inputs.region }}"
          $bloatFolderName = switch ($region) {
            'EU'  { 'EUGLO_BLOAT' }
            'GLO' { 'EUGLO_BLOAT' }
            'IN'  { 'IN_BLOAT' }
            'NA'  { 'NA_BLOAT' }
            default { '' }
          }
          if ($bloatFolderName) {
            $bloatSrc = Join-Path $env:GITHUB_WORKSPACE ("bloat\" + $dev + "\" + $bloatFolderName)
            if (!(Test-Path $bloatSrc)) { $bloatSrc = Join-Path $env:GITHUB_WORKSPACE ("bloat\13\" + $bloatFolderName) }
            if (!(Test-Path $bloatSrc)) { throw "Missing bloat source: $bloatSrc" }
            Copy-Item $bloatSrc -Destination (Join-Path $templateDest $bloatFolderName) -Recurse -Force
          }

          "BUILDER_DIR=$builderDir"     | Out-File -FilePath $env:GITHUB_ENV -Append
          "TEMPLATE_DEST=$templateDest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run builder .bat
        shell: cmd
        working-directory: ${{ env.BUILDER_DIR }}
        run: |
          echo Running %BUILDER_BAT% with OTA: "%OTA_PATH%"
          call "%BUILDER_BAT%" "%OTA_PATH%"

      - name: Zip built SuperHybrid Flasher
        shell: pwsh
        run: |
          $otaDir = Split-Path -Parent $env:OTA_PATH
          $built = Join-Path $otaDir 'SuperHybrid Flasher'
          if (!(Test-Path $built)) { throw "Expected built folder not found: $built" }

          $devName   = "${{ inputs.device }}".Replace(' ','')
          $ftypeName = "${{ inputs.flasher_type }}".Replace(' ','')
          $region    = "${{ inputs.region }}"
          $ts        = Get-Date -Format "yyyyMMdd-HHmmss"
          $artifact  = "$devName-$ftypeName-$region-$ts"
          "ARTIFACT_NAME=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append

          $zip = "$artifact.zip"
          Compress-Archive -Path "$built\*" -DestinationPath $zip -Force
          "ZIP_FILE=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
