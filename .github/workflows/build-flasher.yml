name: Build Android Flasher from OTA

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: "Paste the FULL OTA.zip URL here (leave empty to dry-run with a placeholder)"
        type: string
        required: false
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - Super Flasher
          - Regional Flasher
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
      region:
        description: "Region (choose NONE only for 'SuperHybrid SunOS Flasher')"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
          - NONE
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - Sourceforge
          - Daniels Server
          - Both Sourceforge & Daniels Server
          - Artifact on GitHub

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build ${{ inputs.flasher_type }} • ${{ inputs.device }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: .  # Prevent double Build_Tools nesting

      - name: Validate inputs and placeholder logic
        shell: pwsh
        run: |
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            "USE_PLACEHOLDER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            if ($url -notmatch '^https?://') { throw "OTA URL must start with http(s)://" }
            "USE_PLACEHOLDER=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          if ("${{ inputs.flasher_type }}" -eq "SuperHybrid SunOS Flasher" -and "${{ inputs.region }}" -ne "NONE") {
            throw "Region must be NONE for SuperHybrid SunOS Flasher"
          }

      - name: Prepare environment
        shell: pwsh
        run: |
          choco install -y aria2 7zip
          New-Item -ItemType Directory -Force -Path "download", "$env:OUT_DIR" | Out-Null

      - name: Download or create placeholder OTA
        shell: pwsh
        run: |
          if ($env:USE_PLACEHOLDER -eq '1') {
            $text = "This is a placeholder OTA used for dry-run testing."
            Set-Content -Path "download\PLACEHOLDER.txt" -Value $text
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\ota-placeholder.zip" -Force
            "OTAFILE=$PWD\download\ota-placeholder.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            $url = "${{ inputs.ota_url }}"
            $file = "download\OTA.zip"
            aria2c -x16 -s16 -k1M -o "OTA.zip" -d "download" "$url"
            "OTAFILE=$PWD\$file" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Set OTA metadata
        shell: pwsh
        run: |
          $deviceDisp  = "${{ inputs.device }}"
          $ftypeDisp   = "${{ inputs.flasher_type }}"
          $regionDisp  = "${{ inputs.region }}"
          $device      = $deviceDisp -replace ' ', ''
          $ftype       = $ftypeDisp -replace ' ', ''
          $region      = if ($regionDisp -eq 'NONE') { '' } else { $regionDisp }
          $ver         = (Get-Date -Format "yyyyMMdd") + "-${device}-${ftype}"

          "DEVICE=$device" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DEVICE_DISPLAY=$deviceDisp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FTYPE_DISPLAY=$ftypeDisp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION=$regionDisp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "REGION_FOR_NAME=$region" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build flasher output
        shell: pwsh
        run: |
          $outBase = if ($env:REGION_FOR_NAME) { "$env:DEVICE-$env:FTYPE_DISPLAY-$env:REGION_FOR_NAME-$env:VERSION" } else { "$env:DEVICE-$env:FTYPE_DISPLAY-$env:VERSION" }
          $outDir = Join-Path $env:OUT_DIR $outBase
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          Copy-Item $env:OTAFILE -Destination "$outDir\OTA.zip"

          "ARTIFACT_NAME=$outBase" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Add README
          $note = if ($env:USE_PLACEHOLDER -eq '1') { "`nNOTE: Placeholder OTA used." } else { "" }
          "Device: $env:DEVICE_DISPLAY`nType: $env:FTYPE_DISPLAY`nRegion: $env:REGION`nVersion: $env:VERSION$note" |
            Out-File -FilePath "$outDir\README.txt" -Encoding utf8

          # Stage special files if OP13 + SuperHybrid Flasher + GLO
          if ($env:DEVICE_DISPLAY -eq "Oneplus 13" -and $env:FTYPE_DISPLAY -eq "SuperHybrid Flasher" -and $env:REGION -eq "GLO") {
            $superFs = "flasher_scripts\13\oos\super"
            $superPk = "super_packers\13"
            $lpmake  = "lpmake"

            $destMain  = Join-Path $outDir "Super Hybrid Flasher"
            $destSuper = Join-Path $destMain "Super"
            New-Item -ItemType Directory -Force -Path $destMain, $destSuper | Out-Null

            Copy-Item "$superFs\META-INF" -Destination $destMain -Recurse -Force
            Copy-Item "$superFs\dtbo_patcher.bat", "$superFs\Super_Flasher.bat" -Destination $destMain -Force
            Copy-Item "$superPk\super_oos.bat" -Destination $destSuper -Force
            Copy-Item "$lpmake\cygwin1.dll", "$lpmake\lpmake.exe" -Destination $destSuper -Force
          }

          # Zip output
          $zipName = "$outBase.zip"
          7z a -tzip "$zipName" "$outDir\*" | Out-Null
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to GitHub
        if: ${{ inputs.upload_to == 'Artifact on GitHub' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            *.zip
            ${{ env.OUT_DIR }}/${{ env.ARTIFACT_NAME }}/README.txt
