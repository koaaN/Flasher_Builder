name: Build Flasher

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
        default: Oneplus 13
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
          - Super Flasher
          - Regional Flasher
        default: SuperHybrid Flasher
      region:
        description: "Region"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
        default: GLO
      ota_url:
        description: "FULL OTA.zip URL (leave empty for placeholder)"
        type: string
        required: false

permissions:
  contents: read

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build • ${{ inputs.device }} • ${{ inputs.flasher_type }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prep OTA (download or placeholder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "download","$env:OUT_DIR" | Out-Null
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            Set-Content -Path "download\PLACEHOLDER.txt" -Value "Placeholder OTA for dry-run"
            Compress-Archive -Path "download\PLACEHOLDER.txt" -DestinationPath "download\OTA.zip" -Force
          } else {
            $name = Split-Path $url -Leaf
            if ([string]::IsNullOrWhiteSpace($name)) { $name = "OTA.zip" }
            $dst = "download\$name"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            if ($name -ne "OTA.zip") {
              if (Test-Path "download\OTA.zip") { Remove-Item "download\OTA.zip" -Force }
              Rename-Item -Path $dst -NewName "OTA.zip"
            }
          }
          "OTA_PATH=$(Resolve-Path 'download\OTA.zip')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Map device → folder & pick builder
        shell: pwsh
        run: |
          $devDisp = "${{ inputs.device }}"
          $dev = switch ($devDisp) {
            'Oneplus 13'  { '13' }
            'Oneplus 13R' { '13R' }
            'Oneplus 13S' { '13S' }
            'Oneplus 13T' { '13T' }
            default { throw "Unknown device: $devDisp" }
          }

          $ftype  = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"

          # pick builder bat based on type + region
          $batName = switch ($ftype) {
            'SuperHybrid Flasher' {
              if ($region -eq 'CN') { 'SUPERHYBRID_CN_FULL_SUPERBUILD.bat' }
              else { 'SUPERHYBRID_FULL_SUPERBUILD.bat' }
            }
            'RegionalHybrid Flasher' {
              if ($region -eq 'CN') { 'REGIONALHYBRID_CN_FULL_BUILD.bat' }
              else { 'REGIONALHYBRID_FULL_BUILD.bat' }
            }
            'SuperHybrid SunOS Flasher' { 'SUPERHYBRID_SUNOS_FULL_SUPERBUILD.bat' }
            'Super Flasher' {
              if ($dev -eq '13R' -and $region -eq 'CN') { 'SUPER_CN_FULL_SUPERBUILD.bat' }
              elseif ($dev -eq '13T' -and $region -eq 'CN') { 'SUPER_CN_FULL_SUPERBUILD.bat' }
              elseif ($dev -eq '13T') { 'SUPER_IN_FULL_SUPERBUILD.bat' }
              else { 'Super_Flasher' + $dev + '.bat' }
            }
            'Regional Flasher' {
              if ($dev -eq '13R' -and $region -eq 'CN') { 'REGIONAL_CN_FULL_BUILD.bat' }
              else { 'Regional_Flasher' + $dev + '.bat' }
            }
            default { throw "Unknown flasher type: $ftype" }
          }

          "DEV_FOLDER=$dev"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILDER_BAT=$batName"  | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage files
        shell: pwsh
        run: |
          $dev       = $env:DEV_FOLDER
          $ftype     = "${{ inputs.flasher_type }}"
          $region    = "${{ inputs.region }}"
          $builderDir = Join-Path $env:GITHUB_WORKSPACE ("build_scripts\" + $dev)

          if (!(Test-Path $builderDir)) { throw "Missing builder dir: $builderDir" }

          # Stage otaripper + builder script in OUT_DIR (not inside builderDir)
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'otaripper\otaripper.exe') -Destination $env:OUT_DIR -Force
          Copy-Item (Join-Path $builderDir $env:BUILDER_BAT) -Destination $env:OUT_DIR -Force

          # working folder name
          $workName = switch ($ftype) {
            'SuperHybrid Flasher'       { if ($region -eq 'CN') { 'SuperHybrid Flasher CN' } else { 'SuperHybrid Flasher' } }
            'RegionalHybrid Flasher'    { if ($region -eq 'CN') { 'RegionalHybrid Flasher CN' } else { 'RegionalHybrid Flasher' } }
            'SuperHybrid SunOS Flasher' { 'SuperHybrid SunOS Flasher' }
            'Super Flasher'             { 'Super Flasher' }
            'Regional Flasher'          { 'Regional Flasher' }
          }

          $outWork = Join-Path $env:OUT_DIR $workName
          if (Test-Path $outWork) { Remove-Item $outWork -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $outWork | Out-Null

          # copy flasher template
          $templateSrc = Join-Path $env:GITHUB_WORKSPACE ("flasher_scripts\" + $dev)
          if ($ftype -like '*Hybrid*') {
            if ($region -eq 'CN') { $templateSrc = Join-Path $templateSrc 'cos' }
            else { $templateSrc = Join-Path $templateSrc 'oos' }
          } elseif ($ftype -eq 'Super Flasher' -or $ftype -eq 'Regional Flasher') {
            $templateSrc = Join-Path $templateSrc 'oos'
          }
          if ($ftype -like '*Hybrid*') {
            if ($ftype -like '*Super*') { $templateSrc = Join-Path $templateSrc 'super' }
            else { $templateSrc = Join-Path $templateSrc 'regional' }
          } elseif ($ftype -eq 'Super Flasher') {
            if ($region -eq 'CN' -and $dev -eq '13T') { $templateSrc = Join-Path $templateSrc 'cos\super' }
            else { $templateSrc = Join-Path $templateSrc 'super' }
          } elseif ($ftype -eq 'Regional Flasher') {
            if ($region -eq 'CN' -and $dev -eq '13R') { $templateSrc = Join-Path $templateSrc 'cos\regional' }
            else { $templateSrc = Join-Path $templateSrc 'regional' }
          }

          Copy-Item $templateSrc\* -Destination $outWork -Recurse -Force

          # only Hybrids get META-INF
          if ($ftype -like '*Hybrid*') {
            $metaSrc = Join-Path $templateSrc 'META-INF'
            if (Test-Path $metaSrc) {
              Copy-Item $metaSrc -Destination (Join-Path $outWork 'META-INF') -Recurse -Force
            }
          }

          # platform-tools only for hybrids
          if ($ftype -eq 'SuperHybrid Flasher') {
            $ptSrc = Join-Path $env:GITHUB_WORKSPACE 'platform-tools'
            if (Test-Path $ptSrc) { Copy-Item $ptSrc -Destination $outWork -Recurse -Force }
          }

          # Super folder setup
          if ($ftype -eq 'SuperHybrid Flasher' -or $ftype -eq 'Super Flasher' -or $ftype -eq 'SuperHybrid SunOS Flasher') {
            $superDir = Join-Path $outWork 'Super'
            New-Item -ItemType Directory -Force -Path $superDir | Out-Null
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'lpmake\lpmake.exe') -Destination $superDir -Force
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'lpmake\cygwin1.dll') -Destination $superDir -Force

            if ($dev -eq '13T') {
              if ($region -eq 'CN') {
                Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'super_packers\13T\super_cos.bat') -Destination $superDir -Force
              } else {
                Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'super_packers\13T\super_oos.bat') -Destination $superDir -Force
              }
            } else {
              Copy-Item (Join-Path $env:GITHUB_WORKSPACE ("super_packers\" + $dev + "\super_oos.bat")) -Destination $superDir -Force -ErrorAction SilentlyContinue
            }
          }

          # bloat rules
          $bloatBase = Join-Path $env:GITHUB_WORKSPACE ("bloat\" + $dev)
          switch ($ftype) {
            'SuperHybrid Flasher' {
              if ($region -eq 'CN') {
                Copy-Item (Join-Path $bloatBase 'CN_BLOAT\my_preload.img') -Destination (Join-Path $outWork 'Super') -Force
                Copy-Item (Join-Path $bloatBase 'CN_BLOAT\my_company.img') -Destination (Join-Path $outWork 'Super') -Force
                Copy-Item (Join-Path $bloatBase 'EUGLO_BLOAT\my_preload.img') -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
                Copy-Item (Join-Path $bloatBase 'EUGLO_BLOAT\my_company.img') -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
              } else {
                $folder = switch ($region) {
                  'EU' { 'EUGLO_BLOAT' }
                  'GLO'{ 'EUGLO_BLOAT' }
                  'IN' { 'IN_BLOAT' }
                  'NA' { 'NA_BLOAT' }
                }
                if ($folder) {
                  Copy-Item (Join-Path $bloatBase "$folder\my_preload.img") -Destination (Join-Path $outWork 'Super') -Force
                  Copy-Item (Join-Path $bloatBase "$folder\my_company.img") -Destination (Join-Path $outWork 'Super') -Force
                }
              }
            }
            'RegionalHybrid Flasher' {
              if ($region -eq 'CN') {
                Copy-Item (Join-Path $bloatBase 'CN_BLOAT\my_preload.img') -Destination (Join-Path $outWork 'COS_FILES_HERE') -Force
                Copy-Item (Join-Path $bloatBase 'CN_BLOAT\my_company.img') -Destination (Join-Path $outWork 'COS_FILES_HERE') -Force
                Copy-Item (Join-Path $bloatBase 'EUGLO_BLOAT\my_preload.img') -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
                Copy-Item (Join-Path $bloatBase 'EUGLO_BLOAT\my_company.img') -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
              } else {
                $folder = switch ($region) {
                  'EU' { 'EUGLO_BLOAT' }
                  'GLO'{ 'EUGLO_BLOAT' }
                  'IN' { 'IN_BLOAT' }
                  'NA' { 'NA_BLOAT' }
                }
                if ($folder) {
                  Copy-Item (Join-Path $bloatBase "$folder\my_preload.img") -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
                  Copy-Item (Join-Path $bloatBase "$folder\my_company.img") -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
                }
              }
            }
            'Super Flasher' {
              if ($region -eq 'CN') {
                Copy-Item (Join-Path $bloatBase 'CN_BLOAT\my_preload.img') -Destination (Join-Path $outWork 'Super') -Force
                Copy-Item (Join-Path $bloatBase 'CN_BLOAT\my_company.img') -Destination (Join-Path $outWork 'Super') -Force
                if ($dev -eq '13R') {
                  Copy-Item (Join-Path $bloatBase 'A5_DEBLOAT\my_preload.img') -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
                  Copy-Item (Join-Path $bloatBase 'A5_DEBLOAT\my_company.img') -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
                } elseif ($dev -eq '13T') {
                  Copy-Item (Join-Path $bloatBase 'EUGLO_BLOAT\my_preload.img') -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
                  Copy-Item (Join-Path $bloatBase 'EUGLO_BLOAT\my_company.img') -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
                }
              } else {
                $folder = switch ($region) {
                  'EU' { 'EUGLO_BLOAT' }
                  'GLO'{ 'EUGLO_BLOAT' }
                  'IN' { 'IN_BLOAT' }
                  'NA' { 'NA_BLOAT' }
                }
                if ($folder) {
                  Copy-Item (Join-Path $bloatBase "$folder\my_preload.img") -Destination (Join-Path $outWork 'Super') -Force
                  Copy-Item (Join-Path $bloatBase "$folder\my_company.img") -Destination (Join-Path $outWork 'Super') -Force
                }
              }
            }
            'Regional Flasher' {
              if ($region -eq 'CN') {
                Copy-Item (Join-Path $bloatBase 'CN_BLOAT\my_preload.img') -Destination (Join-Path $outWork 'COS_FILES_HERE') -Force
                Copy-Item (Join-Path $bloatBase 'CN_BLOAT\my_company.img') -Destination (Join-Path $outWork 'COS_FILES_HERE') -Force
                if ($dev -eq '13R') {
                  Copy-Item (Join-Path $bloatBase 'A5_DEBLOAT\my_preload.img') -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
                  Copy-Item (Join-Path $bloatBase 'A5_DEBLOAT\my_company.img') -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
                } else {
                  Copy-Item (Join-Path $bloatBase 'EUGLO_BLOAT\my_preload.img') -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
                  Copy-Item (Join-Path $bloatBase 'EUGLO_BLOAT\my_company.img') -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
                }
              } else {
                $folder = switch ($region) {
                  'EU' { 'EUGLO_BLOAT' }
                  'GLO'{ 'EUGLO_BLOAT' }
                  'IN' { 'IN_BLOAT' }
                  'NA' { 'NA_BLOAT' }
                }
                if ($folder) {
                  Copy-Item (Join-Path $bloatBase "$folder\my_preload.img") -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
                  Copy-Item (Join-Path $bloatBase "$folder\my_company.img") -Destination (Join-Path $outWork 'OOS_FILES_HERE') -Force
                }
              }
            }
          }

          "WORK_DIR=$outWork" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Zip staged flasher
        shell: pwsh
        run: |
          $work = $env:WORK_DIR
          $devName   = "${{ inputs.device }}".Replace(' ','')
          $ftypeName = "${{ inputs.flasher_type }}".Replace(' ','')
          $region    = "${{ inputs.region }}"
          $ts        = Get-Date -Format "yyyyMMdd-HHmmss"
          $artifact  = "$devName-$ftypeName-$region-$ts"

          $zip = "$artifact.zip"
          Compress-Archive -Path "$work\*" -Destination
