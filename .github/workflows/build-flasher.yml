name: Build Android Flasher from OTA

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: "Paste the FULL OTA.zip URL here (leave empty to dry-run with a placeholder)"
        type: string
        required: false
      device:
        description: "Device"
        type: choice
        required: true
        options:
          - Oneplus 13
          - Oneplus 13R
          - Oneplus 13S
          - Oneplus 13T
      flasher_type:
        description: "Flasher type"
        type: choice
        required: true
        options:
          - Super Flasher
          - Regional Flasher
          - SuperHybrid Flasher
          - RegionalHybrid Flasher
          - SuperHybrid SunOS Flasher
      region:
        description: "Region (choose NONE only for 'SuperHybrid SunOS Flasher')"
        type: choice
        required: true
        options:
          - GLO
          - EU
          - IN
          - NA
          - CN
          - NONE
      upload_to:
        description: "Upload To"
        type: choice
        required: true
        options:
          - Sourceforge
          - Daniels Server
          - Both Sourceforge & Daniels Server
          - Artifact on GitHub

permissions:
  contents: read

concurrency:
  group: flasher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OUT_DIR: out
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build ${{ inputs.flasher_type }} • ${{ inputs.device }} • ${{ inputs.region }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        shell: pwsh
        run: |
          $url = "${{ inputs.ota_url }}".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            "USE_PLACEHOLDER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            if ($url -notmatch '^https?://') { throw "OTA URL must start with http(s)://"; }
            "USE_PLACEHOLDER=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          $ftype = "${{ inputs.flasher_type }}"
          $region = "${{ inputs.region }}"
          if ($ftype -eq 'SuperHybrid SunOS Flasher' -and $region -ne 'NONE') {
            throw "Region must be NONE for SuperHybrid SunOS Flasher."
          }
          if ($ftype -ne 'SuperHybrid SunOS Flasher' -and $region -eq 'NONE') {
            throw "Region NONE is only valid for SuperHybrid SunOS Flasher."
          }

      - name: Setup tools
        shell: pwsh
        run: |
          choco install -y aria2 7zip
          mkdir -Force "$env:OUT_DIR", "download" | Out-Null

      - name: Download or create placeholder OTA
        shell: pwsh
        run: |
          if ($env:USE_PLACEHOLDER -eq '1') {
            Set-Content -Path "download\placeholder.txt" -Value "Dry run OTA" -Encoding ascii
            Compress-Archive -Path "download\placeholder.txt" -DestinationPath "download\ota-placeholder.zip" -Force
            $dst = "download\ota-placeholder.zip"
          } else {
            $url = "${{ inputs.ota_url }}"
            $dst = "download\" + (Split-Path $url -Leaf)
            aria2c -x16 -s16 -k1M --allow-overwrite=true -o (Split-Path $dst -Leaf) -d "download" "$url"
          }
          $sha = (Get-FileHash -Path $dst -Algorithm SHA256).Hash
          $sha | Out-File -FilePath "$dst.sha256.txt" -Encoding ascii
          "DOWNLOADED_ZIP=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate metadata
        shell: pwsh
        run: |
          $f = Get-Item -Path $env:DOWNLOADED_ZIP
          $base = [IO.Path]::GetFileNameWithoutExtension($f.Name)
          $ver = $base -replace '[^0-9A-Za-z._-]',''
          if ($ver.Length -lt 4) {
            $ver = (Get-Date -Format "yyyyMMdd") + "-" + ((Get-FileHash $f).Hash.Substring(0,8))
          }

          $region = if ("${{ inputs.region }}" -eq 'NONE') { '' } else { "${{ inputs.region }}" }
          "DEVICE=$("${{ inputs.device }}".Replace(' ',''))
          DEVICE_DISPLAY=${{ inputs.device }}
          FTYPE=$("${{ inputs.flasher_type }}".Replace(' ',''))
          FTYPE_DISPLAY=${{ inputs.flasher_type }}
          REGION=${{ inputs.region }}
          REGION_FOR_NAME=$region
          VERSION=$ver
          OTAFILE=$($f.FullName)" -split "`n" | ForEach-Object {
            $_ | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build flasher files
        shell: pwsh
        run: |
          $outName = if ($env:REGION_FOR_NAME) {
            "$env:DEVICE-$env:FTYPE-$env:REGION_FOR_NAME-$env:VERSION"
          } else {
            "$env:DEVICE-$env:FTYPE-$env:VERSION"
          }
          $outBase = Join-Path $env:OUT_DIR $outName
          "ARTIFACT_NAME=$outName" | Out-File -FilePath $env:GITHUB_ENV -Append

          mkdir $outBase -Force | Out-Null
          Copy-Item $env:OTAFILE -Destination "$outBase\OTA.zip"
          Set-Content -Path "$outBase\README.txt" -Value "Device: $env:DEVICE_DISPLAY`nType: $env:FTYPE_DISPLAY`nRegion: $env:REGION`nVersion: $env:VERSION" -Encoding utf8

          function Find-Dir([string]$p) {
            Get-ChildItem -Recurse -Directory -Force | Where-Object { $_.FullName -like "*$p" } | Select-Object -ExpandProperty FullName -First 1
          }

          $fs = Find-Dir("flasher_scripts\13\oos\super")
          $pk = Find-Dir("super_packers\13")
          $lp = Find-Dir("lpmake")

          if ($env:DEVICE_DISPLAY -eq 'Oneplus 13' -and $env:FTYPE_DISPLAY -eq 'SuperHybrid Flasher' -and $env:REGION -eq 'GLO') {
            $dstHybrid = Join-Path $outBase 'Super Hybrid Flasher'
            $dstSuper  = Join-Path $dstHybrid 'Super'
            mkdir $dstHybrid, $dstSuper -Force | Out-Null

            Copy-Item "$fs\META-INF" -Destination $dstHybrid -Recurse -Force
            Copy-Item "$fs\dtbo_patcher.bat", "$fs\Super.Flasher.bat" -Destination $dstHybrid -Force
            Copy-Item "$pk\super_oos.bat" -Destination $dstSuper -Force
            Copy-Item "$lp\cygwin1.dll", "$lp\lpmake.exe" -Destination $dstSuper -Force
          }

          7z a "$outName.zip" "$outBase\*" | Out-Null
          "ZIP_NAME=$outName.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: SHA256 and BUILD_INFO
        shell: pwsh
        run: |
          $zip = $env:ZIP_NAME
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          $hash | Out-File "$zip.sha256" -Encoding ascii
          $url = if ($env:USE_PLACEHOLDER -eq '1') { "(placeholder)" } else { "${{ inputs.ota_url }}" }
          "device=$env:DEVICE_DISPLAY`nflasher_type=$env:FTYPE_DISPLAY`nregion=$env:REGION`nversion=$env:VERSION`nota_url=$url`nartifact=$zip`nsha256=$hash" |
            Out-File -FilePath "BUILD_INFO.txt" -Encoding utf8

      - name: Upload to SourceForge
        if: ${{ inputs.upload_to == 'Sourceforge' || inputs.upload_to == 'Both Sourceforge & Daniels Server' }}
        shell: pwsh
        env:
          SF_USER: ${{ secrets.SF_USERNAME }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          SF_PATH: ${{ secrets.SF_PATH }}
        run: |
          $zip = $env:ZIP_NAME
          $host = "frs.sourceforge.net"
          $remote = "/home/frs/project/$env:SF_PROJECT/$env:SF_PATH"
          $key = "$env:USERPROFILE\.ssh\sf_key"
          New-Item -Path "$env:USERPROFILE\.ssh" -ItemType Directory -Force | Out-Null
          Set-Content -Path $key -Value "${{ secrets.SF_SSH_KEY }}"
          ssh -i $key -o StrictHostKeyChecking=no "$env:SF_USER@$host" "mkdir -p '$remote'"
          scp -i $key -o StrictHostKeyChecking=no "$zip" "$zip.sha256" "BUILD_INFO.txt" "$env:SF_USER@$host:`"$remote/`""

      - name: Upload to Daniels Server
        if: ${{ inputs.upload_to == 'Daniels Server' || inputs.upload_to == 'Both Sourceforge & Daniels Server' }}
        shell: pwsh
        env:
          DAN_USER: ${{ secrets.DAN_USER }}
          DAN_HOST: ${{ secrets.DAN_HOST }}
          DAN_PATH: ${{ secrets.DAN_PATH }}
        run: |
          $zip = $env:ZIP_NAME
          $key = "$env:USERPROFILE\.ssh\dan_key"
          New-Item -Path "$env:USERPROFILE\.ssh" -ItemType Directory -Force | Out-Null
          Set-Content -Path $key -Value "${{ secrets.DAN_SSH_KEY }}"
          ssh -i $key -o StrictHostKeyChecking=no "$env:DAN_USER@$env:DAN_HOST" "mkdir -p '$env:DAN_PATH'"
          scp -i $key -o StrictHostKeyChecking=no "$zip" "$zip.sha256" "BUILD_INFO.txt" "$env:DAN_USER@$env:DAN_HOST:`"$env:DAN_PATH/`""

      - name: Upload to GitHub Artifacts
        if: ${{ inputs.upload_to == 'Artifact on GitHub' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            *.zip
            *.sha256
            BUILD_INFO.txt
            download/*.sha256.txt
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
